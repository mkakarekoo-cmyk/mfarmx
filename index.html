<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-FarmX — gospodarstwo</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet-draw@1.0.4/dist/leaflet.draw.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  /* ===== Zagon — almanach polowy ===== */
  :root{
    /* ─── UKŁAD STRONY — regulowany suwakami (panel „Układ" w prawym dolnym rogu) ───
       Wartości domyślne = dzisiejszy wygląd. Panel podmienia je na żywo na elemencie <html>,
       a `state.ui.uklad` zapamiętuje ustawienie po zapisaniu.
       ⚠️ Zmieniając te reguły pamiętaj, że każda jest sterowana z panelu — wpisanie
       liczby na sztywno cicho wyłączy odpowiedni suwak. */
    --u-skala:1;        /* powiększenie obszaru roboczego */
    --u-szer:1180px;    /* szerokość treści */
    --u-gestosc:1;      /* odstępy: mniej = ciaśniej */
    --u-krata:132px;     /* wysokość kratki w grafiku */
    --u-prac:168px;     /* szerokość kolumny pracownika */
    --u-panel:280px;    /* szerokość panelu zasobów */
    --u-rog:8px;        /* zaokrąglenie rogów */

    /* ═══ DESIGN TOKENS — My Agro ═════════════════════════════════════════════
       JEDYNE miejsce, w którym mieszkają kolory. Reguły niżej i kod JS sięgają po
       zmienne, nigdy po wartość hex.
       ⚠️ Nie wpisuj koloru na sztywno w regule ani w stylu inline — po pierwszym takim
       wpisie aplikacja zaczyna się rozjeżdżać na „80% nowa stylistyka, 20% stara".
       Nowy kolor = nowy token tutaj.

       Kierunek: AGRI + INDUSTRIAL + MANAGEMENT. Stonowana, techniczna zieleń zamiast
       jaskrawego „farm green"; grafit jako kolor sprzętu i danych; bursztyn wyłącznie
       na to, co dzieje się TERAZ. */

    /* Powierzchnie */
    --app-bg:#F6F7F5;
    --surface:#FFFFFF;
    --surface-secondary:#FBFCFA;
    --sidebar:#142329;
    --sidebar-hover:#1C3036;
    --sidebar-active:#18282E;
    --topbar:#142329;
    --border:#E2E6E1;
    --border-light:#EDF0EC;

    /* Marka — stonowana zieleń, nie neon. */
    --primary:#287A4B;
    --primary-hover:#21663F;
    --primary-soft:#EAF5EE;

    /* Akcent — ciepły bursztyn, OSZCZĘDNIE: praca w toku, wybrane pole, ważna liczba. */
    --accent:#D99A24;
    --accent-soft:#FBF1DD;

    /* Promienie i cienie — jeden zestaw na całą aplikację. */
    --radius-sm:6px;
    --radius-md:8px;
    --radius-lg:12px;
    --shadow-sm:0 1px 2px rgba(20,35,41,.05);
    --shadow-md:0 2px 8px rgba(20,35,41,.08);

    /* ⚠️ Aliasy poprzedniej rundy — zostają, bo kilkaset reguł już na nich siedzi.
       Nowego kodu na nich nie pisz; docelowe nazwy są wyżej. */
    --color-bg:var(--app-bg);
    --color-surface:var(--surface);
    --color-surface-2:var(--surface-secondary);
    --color-sidebar:var(--sidebar);
    --color-dark:var(--topbar);
    --color-dark-2:var(--sidebar-hover);
    --color-border:var(--border);
    --color-border-soft:var(--border-light);
    --color-primary:var(--primary);
    --color-primary-hover:var(--primary-hover);
    --color-primary-soft:var(--primary-soft);
    --color-accent:var(--accent);
    --color-accent-soft:var(--accent-soft);

    /* Tekst */
    --color-text:#202724;
    --color-text-muted:#68716D;
    --color-text-invert:#EDF1EE;

    /* Statusy — stonowane, żadnych neonów */
    --color-success:#4A7C59;
    --color-success-soft:#E8F0EA;
    --color-warning:#C58A3A;
    --color-warning-soft:#F7EEDF;
    --color-danger:#A94F45;
    --color-danger-soft:#F5E7E5;
    --color-info:#4A6D80;
    --color-info-soft:#E6EDF1;
    --color-neutral:#68716D;
    --color-neutral-soft:#EDEFEE;

    /* Rodzaje pracy w Grafiku — różnicowane TYPEM, nie natężeniem koloru (§12) */
    --work-field:#476B55;
    --work-workshop:#4A5257;
    --work-transport:#4A6D80;
    --work-farm:#6B5F7A;
    --work-other:#68716D;

    /* Mapa */
    --map-field-border:#476B55;
    --map-field-active:#C58A3A;
    --map-hq:#1F2A2E;

    --shadow:var(--shadow-sm);
    --shadow-lift:var(--shadow-md);

    /* ── Zgodność wsteczna ────────────────────────────────────────────────────
       Stare nazwy zostają jako ALIASY nowych tokenów. Dzięki temu kilkaset reguł
       napisanych przez ostatnie tygodnie przechodzi na nową paletę bez dotykania ich
       jedna po drugiej — a każda z nich dalej wskazuje na jedno źródło prawdy.
       Nowego kodu na tych nazwach już nie pisz. */
    --ink:var(--color-text);
    --ink-soft:var(--color-text-muted);
    --paper:var(--color-bg);
    --card:var(--color-surface);
    --card-2:var(--color-surface-2);
    --pole:var(--color-primary);
    --pole-dark:var(--color-primary-hover);
    --pole-light:#6E8C77;
    --wheat:var(--color-accent);
    --rust:var(--color-danger);
    --success:var(--color-success);
    --line:var(--color-border-soft);
    --line-strong:var(--color-border);
    --line2:var(--color-neutral-soft);
    --serif:'Inter','Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
    --sans:'Inter','Roboto',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'Roboto',system-ui,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--paper);
    -webkit-font-smoothing:antialiased;line-height:1.5;
  }
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  button{font-family:inherit}

  /* ---------- Layout: sidebar + treść ---------- */
  .layout{display:flex;min-height:100vh}
  .sidebar{width:236px;flex-shrink:0;background:var(--color-sidebar);border-right:1px solid #0F1619;
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;gap:4px;overflow-y:auto;z-index:1100}
  .sb-brand{display:flex;align-items:baseline;gap:8px;padding:4px 8px 16px;cursor:pointer;user-select:none}
  .sb-brand .glyph{font-family:var(--serif);font-size:24px;font-weight:600;color:var(--color-text-invert);
    line-height:1;letter-spacing:-.01em}
  .sb-brand .glyph::first-letter{color:var(--color-accent)}
  .sb-brand .tag{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:#7C8A8E}
  .sb-nav{display:flex;flex-direction:column;gap:3px}
  .sb-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--ink-soft);
    font-size:15px;border:1px solid transparent;transition:.12s;text-align:left;background:none;font-family:var(--sans);width:100%}
  .sb-item .ic{font-size:18px;width:22px;text-align:center;flex-shrink:0}
  .sb-item{position:relative}
  .sb-item:hover{background:rgba(255,255,255,.06);color:var(--color-text-invert)}
  /* Aktywna pozycja: pasek po lewej + odrobinę jaśniejsze tło. Duży kolorowy prostokąt
     krzyczał i przykuwał wzrok mocniej niż treść strony. */
  .sb-item.active{background:rgba(255,255,255,.09);color:#FFFFFF;font-weight:600;
    border-color:transparent;box-shadow:none}
  .sb-item.active::before{content:'';position:absolute;left:0;top:7px;bottom:7px;width:3px;
    border-radius:0 2px 2px 0;background:var(--color-accent)}
  .sb-item.active .ic{filter:none;opacity:1}
  .sb-count{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:#8B989C;
    background:rgba(255,255,255,.07);border-radius:99px;padding:1px 7px}
  .sb-item.active .sb-count{color:var(--color-accent);background:rgba(197,138,58,.16)}
  .sb-sep{height:1px;background:rgba(255,255,255,.10);margin:10px 4px}
  .sb-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.10);
    display:flex;flex-direction:column;gap:9px}
  .sb-farm-lbl{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:#7C8A8E;padding:0 4px}
  .sb-farm{font-family:var(--serif);font-size:16px;color:var(--ink);width:100%;border:none;background:transparent;
    border-bottom:1px dashed var(--line-strong);padding:3px 4px}
  .sb-farm:focus{outline:none;border-bottom-color:var(--color-accent)}
  .sb-backup{display:flex;gap:7px}
  .sb-saved{font-size:10.5px;color:#7C8A8E;padding:0 4px}
  .content{flex:1;min-width:0;padding:calc(26px*var(--u-gestosc)) calc(30px*var(--u-gestosc));
    max-width:var(--u-szer);margin:0 auto;width:100%;zoom:var(--u-skala)}
  .module-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
  .module-head h1{font-family:var(--serif);font-size:32px;margin:0;line-height:1.05}
  .module-head .sub{color:var(--ink-soft);font-size:13.5px;margin-top:5px}
  .module-head .spacer{margin-left:auto}
  .mini-stats{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px}
  .mini-stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;box-shadow:var(--shadow);min-width:120px}
  .mini-stat b{font-family:var(--mono);font-size:22px;color:var(--pole-dark);display:block;line-height:1.1}
  .mini-stat span{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft)}
  @media(max-width:900px){
    .layout{flex-direction:column}
    .sidebar{width:100%;height:auto;position:sticky;top:0;flex-direction:row;align-items:center;padding:9px 12px;gap:4px;overflow-x:auto;overflow-y:hidden}
    .sb-brand{padding:4px 6px;flex-shrink:0}
    .sb-brand .tag{display:none}
    .sb-nav{flex-direction:row;flex:0 0 auto}
    .sb-item{white-space:nowrap;padding:8px 11px}
    .sb-item .lbl{display:none} .sb-item .ic{font-size:20px}
    .sb-item.active .lbl{display:inline}
    .sb-count{display:none}
    .sb-foot{margin:0 0 0 auto;padding:0;border:none;flex-direction:row;align-items:center;flex-shrink:0}
    .sb-farm-lbl,.sb-farm,.sb-saved{display:none}
    .content{padding:16px}
  }

  /* ---------- Karty modułów (Flota / Bydło) ---------- */
  .tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .tile{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:.14s;display:flex;flex-direction:column}
  .tile:hover{transform:translateY(-3px);border-color:var(--line-strong)}
  .tile-bar{height:5px}
  .tile-body{padding:15px 16px}
  .tile-name{font-family:var(--serif);font-size:20px;margin:0;line-height:1.15}
  .tile-sub{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
  .tile-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding-top:11px;border-top:1px solid var(--line)}
  .tile-row .big{font-family:var(--mono);font-size:18px;color:var(--pole-dark)}
  .tile-row .lab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
  .tag-pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;background:var(--card-2);border:1px solid var(--line);color:var(--ink-soft)}

  /* ---------- Finanse ---------- */
  .fin-months{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:24px}
  .fin-month{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 13px;box-shadow:var(--shadow);cursor:pointer;transition:.12s}
  .fin-month:hover{border-color:var(--line-strong)}
  .fin-month.active{border-color:var(--wheat);box-shadow:0 0 0 2px rgba(200,155,44,.3)}
  .fin-month .m{font-size:12px;color:var(--ink-soft);text-transform:capitalize}
  .fin-month .v{font-family:var(--mono);font-size:16px;color:var(--rust);font-weight:600;margin-top:3px}
  .fin-month .v.plus{color:var(--pole-dark)}
  .cat-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  .cat-chip{display:flex;align-items:center;gap:7px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:13px}
  .cat-chip .dot{width:10px;height:10px;border-radius:50%}
  .cat-chip b{font-family:var(--mono)}
  .fin-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
  .fin-table th{text-align:left;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line-strong);background:rgba(255,255,255,.5)}
  .fin-table td{padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px}
  .fin-table tr:last-child td{border-bottom:none}
  .fin-month-head td{background:rgba(43,38,32,.05);font-weight:600;font-family:var(--serif);font-size:16px}
  .fin-amt{font-family:var(--mono);text-align:right;white-space:nowrap}
  .fin-amt.koszt{color:var(--rust)} .fin-amt.przychod{color:var(--pole-dark)}

  /* ---------- Nagłówek (stary, nieużywany po przejściu na sidebar) ---------- */
  .topbar{position:sticky;top:0;z-index:1100;background:linear-gradient(180deg,#EBECE0,#E4E5D8);
    border-bottom:1px solid var(--line-strong);box-shadow:0 6px 18px -18px rgba(43,38,32,.9)}
  .topbar-inner{max-width:1180px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px;cursor:pointer;user-select:none}
  .brand .glyph{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--pole-dark);letter-spacing:-.01em;line-height:1}
  .brand .glyph::first-letter{color:var(--wheat)}
  .brand .tag{font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-soft)}
  .farm-name{font-family:var(--serif);font-size:18px;color:var(--ink);border:none;background:transparent;
    border-bottom:1px dashed transparent;padding:2px 2px;min-width:120px;max-width:260px}
  .farm-name:hover{border-bottom-color:var(--line-strong)}
  .farm-name:focus{outline:none;border-bottom-color:var(--pole)}
  .stats{display:flex;gap:26px;margin-left:auto;align-items:center}
  .stat{text-align:right;line-height:1.15}
  .stat b{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--pole-dark);display:block}
  .stat span{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft)}
  .top-actions{display:flex;gap:8px;align-items:center}

  /* ---------- Przyciski ---------- */
  .btn{border:1px solid var(--line-strong);background:var(--card);color:var(--ink);padding:8px 13px;border-radius:9px;
    font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:.12s;white-space:nowrap}
  .btn:hover{background:var(--card-2);border-color:var(--ink-soft);transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:var(--pole);border-color:var(--pole-dark);color:#F7F6EF;font-weight:600}
  .btn.primary:hover{background:var(--pole-dark)}
  .btn.ghost{background:transparent;border-color:transparent}
  .btn.ghost:hover{border-color:var(--line)}
  .btn.small{padding:5px 10px;font-size:12.5px;border-radius:7px}
  .btn.danger:hover{border-color:var(--rust);color:var(--rust)}

  /* ---------- Zakładki widoku ---------- */
  main{max-width:1180px;margin:0 auto;padding:22px}
  .tabs{display:flex;align-items:center;gap:4px;margin-bottom:20px;flex-wrap:wrap}
  .tab{font-family:var(--serif);font-size:16px;padding:7px 4px;margin-right:18px;border:none;background:none;
    cursor:pointer;color:var(--ink-soft);border-bottom:2px solid transparent}
  .tab.active{color:var(--ink);border-bottom-color:var(--wheat)}
  .year-pick{margin-left:auto;display:flex;align-items:center;gap:8px}
  select,input,textarea{font-family:var(--sans);font-size:14px;color:var(--ink)}
  .sel{padding:6px 10px;border:1px solid var(--line-strong);border-radius:8px;background:var(--card);font-family:var(--mono);font-size:14px}

  /* ---------- Mapa ---------- */
  .map-toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .map-search{flex:1;min-width:180px;max-width:360px;padding:9px 12px;border:1px solid var(--line-strong);
    border-radius:9px;background:var(--card-2)}
  #map{height:min(72vh,640px);width:100%;border-radius:14px;border:1px solid var(--line-strong);box-shadow:var(--shadow);z-index:1}
  .map-off{display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;height:min(72vh,640px);
    color:var(--ink-soft);text-align:center;padding:30px;border-radius:14px;border:1px solid var(--line-strong);
    background:repeating-linear-gradient(45deg,#e9e7db 0 12px,#efedE3 12px 24px)}
  .map-hint{font-size:12.5px;color:var(--ink-soft);margin-top:10px;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
  .leaflet-tooltip.field-label{background:rgba(43,38,32,.82);color:#F7F6EF;border:none;font-family:var(--sans);
    font-weight:600;font-size:12px;border-radius:6px;box-shadow:none;padding:3px 8px;white-space:nowrap}
  .leaflet-tooltip.field-label::before{display:none}
  .leaflet-tooltip.field-label small{font-family:var(--mono);opacity:.85;font-weight:400}
  .drawing-banner{background:var(--wheat);color:#2B2620;padding:9px 14px;border-radius:9px;font-size:13.5px;font-weight:600;
    margin-bottom:10px;display:flex;align-items:center;gap:10px}

  /* ---------- Siatka pól ---------- */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
  .field-card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    overflow:hidden;cursor:pointer;transition:.14s;display:flex;flex-direction:column}
  .field-card:hover{transform:translateY(-3px);border-color:var(--line-strong)}
  .fc-head{padding:15px 16px 12px;display:flex;justify-content:space-between;gap:10px}
  .fc-name{font-family:var(--serif);font-size:20px;line-height:1.15;margin:0}
  .fc-loc{font-size:12px;color:var(--ink-soft);margin-top:3px}
  .fc-geo{font-size:11px;color:var(--pole-dark);margin-top:5px;display:inline-flex;align-items:center;gap:4px}
  .fc-area{text-align:right;line-height:1.1;flex-shrink:0}
  .fc-area b{font-family:var(--mono);font-size:19px;color:var(--pole-dark)}
  .fc-area span{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);display:block}

  /* ===== ELEMENT-PODPIS: pasmo płodozmianu ===== */
  .ribbon{padding:2px 16px 14px}
  .ribbon-label{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px}
  .ribbon-track{display:flex;height:38px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}
  .ribbon-seg{flex:1;min-width:0;position:relative;display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:3px;border-right:1px solid rgba(255,255,255,.35)}
  .ribbon-seg:last-child{border-right:none}
  .ribbon-seg .yr{font-family:var(--mono);font-size:10px;color:rgba(43,38,32,.7);font-weight:600}
  .ribbon-seg.empty{background:repeating-linear-gradient(45deg,#e9e7db 0 6px,#efedE3 6px 12px)}
  .ribbon-seg.empty .yr{color:var(--ink-soft)}
  .ribbon-crop{position:absolute;top:4px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:600;
    color:rgba(43,38,32,.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 3px}
  .fc-foot{margin-top:auto;padding:11px 16px;border-top:1px solid var(--line);display:flex;justify-content:space-between;
    align-items:center;background:rgba(255,255,255,.4)}
  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:3px 9px 3px 7px;
    border-radius:20px;background:var(--card-2);border:1px solid var(--line)}
  .badge .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
  .fc-yield{font-family:var(--mono);font-size:12.5px;color:var(--ink-soft)}
  .fc-yield b{color:var(--pole-dark)}
  .add-card{border:1.5px dashed var(--line-strong);border-radius:14px;background:transparent;display:flex;
    flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:180px;cursor:pointer;color:var(--ink-soft);transition:.14s}
  .add-card:hover{border-color:var(--pole);color:var(--pole-dark);background:rgba(92,122,52,.05)}
  .add-card .plus{font-size:34px;font-family:var(--serif);line-height:1}

  /* ---------- Widok Sezon ---------- */
  .season-wrap{overflow-x:auto}
  .season-table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);min-width:720px}
  .season-table th{text-align:left;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);
    font-weight:600;padding:12px 14px;border-bottom:1px solid var(--line-strong);background:rgba(255,255,255,.5)}
  .season-table td{padding:12px 14px;border-bottom:1px solid var(--line);font-size:14px;vertical-align:top}
  .season-table tr:last-child td{border-bottom:none}
  .season-table tr[data-field]{cursor:pointer}
  .season-table tr[data-field]:hover td{background:rgba(200,155,44,.07)}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .muted{color:var(--ink-soft)}

  /* ---------- Detal pola ---------- */
  .detail-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:22px;flex-wrap:wrap}
  .detail-head h1{font-family:var(--serif);font-size:34px;margin:0;line-height:1.05}
  .detail-meta{display:flex;gap:22px;margin-top:8px;flex-wrap:wrap}
  .detail-meta div span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);display:block}
  .detail-meta div b{font-family:var(--mono);font-size:17px;color:var(--pole-dark)}
  .detail-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
  .mini-map{height:200px;border-radius:12px;border:1px solid var(--line-strong);margin-bottom:20px;z-index:1}
  .create-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:22px;align-items:start}
  @media(max-width:820px){.create-grid{grid-template-columns:1fr}}
  #createMap{height:min(60vh,480px);border-radius:14px;border:1px solid var(--line-strong);box-shadow:var(--shadow);z-index:1}
  .create-form{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px}
  .fc-kom{font-size:12px;color:var(--ink-soft);margin-top:6px;font-style:italic}
  .color-row{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px dotted var(--line)}
  .color-row input[type=color]{width:40px;height:30px;border:1px solid var(--line-strong);border-radius:7px;background:none;padding:2px;cursor:pointer}

  .season{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
  .season-bar{height:5px}
  .season-top{padding:16px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;cursor:pointer}
  .season-year{font-family:var(--mono);font-size:24px;font-weight:600;color:var(--ink)}
  .season-crop{font-family:var(--serif);font-size:22px}
  .season-odm{font-size:13px;color:var(--ink-soft)}
  .season-quick{margin-left:auto;display:flex;gap:20px;align-items:center}
  .season-quick .q b{font-family:var(--mono);font-size:16px;color:var(--pole-dark)}
  .season-quick .q span{font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-soft);display:block}
  .chev{transition:.2s;color:var(--ink-soft);font-size:13px}
  .season.open .chev{transform:rotate(90deg)}
  .season-body{display:none;padding:0 18px 18px;border-top:1px solid var(--line)}
  .season.open .season-body{display:block}
  .sb-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;padding-top:16px}
  @media(max-width:680px){.sb-grid{grid-template-columns:1fr}}
  .sb-title{font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-soft);margin:0 0 10px;
    display:flex;align-items:center;justify-content:space-between}
  .kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dotted var(--line);font-size:14px}
  .kv:last-child{border-bottom:none}
  .kv b{font-family:var(--mono)}
  .zabieg-list{display:flex;flex-direction:column;gap:7px}
  .zabieg{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:rgba(255,255,255,.55);border:1px solid var(--line)}
  .zabieg .z-kind{width:8px;height:34px;border-radius:3px;flex-shrink:0}
  .zabieg .z-main{flex:1;min-width:0}
  .zabieg .z-name{font-size:13.5px;font-weight:600}
  .zabieg .z-sub{font-size:11.5px;color:var(--ink-soft)}
  .zabieg .z-dose{font-family:var(--mono);font-size:13px;color:var(--rust);font-weight:600;white-space:nowrap;text-align:right}
  .zabieg .z-dose small{display:block;color:var(--ink-soft);font-weight:400;font-size:10.5px}
  .z-empty{font-size:13px;color:var(--ink-soft);font-style:italic;padding:6px 0}
  .cost-line{margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);font-size:13px;display:flex;justify-content:space-between}
  .cost-line b{font-family:var(--mono);color:var(--rust)}

  /* ---------- Modal ---------- */
  .overlay{position:fixed;inset:0;background:rgba(43,38,32,.42);display:none;z-index:2000;align-items:flex-start;
    justify-content:center;padding:40px 16px;overflow:auto;backdrop-filter:blur(2px)}
  .overlay.on{display:flex}
  .modal{background:var(--card);border-radius:16px;max-width:520px;width:100%;box-shadow:0 30px 70px -20px rgba(43,38,32,.6);
    border:1px solid var(--line-strong);overflow:hidden;animation:pop .16s ease-out}
  @keyframes pop{from{transform:translateY(10px) scale(.98);opacity:0}to{transform:none;opacity:1}}
  .modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .modal-head h3{font-family:var(--serif);font-size:22px;margin:0}
  .modal-body{padding:20px 22px}
  .modal-foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px;background:rgba(255,255,255,.4)}
  .x{border:none;background:none;font-size:22px;cursor:pointer;color:var(--ink-soft);line-height:1;padding:2px 6px}
  .x:hover{color:var(--ink)}
  .field{margin-bottom:15px}
  .field.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--card-2)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--pole);box-shadow:0 0 0 3px rgba(92,122,52,.12)}
  .field textarea{resize:vertical;min-height:60px}
  .hint{font-size:11.5px;color:var(--ink-soft);margin-top:4px}
  .geo-note{background:rgba(92,122,52,.1);border:1px solid rgba(92,122,52,.3);border-radius:9px;padding:9px 12px;
    font-size:12.5px;color:var(--pole-dark);margin-bottom:15px;display:flex;align-items:center;gap:8px}

  .legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:26px;padding-top:16px;border-top:1px solid var(--line)}
  .legend .li{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-soft)}
  .legend .dot{width:11px;height:11px;border-radius:3px}
  .empty-state{text-align:center;padding:70px 20px;color:var(--ink-soft)}
  .empty-state .big{font-family:var(--serif);font-size:26px;color:var(--ink);margin-bottom:8px}
  footer{max-width:1180px;margin:30px auto;padding:0 22px 40px;font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

  @media(max-width:640px){
    .stats{width:100%;margin-left:0;justify-content:space-between;gap:14px;order:3}
    .top-actions{order:2;margin-left:auto}
    .detail-head h1{font-size:26px}
  }

  /* ===================== MOTYW ENTERPRISE (John Deere Operations Center) ===================== */
  h1,h2,h3{font-family:var(--serif)}

  /* Górny pasek nawigacji */
  .navbar{height:60px;background:var(--color-dark);color:var(--color-text-invert);display:flex;align-items:center;gap:14px;padding:0 20px;
    position:sticky;top:0;z-index:1200;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .nav-burger,.nav-icon{background:none;border:none;color:#fff;cursor:pointer;padding:8px;border-radius:6px;display:flex}
  .nav-burger:hover,.nav-icon:hover{background:rgba(255,255,255,.14)}
  .nav-logo{display:flex;align-items:center;gap:9px;cursor:pointer;font-weight:700;font-size:18px;letter-spacing:.01em}
  .nav-logo .mark{width:29px;height:29px;border-radius:6px;background:var(--color-accent);color:#1F2A2E;
    display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
  .nav-logo .tag{font-weight:400;font-size:10.5px;opacity:.82;letter-spacing:.13em;text-transform:uppercase}
  .nav-spacer{flex:1}
  .nav-season{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);border-radius:7px;padding:0 10px;height:38px}
  .nav-season select{background:transparent;border:none;color:#fff;font-weight:500;font-size:13px;outline:none;cursor:pointer;min-height:0}
  .nav-season select option{color:var(--ink)}
  .nav-icon{position:relative}
  .nav-badge{position:absolute;top:2px;right:2px;background:var(--wheat);color:#3D3D3D;font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px}
  .nav-user{display:flex;align-items:center;gap:9px;cursor:pointer;padding:4px 8px 4px 4px;border-radius:22px}
  .nav-user:hover{background:rgba(255,255,255,.14)}
  .nav-avatar{width:32px;height:32px;border-radius:50%;background:var(--pole-light);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:1.5px solid rgba(255,255,255,.5)}
  .nav-user .nu-name{font-size:13px;font-weight:500;line-height:1.15}
  .nav-user .nu-role{font-size:10.5px;opacity:.82}
  @media(max-width:720px){ .nav-user .nu-name,.nav-user .nu-role,.nav-logo .tag{display:none} }

  /* Sidebar — ciemny grafit pod navbarem. To najbardziej rozpoznawalny element My Agro. */
  .sidebar{background:var(--sidebar);border-right:none;top:52px;height:calc(100vh - 52px);
    gap:2px;overflow:hidden;display:flex;flex-direction:column}
  .sb-nav{overflow-y:auto;flex:1;min-height:0}
  .sb-foot{flex-shrink:0}
  .sb-brand{display:none}
  .sb-item{border-radius:6px;font-weight:500;color:#A7B3B7}
  .sb-item:hover{background:rgba(255,255,255,.06);color:#EDF1EE}
  .sb-item.active{background:rgba(255,255,255,.08);border-color:transparent;color:#FFFFFF;box-shadow:none}
  .sb-item.active .ic{color:var(--color-accent)}
  .sb-count{background:rgba(255,255,255,.07);border-radius:10px;padding:0 7px;color:#8B989C}
  .sb-item.active .sb-count{background:rgba(197,138,58,.18);color:var(--color-accent)}
  /* Ikony modułów to kolorowe PNG-i zrobione pod jasne tło. Na graficie gasną, więc
     lekko je rozjaśniamy zamiast podmieniać cały zestaw plików. */
  .sb-ic-img{filter:brightness(1.5) saturate(.55)}
  .sb-item.active .sb-ic-img{filter:brightness(1.75) saturate(.7)}
  .sb-title{color:#7C8A8E}
  .sb-ic-img{width:23px;height:23px;object-fit:contain;display:block}
  @media(max-width:900px){ .sb-ic-img{width:26px;height:26px} }
  .layout.collapsed .sidebar{display:none}
  @media(max-width:900px){ .sidebar{top:0;height:auto} }
  .sb-farm{color:#EDF1EE;border-bottom-color:rgba(255,255,255,.18)}
  .sb-farm::placeholder{color:#68767A}
  /* Przyciski kopii na ciemnym tle — wersja „secondary" byłaby tu niewidoczna. */
  .sb-backup .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#D6DEDA}
  .sb-backup .btn:hover{background:rgba(255,255,255,.14);border-color:var(--color-accent);color:#fff}

  /* Karty, promienie, cienie */
  .field-card,.tile,.season,.mini-stat,.fin-month,.season-table,.fin-table,#map,#createMap,.mini-map,.map-off,.create-form,.modal,.geo-note{border-radius:8px}
  .field-card,.tile{box-shadow:var(--shadow);border-color:var(--line-strong)}
  .field-card:hover,.tile:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.10);border-color:var(--pole-light)}

  /* Przyciski — płaskie */
  .btn{border-radius:6px;font-weight:500;box-shadow:none}
  .btn:hover{transform:none;background:#F7F8F8}
  .btn.primary{background:var(--pole);border-color:var(--pole);color:#fff}
  .btn.primary:hover{background:var(--pole-dark);border-color:var(--pole-dark)}
  .btn.danger:hover{border-color:var(--rust);color:var(--rust);background:#fff}
  .btn.ghost:hover{background:#F7F8F8}

  /* Pola formularzy — 40px */
  .field input,.field select,.field textarea,.sel,.map-search{min-height:40px;border-radius:6px;border-color:var(--line-strong)}
  .field textarea{min-height:72px}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--pole);box-shadow:0 0 0 3px rgba(94,127,84,.15)}

  /* Zakładki — zielone podkreślenie */
  .tab.active{border-bottom-color:var(--pole);color:var(--pole-dark)}

  /* Tabele — enterprise */
  .season-table,.fin-table{border:1px solid var(--line-strong)}
  .season-table th,.fin-table th{background:#FAFBFB;color:var(--ink-soft)}
  .season-table td,.fin-table td{border-color:var(--line)}
  .season-table tr[data-field]:hover td{background:#F7F8F8}

  .mini-stat{box-shadow:var(--shadow);border-color:var(--line-strong)}
  .mini-stat b{color:var(--pole-dark)}
  .badge,.tag-pill,.cat-chip{border-color:var(--line-strong)}
  .module-head h1{font-weight:700}
  .season-crop,.tile-name,.fc-name,.detail-head h1,.empty-state .big{font-family:var(--serif)}

  /* Pasek statystyk */
  .stat-strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:24px}
  .stat-card{background:#fff;border:1px solid var(--line-strong);border-radius:8px;box-shadow:var(--shadow);padding:15px 18px;display:flex;align-items:center;gap:14px;transition:.14s;cursor:pointer}
  .stat-card:active{transform:translateY(0)}
  .stat-card:hover{box-shadow:0 6px 16px rgba(0,0,0,.10);transform:translateY(-2px)}
  .stat-ic{width:40px;height:40px;border-radius:8px;background:rgba(94,127,84,.12);color:var(--pole);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .stat-num{font-size:24px;font-weight:700;color:var(--ink);line-height:1}
  .stat-lab{font-size:12px;color:var(--ink-soft);margin-top:3px}

  /* Kanał aktywności — mieszka teraz w sekcji „AKTYWNOŚĆ" panelu operacyjnego Pulpitu
     (klasa .op-akt), więc zostały same pozycje. Opakowanie .dash-* odeszło razem
     z dwukolumnowym pulpitem, który panel zastąpił. */
  .feed-item{display:flex;gap:11px;padding:11px 12px;border-radius:8px;transition:.12s;align-items:flex-start}
  .feed-item:hover{background:#F7F8F8}
  .feed-ic{width:34px;height:34px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff}
  .feed-main{flex:1;min-width:0}
  .feed-title{font-size:13.5px;font-weight:500;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .feed-sub{font-size:12px;color:var(--ink-soft);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .feed-date{font-size:11px;color:var(--ink-soft);margin-top:3px}
  .st-badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:12px;white-space:nowrap;text-transform:uppercase;letter-spacing:.03em;flex-shrink:0}
  .st-done{background:rgba(87,182,87,.16);color:#3f9a3f}
  .st-work{background:rgba(240,177,58,.20);color:#b9832a}
  .st-plan{background:#EEF0F1;color:#777}
  .st-cancel{background:rgba(217,83,79,.16);color:var(--rust)}

  .leaflet-interactive{transition:stroke-width .12s ease,fill-opacity .12s ease}

  /* ===================== EKRAN LOGOWANIA ===================== */
  .auth-wrap{display:flex;min-height:100vh}
  .auth-side{width:42%;max-width:520px;background:linear-gradient(160deg,var(--pole),var(--pole-dark));color:#fff;padding:48px 44px;display:flex;flex-direction:column;justify-content:center;gap:18px}
  .auth-brand{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:700}
  .auth-brand .mark{width:46px;height:46px;border-radius:11px;background:#fff;color:var(--pole);display:flex;align-items:center;justify-content:center;font-size:25px;font-weight:700}
  .auth-tagline{font-size:16px;opacity:.92;font-weight:400}
  .auth-feats{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:14px}
  .auth-feats li{display:flex;align-items:center;gap:12px;font-size:15px;opacity:.96}
  .auth-panel{flex:1;display:flex;align-items:center;justify-content:center;padding:30px;background:var(--paper)}
  .auth-card{background:#fff;border:1px solid var(--line-strong);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.10);padding:34px 32px;width:100%;max-width:380px}
  .auth-card h2{font-family:var(--serif);font-size:24px;margin:0 0 4px;font-weight:700}
  .auth-sub{color:var(--ink-soft);font-size:13.5px;margin:0 0 22px}
  .auth-btn{width:100%;justify-content:center;margin-top:10px;height:44px;font-size:15px}
  .auth-remember{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin:6px 0 2px;cursor:pointer}
  .auth-remember input{width:auto;min-height:0}
  .auth-err{color:var(--rust);font-size:13px;margin-top:10px;min-height:16px;font-weight:500}
  .auth-note{font-size:11.5px;color:var(--ink-soft);margin-top:16px;text-align:center;line-height:1.5}
  .auth-legal{font-size:11px;color:var(--ink-soft);margin-top:22px;padding-top:14px;border-top:1px solid var(--border,#e3e3e0);text-align:center}
  .auth-legal a{color:var(--pole);font-weight:600}
  @media(max-width:760px){ .auth-side{display:none} .auth-panel{width:100%} }

  /* ===================== USTAWIENIA + GRAFIK ===================== */
  .opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
  .opt-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 10px;background:var(--card,#fff);
    border:1.5px solid var(--line,#D8D8D8);border-radius:10px;cursor:pointer;transition:all .12s;font-family:inherit}
  .opt-card:hover{border-color:var(--pole,#5E7F54)}
  .opt-card.sel{border-color:var(--pole,#5E7F54);background:rgba(94,127,84,.08);box-shadow:0 0 0 1px var(--pole,#5E7F54) inset}
  .opt-emoji{font-size:30px;line-height:1}
  .opt-name{font-size:13px;font-weight:600;color:var(--ink,#3D3D3D);text-align:center}
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-top:1px solid var(--line,#eee)}
  .set-row:first-of-type{border-top:none}
  .set-name{font-size:14px;font-weight:600;color:var(--ink,#3D3D3D)}
  .set-desc{font-size:12.5px;color:var(--ink-soft,#777);line-height:1.5}
  .set-input{width:100%;max-width:420px;height:40px;padding:0 12px;border:1px solid var(--line,#D8D8D8);border-radius:8px;font-family:inherit;font-size:14px}
  .switch{width:46px;height:26px;border-radius:14px;background:#ccc;border:none;position:relative;cursor:pointer;flex:0 0 auto;transition:background .15s;padding:0}
  .switch span{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .switch.on{background:var(--pole,#5E7F54)}
  .switch.on span{left:23px}
  .grafik-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .grafik-week{font-weight:600;color:var(--ink,#3D3D3D);font-size:15px}
  .wlegend{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .wchip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;background:var(--card,#fff);border:1px solid var(--line,#D8D8D8);
    border-radius:20px;font-size:12.5px;color:var(--ink,#3D3D3D);cursor:pointer}
  .wchip:hover{border-color:var(--pole,#5E7F54)}
  .wdot{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
  .cal-wrap{overflow-x:auto;border:1px solid var(--line,#D8D8D8);border-radius:10px;background:var(--card,#fff)}
  .cal{border-collapse:collapse;width:100%;min-width:680px;table-layout:fixed}
  .cal th{background:#F1F3EF;font-size:12px;font-weight:600;color:var(--ink-soft,#555);padding:8px 6px;text-align:center;border-bottom:1px solid var(--line,#D8D8D8);border-left:1px solid var(--line,#eee)}
  .cal td{width:14.28%;border-left:1px solid var(--line,#eee);border-bottom:1px solid var(--line,#f0f0f0);padding:4px;vertical-align:top;height:96px;position:relative;cursor:pointer}
  .cal td.blank{background:#fafafa;cursor:default}
  .cal td.today{background:rgba(94,127,84,.06)}
  .cal td:hover .add-shift{opacity:.6}
  .cal-day{font-size:12px;font-weight:600;color:#999;margin-bottom:3px}
  .cal td.today .cal-day{color:var(--pole-dark,#4A6543)}
  .shift{color:#fff;border-radius:6px;padding:3px 6px;margin-bottom:3px;font-size:11px;line-height:1.25;cursor:pointer;overflow:hidden}
  .shift b{font-weight:700;display:block}
  .shift span{opacity:.92;font-size:10.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .shift:hover{filter:brightness(1.08)}
  .add-shift{position:absolute;bottom:3px;right:6px;color:var(--pole,#5E7F54);font-weight:700;opacity:0;transition:opacity .1s;pointer-events:none;font-size:14px}
  .cdots{display:flex;gap:8px;flex-wrap:wrap}
  .cdot{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .cdot.sel{border-color:var(--ink,#333);box-shadow:0 0 0 2px #fff inset}
  /* ═══ MODUŁ UŻYTKOWNICY ═══════════════════════════════════════════════════ */
  .u-row{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line)}
  .u-row:last-child{border-bottom:none}
  .u-main{flex:1;min-width:0}
  .u-mail{font-weight:600;color:var(--ink);word-break:break-all;line-height:1.35}
  .u-tag{display:inline-block;background:#E8F0E4;color:var(--pole);border-radius:99px;
    padding:1px 9px;font-size:11px;font-weight:700;margin-left:6px;white-space:nowrap}
  .u-meta{font-size:12px;color:var(--ink-soft);margin-top:3px}
  .u-akcje{display:flex;gap:8px;flex-shrink:0}
  .u-pusto{padding:26px 20px;text-align:center;color:var(--ink-soft)}
  .u-info{margin-top:14px;padding:13px 16px;background:#FFF8E8;border:1px solid #F0D9A0;
    border-radius:8px;font-size:13px;color:#6B5320;line-height:1.55}
  .btn.danger{color:var(--danger);border-color:#EBC7C6}
  .btn.danger:hover{background:#FDF3F3}

  /* ═══ GRAFIK — TABLICA DYSPOZYTORSKA ══════════════════════════════════════ */
  .grafik-uklad{display:flex;gap:16px;align-items:flex-start}
  .tablica-wrap{flex:1;min-width:0;overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--u-rog)}
  /* `table-layout:fixed` — bez tego dzień z zadaniami rozpychał się na pół tabeli, a puste dni
     ściskały się do paska. Tydzień ma mieć siedem równych kolumn niezależnie od zawartości. */
  .tablica{width:100%;border-collapse:collapse;font-size:13px;min-width:760px;table-layout:fixed}
  .tablica thead th:not(.prac-naglowek){width:calc((100% - var(--u-prac))/7)}
  .tablica th,.tablica td{border:1px solid var(--line);vertical-align:top}
  .tablica thead th{background:#F7F8F7;padding:8px 6px;text-align:center;font-size:11px;
    font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);position:sticky;top:0;z-index:2}
  .tablica thead th span{display:block;font-size:13px;font-weight:600;color:var(--ink);text-transform:none;letter-spacing:0;margin-top:2px}
  .tablica thead th.dzis{background:#E8F0E4;color:var(--pole)}
  .tablica th.prac-naglowek{width:var(--u-prac);text-align:left;padding-left:12px}
  .tablica th.prac{width:var(--u-prac);text-align:left;padding:calc(10px*var(--u-gestosc)) 12px;background:#FCFCFB;cursor:pointer;
    font-weight:500;display:table-cell}
  .tablica th.prac .wdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}
  .tablica th.prac b{font-size:13px;color:var(--ink);font-weight:600}
  .prac-rola{display:block;font-size:11px;color:var(--ink-soft);font-weight:400;margin-left:16px}
  .tablica td{padding:calc(5px*var(--u-gestosc));height:var(--u-krata);cursor:pointer;transition:background .12s;position:relative}
  .tablica td:hover{background:#FAFBFA}
  .tablica td.dzis{background:#FCFDFB}
  .tablica td.cel{background:#E8F0E4;outline:2px dashed var(--pole);outline-offset:-3px}
  .zad-plus{opacity:0;text-align:center;color:var(--ink-soft);font-size:17px;transition:.12s;line-height:1}
  .tablica td:hover .zad-plus{opacity:.45}

  .zad-karta{background:#fff;border:1px solid var(--line);border-left:3px solid var(--pole);
    border-radius:calc(var(--u-rog)*.7);padding:calc(6px*var(--u-gestosc)) calc(8px*var(--u-gestosc));
    margin-bottom:4px;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .zad-karta:hover{box-shadow:0 2px 7px rgba(0,0,0,.12)}
  .zad-karta.cel{outline:2px dashed var(--pole);outline-offset:1px}
  .zad-karta.kolizja{border-color:#EBC7C6;background:#FDF6F6}
  .zk-tytul{font-weight:700;font-size:12px;color:var(--ink);text-transform:uppercase;letter-spacing:.02em;line-height:1.25}
  .zk-alert{color:var(--danger)}
  .zk-czas{font-size:11px;color:var(--ink-soft);margin-top:1px}
  .zk-wiersz{font-size:11px;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
  .zd-row{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line2)}
  .zd-row:last-child{border-bottom:none}
  .zd-row span{color:var(--ink-soft);font-size:13px}
  .wyk-blok{margin-top:14px;padding:10px 12px;background:#F4F7F3;border:1px solid #DCE6D8;border-radius:8px}
  .wyk-tyt{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--pole);margin-bottom:4px}
  /* Stan zadania: wykonane i anulowane schodzą wizualnie na drugi plan — na tablicy liczy się to,
     co jeszcze przed nami, a nie to, co już zamknięte. */
  .zad-karta.st-wykonane{background:#F6FAF5;opacity:.72}
  .zad-karta.st-wykonane .zk-tytul{text-decoration:none;color:#4A6543}
  .zad-karta.st-anulowane{opacity:.45}
  .zad-karta.st-anulowane .zk-tytul{text-decoration:line-through}
  .zad-karta.st-rozpoczete{box-shadow:0 0 0 2px #F0B13A33,0 1px 2px rgba(0,0,0,.05)}
  .zk-ptak{color:#57B657;font-weight:800}
  /* Historia prac — ten sam komponent w karcie pola, maszyny i pracownika. */
  .hist-lista{border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .hist-w{display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--line2);cursor:pointer;background:#fff}
  .hist-w:last-child{border-bottom:none}
  .hist-w:hover{background:#FAFBFA}
  .hist-data{flex:0 0 52px;padding:9px 8px;font-size:12px;font-weight:700;color:var(--ink-soft);text-align:center}
  .hist-pasek{flex:0 0 3px}
  .hist-tresc{flex:1;min-width:0;padding:9px 11px}
  .hist-tyt{font-size:13px;font-weight:600;color:var(--ink)}
  .hist-stan{font-size:11px;font-weight:600;margin-left:7px;white-space:nowrap}
  .hist-meta{font-size:11.5px;color:var(--ink-soft);margin-top:2px;line-height:1.4}
  .hist-pusto{padding:14px;text-align:center;color:var(--ink-soft);font-size:12.5px}
  .godz-blok{margin:12px 0;padding:10px 12px;background:#FAFBFA;border:1px solid var(--line);border-radius:8px}

  /* Panel zasobów */
  .zasoby{width:var(--u-panel);flex:0 0 var(--u-panel);background:#fff;border:1px solid var(--line);border-radius:var(--u-rog);
    overflow:hidden;align-self:stretch}
  .zas-szukaj{padding:10px;border-bottom:1px solid var(--line)}
  .zas-szukaj input{width:100%;height:36px;border:1px solid var(--line);border-radius:7px;padding:0 10px;
    font-family:var(--sans);font-size:13px;outline:none}
  .zas-szukaj input:focus{border-color:var(--pole)}
  .zas-sekcja{border-bottom:1px solid var(--line)}
  .zas-glowa{width:100%;display:flex;align-items:center;gap:8px;background:none;border:none;cursor:pointer;
    padding:11px 12px;font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink-soft);text-align:left}
  .zas-glowa:hover{background:#FAFBFA}
  .zas-strzalka{transition:transform .15s;display:inline-block;font-size:10px}
  .zas-sekcja.otwarta .zas-strzalka{transform:rotate(90deg)}
  .zas-licznik{margin-left:auto;background:var(--line2);color:var(--ink-soft);border-radius:99px;
    padding:1px 8px;font-size:11px;font-weight:700;letter-spacing:0}
  .zas-tresc{display:none;padding:0 10px 12px}
  .zas-sekcja.otwarta .zas-tresc{display:block}
  .zas-item{display:flex;align-items:flex-start;gap:8px;padding:8px;border:1px solid var(--line);
    border-radius:7px;margin-bottom:5px;background:#fff;cursor:grab;font-size:13px}
  .zas-item:hover{border-color:var(--pole-l);background:#FAFBFA}
  .zas-item:active{cursor:grabbing}
  .zas-uchwyt{color:#C8C8C8;font-size:13px;line-height:1.3;flex-shrink:0}
  .zas-nazwa{flex:1;min-width:0;color:var(--ink);line-height:1.35}
  .zas-meta{display:block;font-size:11px;color:var(--ink-soft);margin-top:2px}
  .zas-kropka{width:9px;height:9px;border-radius:50%;flex-shrink:0;margin-top:5px}
  .zas-x{background:none;border:none;color:#C8C8C8;font-size:17px;cursor:pointer;line-height:1;padding:0 2px}
  .zas-x:hover{color:var(--danger)}
  .zas-pusto{padding:14px 4px;text-align:center;color:var(--ink-soft);font-size:12.5px}

  /* ═══ INTEGRACJA: Flota ↔ Grafik ↔ Mapa ↔ Pola ════════════════════════════ */
  .k-praca{min-width:180px}
  .fl-praca{display:block;font-size:12.5px;font-weight:600;color:var(--ink);cursor:pointer}
  .fl-praca:hover{color:var(--pole);text-decoration:underline}
  .fl-praca.trwa::before{content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
    background:#F0B13A;margin-right:6px;vertical-align:middle}
  .fl-sub2{font-weight:500;color:var(--ink-soft)}
  .fl-link{color:var(--pole);cursor:pointer}
  .fl-link:hover{text-decoration:underline}

  /* Menu akcji maszyny */
  .fl-menu{position:relative;display:inline-flex;gap:5px;align-items:center}
  .fl-kropki{width:30px;height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;
    cursor:pointer;font-size:16px;line-height:1;color:var(--ink-soft);font-family:var(--sans)}
  .fl-kropki:hover{border-color:var(--pole);color:var(--pole)}
  .fl-menu-lista{display:none;position:absolute;right:0;top:34px;z-index:60;min-width:210px;
    background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.14);
    padding:5px;text-align:left}
  .fl-menu.otw .fl-menu-lista{display:block}
  .fl-menu-lista button{display:block;width:100%;text-align:left;background:none;border:none;
    padding:8px 10px;border-radius:6px;font-family:var(--sans);font-size:13px;color:var(--ink);cursor:pointer}
  .fl-menu-lista button:hover:not(:disabled){background:#F2F5F1;color:var(--pole)}
  .fl-menu-lista button:disabled{color:#C4C4C4;cursor:not-allowed}

  /* Znacznik maszyny na mapie — pozycja z centroidu pola aktywnego zadania. */
  .masz-marker{background:none;border:none}
  .mm-pin{width:34px;height:34px;border-radius:50%;background:#fff;border:2px solid var(--ink-soft);
    display:flex;align-items:center;justify-content:center;font-size:17px;
    box-shadow:0 2px 6px rgba(0,0,0,.3);cursor:pointer}
  .mm-pin.trwa{border-color:#F0B13A;box-shadow:0 0 0 4px rgba(240,177,58,.32),0 2px 6px rgba(0,0,0,.3)}
  .mm-pop{min-width:180px;font-family:var(--sans)}
  .mm-tyt{font-size:14px;font-weight:700;color:var(--ink)}
  .mm-stan{font-size:11.5px;font-weight:600;color:var(--ink-soft);margin:2px 0 6px}
  .mm-stan.trwa{color:#B4622E}
  .mm-zad{font-size:13px;font-weight:600;color:var(--pole);margin-bottom:4px}
  .mm-lin{font-size:12px;color:var(--ink-soft);line-height:1.5}
  .mm-akcje{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .mm-akcje button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;
    padding:6px 8px;font-family:var(--sans);font-size:12px;color:var(--ink);cursor:pointer;white-space:nowrap}
  .mm-akcje button:hover{border-color:var(--pole);color:var(--pole)}

  /* „Aktualnie" na karcie pola */
  .pole-teraz{background:#FFF9EC;border:1px solid #EBD9A8;border-radius:var(--u-rog);
    padding:13px 16px;margin-bottom:18px}
  .pt-tyt{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:#8A6A22;margin-bottom:8px}
  .pt-w{display:flex;align-items:center;gap:11px;padding:7px 0;border-top:1px solid rgba(0,0,0,.06)}
  .pt-w:first-of-type{border-top:none}
  .pt-ik{font-size:19px;flex-shrink:0}
  .pt-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
  .pt-t b{font-size:13.5px;font-weight:600}
  .pt-sub{font-size:11.5px;color:var(--ink-soft)}

  @media(max-width:1100px){ .fl-tab .k-praca{display:none} }

  /* ═══ FLOTA — panel maszyn ════════════════════════════════════════════════
     Ta sama przyczyna co w Grafiku: `.content` z `max-width:1180px` zostawiał ~70% ekranu pustego,
     a trzy duże kafle niosły mniej informacji niż zajmowały miejsca. Widok listy pokazuje całą
     flotę naraz i skaluje się do kilkudziesięciu maszyn. */
  .fl-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:12px}
  .fl-head>div:first-child{flex:1;min-width:0}

  .fl-podsum{margin-top:0;margin-bottom:12px}
  .fl-pilne{color:#B4622E;font-weight:600}
  .fl-pilne b{color:#B4622E}

  .fl-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;
    background:#fff;border:1px solid var(--line);border-radius:var(--u-rog);padding:9px 12px}
  .fl-szukaj input{width:230px;height:32px;border:1px solid var(--line);border-radius:6px;
    padding:0 10px;font-family:var(--sans);font-size:13px;outline:none}
  .fl-szukaj input:focus{border-color:var(--pole)}
  .fl-grupa{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .fl-grupa.fl-prawo{margin-left:auto}
  .fl-chip{border:1px solid var(--line);background:#fff;border-radius:6px;padding:0 11px;height:32px;
    font-family:var(--sans);font-size:12.5px;color:var(--ink-soft);cursor:pointer;white-space:nowrap;
    text-transform:capitalize}
  .fl-chip:hover{border-color:var(--pole);color:var(--pole)}
  .fl-chip.akt{background:var(--pole);border-color:var(--pole);color:#fff;font-weight:600}
  .fl-sort{height:32px;border:1px solid var(--line);border-radius:6px;padding:0 8px;
    font-family:var(--sans);font-size:12.5px;color:var(--ink);background:#fff;cursor:pointer}

  .fl-tab-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--u-rog);overflow-x:auto}
  .fl-tab{width:100%;border-collapse:collapse;font-size:13px}
  .fl-tab thead th{background:#F7F8F7;color:var(--ink-soft);font-weight:700;font-size:10.5px;
    letter-spacing:.06em;text-transform:uppercase;text-align:left;padding:9px 12px;
    border-bottom:1px solid var(--line);white-space:nowrap}
  /* Wiersz ~76 px — brief prosił o 70–90. Niżej robi się gęsto przy dwóch linijkach
     (nazwa + marka/rok/rejestracja) i trudniej trafić w wiersz na dotyku. */
  .fl-tab td{padding:15px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
  .fl-tab tbody tr{cursor:pointer;transition:background .12s}
  .fl-tab tbody tr:hover{background:#FAFBFA}
  .fl-tab tbody tr:last-child td{border-bottom:none}
  .fl-masz{display:flex;align-items:center;gap:10px;min-width:200px}
  .fl-ik{font-size:19px;flex-shrink:0}
  .fl-masz-t{display:flex;flex-direction:column;min-width:0;line-height:1.3}
  .fl-masz-t b{font-size:13.5px;font-weight:600;color:var(--ink)}
  .fl-sub{display:block;font-size:11px;color:var(--ink-soft);margin-top:1px}
  .fl-pusto{color:#C0C0C0}
  .fl-stan{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;text-transform:capitalize;font-size:12.5px}
  .fl-kropka{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .k-mth b{font-size:14px;font-weight:700}
  .k-akcje{text-align:right;white-space:nowrap}
  /* Alerty terminów: kolor niesie pilność, ale bez wielkich kolorowych plakietek. */
  .fl-termin{display:block;font-size:12.5px;font-weight:600;white-space:nowrap}
  .fl-termin.ok{color:#3F7D3F}
  .fl-termin.uwaga{color:#B4622E}
  .fl-termin.zly{color:var(--danger)}
  .fl-pusto-box{background:#fff;border:1px dashed var(--line);border-radius:var(--u-rog);
    padding:34px;text-align:center;color:var(--ink-soft)}

  /* Widok kartowy — opcja na tablet. Kompaktowy, 4–6 kolumn na szerokim ekranie. */
  .fl-karty{display:grid;grid-template-columns:repeat(auto-fill,minmax(212px,1fr));gap:12px}
  .fl-karta{background:#fff;border:1px solid var(--line);border-radius:var(--u-rog);padding:13px 14px;cursor:pointer}
  .fl-karta:hover{border-color:var(--pole);box-shadow:0 2px 7px rgba(0,0,0,.08)}
  .fl-k-gora{display:flex;align-items:center;justify-content:space-between;margin-bottom:7px}
  .fl-k-nazwa{font-size:14px;font-weight:600;color:var(--ink);line-height:1.25}
  .fl-k-sub{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
  .fl-k-dol{display:flex;justify-content:space-between;margin-top:10px;padding-top:9px;
    border-top:1px solid var(--line2);font-size:12px;color:var(--ink-soft)}

  /* Laptop: chowamy kolumny mniej istotne w codziennej pracy. */
  @media(max-width:1400px){ .fl-tab .k-typ{display:none} }
  @media(max-width:1200px){ .fl-tab .k-oc,.fl-tab .k-bad{display:none} }
  @media(max-width:900px){
    .fl-tab .k-akcje{display:none}
    .fl-szukaj input{width:100%}
    .fl-szukaj{flex:1 1 100%}
    .fl-grupa.fl-prawo{margin-left:0}
  }

  /* ═══ GRAFIK — UKŁAD NA CAŁĄ SZEROKOŚĆ ════════════════════════════════════
     Problem, który to naprawia: `.content` miał `max-width:1180px`, więc na Full HD
     tablica siedziała jako mały widget pośrodku, a po bokach zostawały puste pasy.
     Grafik jest najważniejszym ekranem aplikacji i ma dominować.
     ⚠️ Zdejmujemy ograniczenie TYLKO dla Grafiku (klasa `pelna`) — pozostałe moduły
     zostają w kolumnie 1180 px, bo tam długie linijki tekstu byłyby nieczytelne. */
  .content.pelna{max-width:none;padding:22px 26px}
  @media(min-width:1600px){ .content.pelna{padding:24px 34px} }
  .gr-head{margin-bottom:14px}
  .gr-head h1{font-size:23px;font-weight:800;color:var(--ink);letter-spacing:-.02em;margin:0}
  .gr-head .sub{font-size:13px;color:var(--ink-soft);margin-top:2px}

  /* Toolbar: jeden spójny pasek zamiast kontrolek rozrzuconych po szerokości. */
  .gr-toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px;
    background:#fff;border:1px solid var(--line);border-radius:var(--u-rog);padding:9px 12px}
  .gr-tb-l{display:flex;align-items:center;gap:8px}
  .gr-tb-r{display:flex;align-items:center;gap:8px;margin-left:auto}
  .gr-ikona{width:34px;height:34px;border:1px solid var(--line);background:#fff;border-radius:6px;
    font-size:19px;line-height:1;color:var(--ink);cursor:pointer;font-family:var(--sans)}
  .gr-ikona:hover{border-color:var(--pole);color:var(--pole)}
  .gr-zakres{border:1px solid var(--line);border-radius:6px;padding:0 14px;height:34px;
    display:flex;align-items:center;font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap}

  /* 1fr + stały panel — grafik bierze CAŁE pozostałe miejsce. `minmax(0,1fr)` jest
     konieczne: bez niego zawartość tabeli rozpycha kolumnę ponad dostępną szerokość. */
  .grafik-uklad{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
  .gr-lewa{min-width:0}
  .tablica-wrap{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--u-rog)}
  .tablica{width:100%;border-collapse:collapse;font-size:13px;min-width:760px;table-layout:fixed}
  .tablica thead th:not(.prac-naglowek){width:calc((100% - var(--u-prac))/7)}
  .tablica th.prac-naglowek,.tablica th.prac{width:var(--u-prac)}
  .tablica thead th.weekend{background:#F1F2F0}
  .tablica td.weekend{background:#FCFCFB}
  .tablica td.dzis{background:#F7FBF5}
  .tablica thead th.prac-naglowek span{display:block;font-size:10px;font-weight:500;
    color:var(--ink-soft);text-transform:none;letter-spacing:0;margin-top:2px}

  /* Wiersze wyższe — w komórce mają się zmieścić 2 zadania jedno pod drugim bez ściskania. */
  .tablica td{padding:6px;height:var(--u-krata);vertical-align:top;cursor:pointer;
    transition:background .12s;position:relative}
  .tablica th.prac{padding:10px 12px;background:#FCFCFB;cursor:pointer;vertical-align:middle}
  .prac-av{width:32px;height:32px;border-radius:50%;color:#fff;font-size:12px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
  /* ⚠️ display:flex NA elemencie th odbiera komórce wysokość wiersza — tło kończyło się
     w połowie kratki, a nazwisko lądowało przy górnej krawędzi. Komórka zostaje table-cell,
     a flex trafia do wrappera w środku. */
  .tablica th.prac>.prac-w{display:flex;align-items:center;gap:10px}
  .prac-txt{min-width:0;display:flex;flex-direction:column;line-height:1.25}
  .prac-txt b{font-size:13px;font-weight:600;color:var(--ink)}
  .prac-h{font-size:11.5px;color:var(--ink-soft)}

  /* Karta wypełnia szerokość komórki — informacje mają nie być ściśnięte. */
  .zad-karta{width:100%;border:1px solid rgba(0,0,0,.07);border-left:3px solid var(--pole);
    border-radius:5px;padding:7px 9px;margin-bottom:5px;cursor:pointer}
  .zad-karta:hover{box-shadow:0 2px 6px rgba(0,0,0,.11)}
  .zk-tytul{font-weight:600;font-size:12.5px;text-transform:none;letter-spacing:0;line-height:1.25}
  .zk-czas{font-size:11.5px;color:var(--ink-soft);margin-top:1px;font-weight:500}
  .zk-wiersz{font-size:11.5px;color:var(--ink-soft);margin-top:2px;display:flex;gap:5px;
    align-items:baseline;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .zk-ik{flex-shrink:0;font-size:11px}
  .zad-plus{opacity:0;text-align:center;color:#B8B8B8;font-size:16px;transition:.12s;
    border:1px dashed var(--line);border-radius:5px;padding:2px 0;margin-top:2px}
  .tablica td:hover .zad-plus{opacity:1}

  /* Pasek podsumowania — jedna linia, nie kafle dashboardu. */
  .gr-podsum{display:flex;align-items:center;gap:26px;flex-wrap:wrap;margin-top:14px;
    background:#fff;border:1px solid var(--line);border-radius:var(--u-rog);padding:12px 18px;
    font-size:13px;color:var(--ink-soft)}
  .gr-ps-tyt{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink)}
  .gr-podsum b{font-size:16px;font-weight:800;color:var(--ink);margin-right:4px}

  /* Panel trzyma się ekranu przy przewijaniu i ma własny scroll. */
  .zasoby{width:auto;flex:none;position:sticky;top:14px;max-height:calc(100vh - 96px);
    overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:var(--u-rog)}
  .zas-item.masz{align-items:center;gap:8px}
  .masz-n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .masz-st{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    white-space:nowrap;flex-shrink:0;text-transform:capitalize}
  .masz-st .zas-kropka{margin-top:0}

  @media(max-width:1400px){ .grafik-uklad{grid-template-columns:minmax(0,1fr) 300px} }
  @media(max-width:1100px){
    .grafik-uklad{grid-template-columns:1fr}
    .zasoby{position:static;max-height:none}
  }

  /* ═══ WIDOK PRACOWNIKA ═════════════════════════════════════════════════════
     Osobny ekran, świadomie w innej skali niż panel gospodarza: duże napisy, mało treści,
     wszystko czytelne z odległości i w rękawicach. Pracownik ma zobaczyć CO, GDZIE i CZYM —
     nie analizować tabel. Dlatego zamiast siatki tygodnia dostaje listę kart. */
  .pr-top{display:flex;align-items:center;gap:16px;background:var(--pole);color:#fff;padding:0 24px;height:70px}
  .pr-brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px}
  .pr-brand .mark{width:34px;height:34px;border-radius:8px;background:#fff;color:var(--pole);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:19px}
  .pr-kto{margin-left:auto;font-size:16px;font-weight:600;opacity:.95}
  .pr-wyloguj{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);color:#fff;
    border-radius:8px;padding:9px 16px;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer;min-height:44px}
  .pr-wyloguj:hover{background:rgba(255,255,255,.26)}
  .pr-body{max-width:var(--u-szer);margin:0 auto;padding:calc(26px*var(--u-gestosc)) 24px 60px;zoom:var(--u-skala)}
  .pr-dzien{font-size:13px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:14px}
  .pr-dzien.nast{margin-top:34px;padding-top:24px;border-top:2px solid var(--line)}
  /* ⚠️ `auto-fit`, nie `auto-fill` — przy `auto-fill` dwie karty na szerokim ekranie zostawiały
     puste kolumny po prawej i widok wyglądał na wciśnięty w lewy róg. `auto-fit` zwija puste
     tory, więc karty rozciągają się na całą dostępną szerokość. */
  .pr-lista{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
  .pr-karta{background:#fff;border:1px solid var(--line);border-left:6px solid var(--pole);
    border-radius:10px;padding:20px 22px;box-shadow:0 1px 4px rgba(0,0,0,.07)}
  .pr-karta.glowna{padding:26px 28px;border-left-width:9px;box-shadow:0 2px 12px rgba(0,0,0,.10)}
  .pr-k-gora{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
  .pr-k-czas{font-size:20px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
  .pr-karta.glowna .pr-k-czas{font-size:27px}
  .pr-k-stan{margin-left:auto;font-size:13px;font-weight:700;white-space:nowrap}
  .pr-k-tytul{font-size:23px;font-weight:800;color:var(--ink);text-transform:uppercase;
    letter-spacing:.01em;line-height:1.15;margin:0 0 4px}
  .pr-karta.glowna .pr-k-tytul{font-size:31px}
  .pr-k-data{font-size:14px;color:var(--ink-soft);margin-bottom:8px}
  .pr-k-linie{margin-top:12px;display:flex;flex-direction:column;gap:8px}
  .pr-k-linia{display:flex;align-items:baseline;gap:10px;font-size:17px;color:var(--ink)}
  .pr-karta.glowna .pr-k-linia{font-size:19px}
  .pr-k-linia span{font-size:19px;flex-shrink:0}
  .pr-k-linia b{font-weight:600}
  .pr-k-linia i{font-style:normal;color:var(--ink-soft);font-size:15px}
  .pr-brak{background:#fff;border:1px dashed var(--border-h,#C8C8C8);border-radius:10px;
    padding:36px 24px;text-align:center;color:var(--ink-soft)}
  .pr-brak b{display:block;font-size:19px;color:var(--ink);margin-bottom:6px}
  .pr-stopka{margin-top:40px;text-align:center;font-size:12px;color:var(--ink-soft)}
  @media(max-width:720px){
    .pr-top{padding:0 14px;height:62px;gap:10px}
    .pr-brand{font-size:16px} .pr-kto{font-size:13px}
    .pr-body{padding:18px 14px 50px}
    .pr-lista{grid-template-columns:1fr}
    .pr-karta.glowna .pr-k-tytul{font-size:27px}
    .pr-karta.glowna .pr-k-czas{font-size:24px}
  }

  /* ═══ TELEFON ══════════════════════════════════════════════════════════════
     Zmierzone przed poprawką na ekranie 390 px: dokument miał 489 px, czyli stronę
     dało się przewijać w bok, a karty i przyciski były ucięte. Trzy realne przyczyny:
     (1) `.sb-foot` — nazwa gospodarstwa i przyciski Kopia/Wczytaj płynęły w bok, ich prawa
         krawędź sięgała 542 px, mimo że sidebar zwinął się w poziomy pasek ikon;
     (2) `.sb-nav` rozpychał się na 402 px zamiast przewijać;
     (3) navbar nie mieścił logo, sezonu, dzwonka i profilu naraz — logo łamało się na dwie linie.
     Poniżej naprawiamy przyczyny, a `overflow-x:hidden` na końcu jest tylko siatką
     bezpieczeństwa na przyszłe dodatki, nie zamiataniem problemu. */
  @media(max-width:720px){
    /* Sidebar jako poziomy pasek: ma się PRZEWIJAĆ, a nie rozpychać stronę. */
    .sb-nav{max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;
      scrollbar-width:none;flex-wrap:nowrap}
    .sb-nav::-webkit-scrollbar{display:none}
    /* ⚠️ Bazowa reguła daje `.sb-item{width:100%}` — w pionowym sidebarze słusznie, ale
       w poziomym pasku KAŻDA pozycja zajmowała wtedy całą szerokość (zmierzone: 365 px),
       więc widać było tylko jedną ikonę i trzeba było przewijać do reszty. */
    .sb-item{flex:0 0 auto;width:auto}
    /* Stopka sidebara nie ma sensu w pasku ikon — nazwa gospodarstwa jest w Ustawieniach,
       a Kopia/Wczytaj to czynności „przy komputerze", nie w polu z telefonu. */
    .sb-foot{display:none}

    /* Navbar: nazwa to GOŁY TEKST w `.nav-logo` (obok `.mark` i `.tag`), więc nie da się jej
       ukryć selektorem — zamiast tego blokujemy łamanie i zmniejszamy pismo. Bez `nowrap`
       „M-FarmX" łamało się na dwie linie i rozpychało cały pasek. */
    .nav-logo{white-space:nowrap;font-size:15px;flex-shrink:0}
    .nav-logo .tag{display:none}
    .navbar{gap:6px;padding-left:8px;padding-right:8px}
    /* ⚠️ Zmierzone: przycisk „Wyloguj" miał prawą krawędź na 450 px przy ekranie 390 px,
       czyli był CAŁKOWICIE poza ekranem — na telefonie nie dało się wylogować, a awatar
       był przycięty. Pasek nie mieścił naraz logo, sezonu, dzwonka, profilu i wylogowania.
       Rozwiązanie: profil (imię + rola) znika — te same dane są w Ustawieniach — a wybór
       sezonu się zwęża. Zostają rzeczy, które realnie klika się z telefonu. */
    .nav-user{display:none}
    .nav-season{padding:0 6px;height:36px;flex-shrink:1;min-width:0}
    .nav-season select{font-size:12px;max-width:92px}
    .nav-icon{flex-shrink:0}

    /* Kafle statystyk: dwa w rzędzie, ale liczone tak, żeby NA PEWNO się zmieściły. */
    .stat-strip{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:10px}
    .stat-strip>*{min-width:0}

    /* Wiersze i formularze: wszystko w jednej kolumnie zamiast ściskania w bok. */
    .row2{grid-template-columns:1fr!important}
    .module-head{flex-direction:column;align-items:stretch;gap:10px}
    .module-head .btn{width:100%;justify-content:center}

    /* Konta: akcje pod adresem, bo obok się nie mieszczą przy długim mailu. */
    .u-row{flex-direction:column;align-items:stretch;gap:10px}
    .u-akcje .btn{flex:1;justify-content:center}

    /* Palec potrzebuje ok. 44 px — poniżej tego trafia się w sąsiedni przycisk. */
    .btn,.sb-item,.nav-icon{min-height:44px}
    .btn.small{min-height:38px}

    /* Okno dialogowe na telefonie ma być pełnoekranowe, nie kartką pośrodku. */
    .modal{width:100%;max-width:100%;max-height:92vh;border-radius:14px 14px 0 0;
      position:fixed;left:0;right:0;bottom:0;top:auto}
    .modal-body{max-height:66vh;overflow-y:auto}
    .modal-foot .btn{flex:1;justify-content:center}

    /* Mapa niższa — na telefonie ma być widok, nie cała strona. */
    .map-wrap,#map{height:320px!important}

    /* Grafik: panel zasobów pod tablicą, nie obok — obok zostałoby na niego ~90 px.
       Sama tablica ma `min-width:760px`, więc przewija się w poziomie WEWNĄTRZ swojej ramki
       (`.tablica-wrap`), a nie rozpycha strony. To celowe: siatka tygodnia musi zostać siatką. */
    .grafik-uklad{flex-direction:column}
    .zasoby{width:100%;flex:1 1 auto}
    .tablica-wrap{width:100%}
    .tablica th.prac,.tablica th.prac-naglowek{width:120px}
    /* Przeciąganie palcem po telefonie bywa zawodne — kliknięcie kratki otwiera formularz,
       więc każda operacja jest osiągalna bez drag&drop. */
    .zas-uchwyt{display:none}

    /* Siatka bezpieczeństwa: gdyby coś nowego znów wystawało, ma się przyciąć,
       a nie rozjeżdżać całej strony w bok. */
    html,body{overflow-x:hidden}
  }

  /* ═══ PULPIT — centrum operacyjne ══════════════════════════════════════════
     Mapa jest tu najważniejszym elementem, więc dostaje pełną szerokość i ok. 700 px
     wysokości; panel operacyjny po prawej ma stałe 360 px, żeby treść nie skakała przy
     każdej zmianie danych.
     ⚠️ Ograniczenie `.content{max-width:1180px}` zdejmuje klasa `pelna` nadawana w render() —
     bez niej mapa zostaje wąskim widżetem na 2/3 ekranu, tak jak wcześniej Grafik i Flota. */
  .pulpit-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;
    flex-wrap:wrap;margin-bottom:16px}
  .pulpit-akcje{display:flex;gap:8px;flex-wrap:wrap}
  .pulpit-uklad{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;align-items:start}
  .pulpit-mapa{min-width:0}
  .pulpit-mapa #map{height:clamp(560px,74vh,760px)}
  .pulpit-mapa .map-off{height:clamp(560px,74vh,760px)}

  /* Panel operacyjny — sekcje zwijane, stan pamiętany w `state.ui.pulpit.otwarte`. */
  .panel-op{position:sticky;top:14px;max-height:calc(100vh - 28px);overflow:auto;
    display:flex;flex-direction:column;gap:10px}
  .op-sekcja{background:#fff;border:1px solid var(--line-strong);border-radius:8px;
    box-shadow:var(--shadow);overflow:hidden}
  .op-glowa{width:100%;display:flex;align-items:center;gap:9px;background:none;border:none;
    padding:12px 13px;cursor:pointer;font-family:var(--sans);font-size:11.5px;font-weight:800;
    letter-spacing:.07em;color:var(--ink-soft);text-align:left}
  .op-glowa:hover{color:var(--pole)}
  .op-glowa .zas-strzalka{transition:transform .15s;display:inline-block;font-size:10px}
  .op-sekcja.otwarta .zas-strzalka{transform:rotate(90deg)}
  .op-glowa .zas-licznik{margin-left:auto;background:var(--line2);color:var(--ink-soft);
    border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700;letter-spacing:0}
  .op-tresc{display:none;padding:0 11px 11px}
  .op-sekcja.otwarta .op-tresc{display:block}
  .op-pusto{font-size:12.5px;color:var(--ink-soft);padding:6px 2px 2px}

  .op-dzis-sum{display:flex;gap:14px;flex-wrap:wrap;padding:8px 3px 10px;margin-bottom:6px;
    border-bottom:1px solid var(--line);font-size:12px;color:var(--ink-soft)}
  .op-dzis-sum b{font-size:15px;color:var(--ink);margin-right:4px}

  /* Wiersz zadania — godzina, kolor rodzaju pracy, treść. Klikalny w całości. */
  .op-zad{display:flex;align-items:center;gap:9px;padding:7px 5px;border-radius:7px;cursor:pointer}
  .op-zad:hover{background:#F2F5F1}
  .op-godz{font-family:var(--mono);font-size:11.5px;color:var(--ink-soft);width:38px;flex-shrink:0}
  .op-pasek{width:3px;align-self:stretch;min-height:26px;border-radius:2px;flex-shrink:0}
  .op-zad.trwa .op-pasek{box-shadow:0 0 0 2px rgba(240,177,58,.4)}
  .op-zad.zrobione{opacity:.55}
  .op-t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35}
  .op-t b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .op-sub{font-size:11.5px;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .op-masz{display:flex;align-items:center;gap:9px;padding:7px 5px;border-radius:7px}
  .op-masz:hover{background:#F2F5F1}
  .op-ik{font-size:17px;flex-shrink:0}
  .op-todo{display:flex;align-items:center;gap:8px;padding:7px 9px;margin-bottom:5px;
    background:var(--card-2);border:1px solid var(--line);border-radius:7px;font-size:12.5px;
    cursor:grab;line-height:1.3}
  .op-todo:hover{border-color:var(--pole)}
  .op-akt{max-height:330px;overflow:auto;margin:0 -6px}
  .op-akt .feed-item{padding:8px 8px}
  .op-akt .feed-ic{width:28px;height:28px;border-radius:6px}
  .op-akt .st-badge{display:none}

  /* Dymek pola na mapie — stąd wchodzi się w dziennik ALBO od razu planuje pracę. */
  .mh-leg{display:inline-flex;align-items:center;gap:5px}
  .mh-leg i{width:13px;height:13px;border:2px solid;border-radius:3px;background:rgba(0,0,0,.06)}

  .pf-pop{min-width:200px;font-family:var(--sans)}
  .pf-tyt{font-size:14px;font-weight:700;color:var(--ink)}
  .pf-lin{font-size:12px;color:var(--ink-soft);line-height:1.5;margin-top:2px}
  .pf-teraz{font-size:12px;color:#B4622E;font-weight:600;margin-top:5px}
  .pf-akcje{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
  .pf-akcje button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 8px;
    font-family:var(--sans);font-size:12px;color:var(--ink);cursor:pointer;white-space:nowrap}
  .pf-akcje button:hover{border-color:var(--pole);color:var(--pole)}
  .pf-akcje button.gl{background:var(--pole);border-color:var(--pole);color:#fff}

  /* Poniżej ~1400 px panel schodzi pod mapę. Przy węższym ekranie sidebar + panel 360 px
     zostawiają mapie ok. 700 px — prawie kwadrat, w którym pola przestają być czytelne. */
  @media(max-width:1400px){
    .pulpit-uklad{grid-template-columns:1fr}
    .panel-op{position:static;max-height:none}
    .op-akt{max-height:none}
  }
  @media(max-width:760px){
    .pulpit-mapa #map,.pulpit-mapa .map-off{height:clamp(320px,58vh,460px)}
    /* Siedem kafelków jeden pod drugim zabierało na telefonie cały pierwszy ekran, a na
       Pulpicie najpierw ma być widać mapę. Zjeżdżają więc w jeden przewijany pasek. */
    .stat-strip{display:flex!important;flex-wrap:nowrap;overflow-x:auto;gap:8px;
      margin-bottom:14px;padding-bottom:4px;scrollbar-width:none}
    .stat-strip::-webkit-scrollbar{display:none}
    .stat-card{flex:0 0 auto;padding:9px 12px;gap:9px}
    .stat-ic{width:28px;height:28px}
    .stat-num{font-size:18px}
    .stat-lab{font-size:11px;white-space:nowrap;margin-top:1px}
    .pulpit-head{align-items:flex-start}
    .pulpit-akcje{width:100%}
    .pulpit-akcje .btn{flex:1;justify-content:center}
  }

  /* ═══ Formularz zadania — wybór miejsca pracy ═══════════════════════════════ */
  .field.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .wyb-miejsca{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .wyb-m{display:flex;align-items:center;gap:12px;padding:15px 16px;background:var(--card-2);
    border:1px solid var(--line-strong);border-radius:10px;cursor:pointer;text-align:left;
    font-family:var(--sans);font-size:14px;font-weight:600;color:var(--ink);transition:.12s}
  .wyb-m:hover{border-color:var(--pole);background:#F2F5F1;transform:translateY(-1px)}
  .wm-ik{font-size:24px;line-height:1}
  .zmien-miejsce{background:none;border:none;padding:0 0 12px;font-family:var(--sans);font-size:12.5px;
    color:var(--ink-soft);cursor:pointer}
  .zmien-miejsce:hover{color:var(--pole);text-decoration:underline}
  .przelacz2{display:flex;gap:0;border:1px solid var(--line-strong);border-radius:8px;overflow:hidden}
  .przelacz2 .pz{flex:1;padding:9px 10px;background:var(--card-2);border:none;cursor:pointer;
    font-family:var(--sans);font-size:13px;color:var(--ink-soft)}
  .przelacz2 .pz+.pz{border-left:1px solid var(--line-strong)}
  .przelacz2 .pz.akt{background:var(--pole);color:#fff;font-weight:600}
  @media(max-width:760px){ .field.row3{grid-template-columns:1fr} .wyb-miejsca{grid-template-columns:1fr} }

  /* Karta zadania w Grafiku: ikona miejsca pracy + opis (warsztat) + znacznik pilności.
     Delikatnie — tablica ma zostać czytelna, a nie zamienić się w choinkę. */
  .zk-miejsce{margin-right:4px;font-size:11px}
  .zk-opis{font-size:11px;color:var(--ink-soft);margin-top:3px;line-height:1.3;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .zk-pilne{background:#D9534F;color:#fff;border-radius:3px;padding:0 4px;font-size:9px;
    font-weight:800;letter-spacing:.04em;vertical-align:middle}

  /* Nowe pole: mapa dostaje tyle miejsca, ile Pulpit — obrys rysuje się palcem po
     narożnikach, a na małym kadrze trafienie w miedzę jest loterią. */
  .content.pelna .create-grid{grid-template-columns:minmax(0,1fr) 380px;gap:20px}
  .content.pelna #createMap{height:clamp(520px,72vh,740px)}
  @media(max-width:1100px){
    .content.pelna .create-grid{grid-template-columns:1fr}
    .content.pelna #createMap{height:clamp(360px,56vh,520px)}
  }

  /* Pasek filtrów Grafiku — jeden grafik dla wszystkich prac, filtr tylko go zawęża. */
  .gr-filtry{display:flex;align-items:center;justify-content:space-between;gap:12px;
    flex-wrap:wrap;margin:0 0 12px}
  .gr-chipy{display:flex;gap:6px;flex-wrap:wrap}
  .gr-chip{padding:6px 12px;border:1px solid var(--line-strong);background:var(--card);
    border-radius:99px;cursor:pointer;font-family:var(--sans);font-size:12.5px;color:var(--ink-soft)}
  .gr-chip:hover{border-color:var(--pole);color:var(--pole)}
  .gr-chip.akt{background:var(--pole);border-color:var(--pole);color:#fff;font-weight:600}
  .gr-sel{display:flex;gap:8px;flex-wrap:wrap}
  .gr-sel .sel{font-family:var(--sans);font-size:12.5px;padding:6px 9px}
  .gr-ps-m{color:var(--ink-soft)}
  @media(max-width:760px){ .gr-filtry{flex-direction:column;align-items:stretch}
    .gr-sel .sel{flex:1;min-width:0} }

  .op-ikm{margin-right:5px;font-size:11px}
