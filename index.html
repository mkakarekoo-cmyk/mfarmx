/* ═══ MIEJSCE PRACY ════════════════════════════════════════════════════════════
   Ci sami ludzie pracują na polu, w warsztacie, w transporcie i w obejściu, więc jest
   JEDEN grafik, nie cztery. Miejsce pracy NIE jest osobnym polem zadania — wynika
   z rodzaju pracy, który zadanie ma od zawsze.
   ⚠️ Nie dokładaj tu drugiego pola (taskType, workLocationType) obok `rodzaj`. Dwa pola
   opisujące to samo rozjeżdżają się przy pierwszej edycji i potem nie wiadomo, któremu
   wierzyć — dokładnie ten sam błąd, przed którym broni się Flota (status maszyny liczony,
   nie zapisany). Nowe miejsce = nowy wpis tutaj + `miejsce` w rodzaju pracy. */
const MIEJSCA_PRACY = {
  pole:        {label:'Praca na polu',        krotko:'Pole',        ikona:'🚜', typ:'FIELD'},
  warsztat:    {label:'Praca warsztatowa',    krotko:'Warsztat',    ikona:'🔧', typ:'WORKSHOP'},
  transport:   {label:'Transport',            krotko:'Transport',   ikona:'🚚', typ:'TRANSPORT'},
  gospodarstwo:{label:'Praca w gospodarstwie',krotko:'Gospodarstwo',ikona:'🏠', typ:'FARM'},
  inne:        {label:'Inne',                 krotko:'Inne',        ikona:'●',  typ:'OTHER'},
};
/* Rodzaje pracy do wyboru w obrębie danego miejsca — formularz pokazuje tylko pasujące. */
const RODZAJE_MIEJSCA = k => Object.entries(RODZAJE_PRAC).filter(([,v])=>v.miejsce===k);
const miejscePracy = z => MIEJSCA_PRACY[(RODZAJE_PRAC[z&&z.rodzaj]||{}).miejsce||'pole'] || MIEJSCA_PRACY.pole;
const miejsceKlucz = z => (RODZAJE_PRAC[z&&z.rodzaj]||{}).miejsce || 'pole';
const jestWarsztat = z => miejscePracy(z).typ==='WORKSHOP';
const jestPolowe   = z => miejscePracy(z).typ==='FIELD';
/* Maszyny zadania — ciągnik i narzędzie to dwa gniazda na sprzęt (vehicleId + machineId).
   Praca warsztatowa używa tego samego gniazda: ciągnik trafia do `ciagnikId`, reszta do
   `maszynaId`. Dzięki temu konflikty, historia maszyny i Flota działają bez zmian. */
const maszynyZadania = z => [z&&z.ciagnikId, z&&z.maszynaId].filter(Boolean);
const STATUSY_ZADAN = {
  zaplanowane:{label:'zaplanowane', kolor:'#8A8A8A'},
  rozpoczete: {label:'rozpoczęte',  kolor:'#F0B13A'},
  wykonane:   {label:'wykonane',    kolor:'#57B657'},
  anulowane:  {label:'anulowane',   kolor:'#C0C0C0'},
};
const rodzajPracy = z => RODZAJE_PRAC[z.rodzaj] || RODZAJE_PRAC.polowe;
const KOLOR_STATUSU = {'dostępna':'#57B657','pracuje':'#F0B13A','warsztat':'#C08A2E','awaria':'#D9534F','serwis':'#8A8A8A','niedostępna':'#9AA0A6'};

const jestCiagnik = m => (m.typ||'').toLowerCase().startsWith('ciągnik') || (m.typ||'').toLowerCase().startsWith('ciagnik');
const maszynaById = id => state.machines.find(m=>m.id===id);
const poleById    = id => state.fields.find(f=>f.id===id);
const zadanieById = id => state.schedule.find(s=>s.id===id);

/* Poniedziałek tygodnia, który oglądamy. Trzymamy go w `view.weekStart` (ISO). */
function tydzienStart(){
  if(!view.weekStart){
    const d=new Date(); const p=(d.getDay()+6)%7;      // poniedziałek = 0
    d.setDate(d.getDate()-p); view.weekStart=fmtISO(d);
  }
  return new Date(view.weekStart+'T00:00:00');
}
function przesunTydzien(o){ const d=tydzienStart(); d.setDate(d.getDate()+o*7); view.weekStart=fmtISO(d); render(); }
function tenTydzien(){ view.weekStart=null; render(); }

/* Minuty od północy — do porównywania zakresów godzin. */
function naMinuty(hhmm){ const m=/^(\d{1,2}):(\d{2})$/.exec(hhmm||''); return m? (+m[1])*60 + (+m[2]) : null; }

/* Czy dwa zakresy godzin nachodzą na siebie. Brak godzin = traktujemy jak cały dzień,
   inaczej wpis bez godzin nigdy nie zgłosiłby konfliktu, choć maszyna jest zajęta. */
function zakresyKoliduja(od1,do1,od2,do2){
  const a1=naMinuty(od1)??0, a2=naMinuty(do1)??1440;
  const b1=naMinuty(od2)??0, b2=naMinuty(do2)??1440;
  return a1 < b2 && b1 < a2;
}

/* Kto już używa tej maszyny w tym dniu i godzinach. Zwraca kolidujące zadanie albo null.
   ⚠️ Sprawdzamy OBA pola — maszyna wpisana raz jako ciągnik, raz jako narzędzie to wciąż
   ta sama maszyna i nie może być w dwóch miejscach naraz. */
function konfliktMaszyny(maszynaId, date, od, dow, pomijId){
  if(!maszynaId) return null;
  return state.schedule.find(z =>
    z.id!==pomijId && z.date===date &&
    (z.ciagnikId===maszynaId || z.maszynaId===maszynaId) &&
    zakresyKoliduja(od,dow,z.od,z.do)
  ) || null;
}

/* Ten sam człowiek nie może być w dwóch miejscach naraz — a odkąd w grafiku są prace
   warsztatowe obok polowych, kolizja „naprawa 07–12" z „orką 10–14" zdarza się realnie.
   Wcześniej pilnowaliśmy tylko maszyn; pracownik był bez ochrony. */
function konfliktPracownika(workerId, date, od, dow, pomijId){
  if(!workerId) return null;
  return state.schedule.find(z =>
    z.id!==pomijId && z.date===date && z.workerId===workerId && z.status!=='anulowane' &&
    zakresyKoliduja(od,dow,z.od,z.do)
  ) || null;
}

/* Zadania, w których maszyna jest dziś zajęta — do pokazania statusu w panelu Flota. */
function zajetoscMaszyny(maszynaId, date){
  return state.schedule.filter(z=>z.date===date && (z.ciagnikId===maszynaId||z.maszynaId===maszynaId))
    .sort((a,b)=>(a.od||'').localeCompare(b.od||''));
}
function zajetoscPola(poleId, date){
  return state.schedule.filter(z=>z.date===date && z.poleId===poleId)
    .sort((a,b)=>(a.od||'').localeCompare(b.od||''));
}

function opisPola(f){
  const ha=parseFloat(f.powierzchnia_ha)||0;
  const s=(f.sezony||[]).find(x=>x.rok===view.year) || (f.sezony||[])[0];
  return { ha: ha? ha.toFixed(1).replace('.',',')+' ha' : '', uprawa: s&&s.uprawa ? s.uprawa : '' };
}

/* ─── Panel zasobów (prawa kolumna) ──────────────────────────────────────────── */
function renderPanelZasobow(){
  const g=state.ui.grafik, szuk=(g.szukaj||'').toLowerCase().trim();
  const pasuje=t=>!szuk || (t||'').toLowerCase().includes(szuk);
  const otw=k=>(g.otwarte||[]).includes(k)?' otwarta':'';
  const dzis=fmtISO(new Date());

  // 1. DO ZROBIENIA
  const zadania=state.tasks.filter(t=>pasuje(t.nazwa));
  const listaZadan = zadania.length
    ? zadania.map(t=>`<div class="zas-item zad" draggable="true" ondragstart="dragZadanie(event,'${t.id}')">
        <span class="zas-uchwyt">⠿</span><span class="zas-nazwa">${esc(t.nazwa)}</span>
        <button class="zas-x" onclick="usunSzablon('${t.id}')" title="Usuń z listy">×</button></div>`).join('')
    : `<div class="zas-pusto">${szuk?'Nic nie pasuje.':'Lista pusta.'}</div>`;

  // 2. FLOTA — status liczony z grafiku na dziś, nie wpisywany ręcznie
  const maszyny=state.machines.filter(m=>pasuje(m.nazwa)||pasuje(m.typ));
  const listaFloty = maszyny.length
    ? maszyny.map(m=>{
        const zaj=zajetoscMaszyny(m.id,dzis);
        const awaria=m.status==='awaria'||m.status==='serwis';
        const kolor = awaria ? KOLOR_STATUSU[m.status] : (zaj.length? KOLOR_STATUSU['pracuje'] : KOLOR_STATUSU['dostępna']);
        const podpis = awaria ? m.status
          : zaj.length ? zaj.map(z=>{ const w=workerById(z.workerId);
              return `Zajęty ${esc(z.od||'')}${z.do?'–'+esc(z.do):''} · ${w?esc(w.imie.split(' ')[0]):'—'}`; }).join('<br>')
          : 'dostępna';
        // Nazwa po lewej, status po prawej — jak na tablicy dyspozytorskiej. Szczegóły
        // (typ, numer, kto zajmuje) idą w dymku, żeby wiersz nie puchł do trzech linijek.
        const tytul=[m.typ, m.nr_rej, podpis.replace(/<br>/g,' · ')].filter(Boolean).join(' · ');
        return `<div class="zas-item masz" draggable="true" ondragstart="dragMaszyne(event,'${m.id}')"
            onclick="openMaszynaForm('${m.id}')" title="${esc(tytul)}">
          <span class="zas-nazwa masz-n">${jestCiagnik(m)?'🚜':'🔧'} ${esc(m.nazwa)}</span>
          <span class="masz-st" style="color:${kolor}"><span class="zas-kropka" style="background:${kolor}"></span>${esc(awaria?m.status:(zaj.length?'pracuje':'dostępna'))}</span></div>`;
      }).join('')
    : `<div class="zas-pusto">${szuk?'Nic nie pasuje.':'Brak maszyn.'}</div>`;

  // 3. POLA
  const pola=state.fields.filter(f=>pasuje(f.nazwa));
  const listaPol = pola.length
    ? pola.map(f=>{ const o=opisPola(f); const zaj=zajetoscPola(f.id,dzis);
        return `<div class="zas-item pole" draggable="true" ondragstart="dragPole(event,'${f.id}')"
            title="Przeciągnij na zadanie">
          <span class="zas-nazwa">📍 ${esc(f.nazwa)}
            <span class="zas-meta">${o.ha}${o.uprawa?' · '+esc(o.uprawa):''}</span>
            ${zaj.length?`<span class="zas-meta">${zaj.map(z=>{const w=workerById(z.workerId);
              return esc(z.zadanie||'Zadanie')+' · '+(w?esc(w.imie.split(' ')[0]):'—')+' '+esc(z.od||'');}).join('<br>')}</span>`:''}
          </span></div>`; }).join('')
    : `<div class="zas-pusto">${szuk?'Nic nie pasuje.':'Brak pól.'}</div>`;

  const sekcja=(klucz,tytul,licznik,przycisk,tresc)=>`
    <div class="zas-sekcja${otw(klucz)}">
      <button class="zas-glowa" onclick="przelaczSekcje('${klucz}')">
        <span class="zas-strzalka">▸</span><span>${tytul}</span><span class="zas-licznik">${licznik}</span></button>
      <div class="zas-tresc">${przycisk}${tresc}</div>
    </div>`;

  return `<aside class="zasoby">
    <div class="zas-szukaj"><input placeholder="Szukaj maszyny, pola, zadania…" value="${esc(g.szukaj||'')}"
      oninput="szukajZasobu(this.value)"></div>
    ${sekcja('zadania','DO ZROBIENIA',state.tasks.length,
      `<button class="btn small" style="width:100%;justify-content:center;margin-bottom:8px" onclick="dodajSzablon()">+ Dodaj zadanie</button>`,listaZadan)}
    ${sekcja('flota','FLOTA / MASZYNY',state.machines.length,
      `<button class="btn small" style="width:100%;justify-content:center;margin-bottom:8px" onclick="openMaszynaForm()">+ Dodaj pojazd/maszynę</button>`,listaFloty)}
    ${sekcja('pola','POLA',state.fields.length,
      `<button class="btn small" style="width:100%;justify-content:center;margin-bottom:8px" onclick="goModule('pola')">+ Dodaj pole</button>`,listaPol)}
  </aside>`;
}

function ustawGrafik(k,v){ state.ui.grafik[k]=v; save(); render(); }
function wyczyscFiltryGrafiku(){
  Object.assign(state.ui.grafik,{miejsce:'',pracownik:'',maszyna:'',stan:''}); save(); render();
}

function przelaczSekcje(k){
  const o=state.ui.grafik.otwarte||[];
  state.ui.grafik.otwarte = o.includes(k) ? o.filter(x=>x!==k) : [...o,k];
  save(); render();
}
function szukajZasobu(v){
  state.ui.grafik.szukaj=v;
  // Bez pełnego renderu — inaczej pole tekstowe traciłoby ognisko przy każdej literze.
  const p=document.querySelector('.zasoby'); if(!p) return;
  const nowy=document.createElement('div'); nowy.innerHTML=renderPanelZasobow();
  const stary=p, swiezy=nowy.firstElementChild;
  const inp=swiezy.querySelector('.zas-szukaj input');
  stary.replaceWith(swiezy);
  if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length); }
}

/* ─── Karta zadania na siatce ────────────────────────────────────────────────── */
function kartaZadania(z){
  const c=z.ciagnikId?maszynaById(z.ciagnikId):null;
  const m=z.maszynaId?maszynaById(z.maszynaId):null;
  const p=z.poleId?poleById(z.poleId):null;
  const w=workerById(z.workerId);
  const kolMasz = (c&&konfliktMaszyny(c.id,z.date,z.od,z.do,z.id)) || (m&&konfliktMaszyny(m.id,z.date,z.od,z.do,z.id));
  const kolPrac = konfliktPracownika(z.workerId,z.date,z.od,z.do,z.id);
  const kolizja = kolMasz || kolPrac;
  const alertKol = kolizja
    ? ` <span class="zk-alert" title="${kolPrac?'Ten pracownik ma w tym czasie inne zadanie':'Ta maszyna jest w tym czasie zajęta'}">⚠</span>`
    : '';
  const M=miejscePracy(z);
  // Karta jest CELEM upuszczenia maszyny i pola — stąd ondrop na całym kafelku.
  const r=rodzajPracy(z), st=z.status||'zaplanowane';
  // Lewy pasek karty niesie RODZAJ pracy (od razu widać, co to za robota), a stan pokazujemy
  // wygaszeniem i znaczkiem — wykonane i anulowane mają zejść wizualnie na drugi plan.
  return `<div class="zad-karta st-${st}${kolizja?' kolizja':''}"
      style="border-left-color:${r.kolor};background:${r.tlo}"
      draggable="true" ondragstart="dragKarte(event,'${z.id}')"
      ondragover="event.preventDefault();this.classList.add('cel')" ondragleave="this.classList.remove('cel')"
      ondrop="dropNaKarte(event,'${z.id}')"
      onclick="event.stopPropagation();pokazZadanie('${z.id}')">
    <div class="zk-tytul" style="color:${r.kolor}">${st==='wykonane'?'<span class="zk-ptak">✓</span> ':''}<span class="zk-miejsce" title="${esc(M.label)}">${M.ikona}</span>${esc(z.zadanie||z.zajecie||'Zadanie')}${z.priorytet==='pilny'?' <span class="zk-pilne" title="Priorytet: pilny">PILNE</span>':''}${alertKol}</div>
    ${(z.od||z.do)?`<div class="zk-czas">${esc(z.od||'')}${z.do?'–'+esc(z.do):''}</div>`:''}
    ${c?`<div class="zk-wiersz"><span class="zk-ik">🚜</span>${esc(c.nazwa)}</div>`:''}
    ${m?`<div class="zk-wiersz"><span class="zk-ik">🔧</span>${esc(m.nazwa)}</div>`:''}
    ${p?`<div class="zk-wiersz"><span class="zk-ik">📍</span>${esc(p.nazwa)}</div>`:''}
    ${!p&&z.klient?`<div class="zk-wiersz"><span class="zk-ik">👤</span>${esc(z.klient)}</div>`:''}
    ${z.opis?`<div class="zk-opis">${esc(z.opis)}</div>`:''}
  </div>`;
}

/* ─── Główny widok ───────────────────────────────────────────────────────────── */
function renderGrafikModule(){
  const head=naglowekStrony('grafik','Grafik','Planowanie pracy gospodarstwa — kto, co, kiedy i czym','');
  if(!state.workers.length){
    return head+`<div class="empty-state"><div class="big">Brak pracowników</div>
      <div style="margin-bottom:16px">Dodaj pracowników, a potem rozdzielaj im prace na tablicy tygodnia.</div>
      <button class="btn primary" onclick="openWorkerForm()">+ Dodaj pierwszego pracownika</button></div>`;
  }

  const start=tydzienStart();
  const dni=[...Array(7)].map((_,i)=>{ const d=new Date(start); d.setDate(d.getDate()+i); return d; });
  const dzisISO=fmtISO(new Date());
  const zakres=`${dni[0].toLocaleDateString('pl-PL',{day:'numeric',month:'short'})} – ${dni[6].toLocaleDateString('pl-PL',{day:'numeric',month:'short',year:'numeric'})}`;
  const wTygodniu=z=>z.date>=fmtISO(dni[0]) && z.date<=fmtISO(dni[6]);

  const naglowki=dni.map(d=>{ const iso=fmtISO(d), we=[5,6].includes((d.getDay()+6)%7);
    return `<th class="${iso===dzisISO?'dzis':''}${we?' weekend':''}">${DNI_TYG[(d.getDay()+6)%7]}<span>${d.getDate()}.${String(d.getMonth()+1).padStart(2,'0')}</span></th>`;
  }).join('');

  /* Filtry zawężają WIDOK, nie dane — kierownik może wybrać „Warsztat" i zobaczyć sam
     warsztat, ale to dalej ten jeden grafik, a nie osobna tablica. */
  const g=state.ui.grafik;
  const pasuje=z=>
    (!g.miejsce  || miejsceKlucz(z)===g.miejsce) &&
    (!g.maszyna  || maszynyZadania(z).includes(g.maszyna)) &&
    (!g.stan     || (z.status||'zaplanowane')===g.stan);
  /* Dezaktywowany pracownik znika z tablicy, ale JEGO ZADANIA ZOSTAJĄ w danych — historia
     prac i rozliczenie godzin muszą się zgadzać także po odejściu człowieka z gospodarstwa. */
  const czynni = pracownicyAktywni();
  const pracownicy = g.pracownik ? state.workers.filter(w=>w.id===g.pracownik) : czynni;

  const wiersze=pracownicy.map(w=>{
    // Godziny w tygodniu — z zaplanowanych zakresów, a gdy praca jest odhaczona, z wykonania.
    const jego=state.schedule.filter(z=>z.workerId===w.id && wTygodniu(z) && z.status!=='anulowane' && pasuje(z));
    const h=jego.reduce((s,z)=>s+liczba((z.wykonanie&&z.wykonanie.godziny)||godzinyZadania(z)),0);
    const inicjaly=(w.imie||'?').split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
    const komorki=dni.map(d=>{ const iso=fmtISO(d), we=[5,6].includes((d.getDay()+6)%7);
      const zad=state.schedule.filter(z=>z.workerId===w.id && z.date===iso && pasuje(z))
        .sort((a,b)=>(a.od||'').localeCompare(b.od||''));
      return `<td class="${iso===dzisISO?'dzis':''}${we?' weekend':''}" ondragover="event.preventDefault();this.classList.add('cel')"
          ondragleave="this.classList.remove('cel')" ondrop="dropNaKomorke(event,'${w.id}','${iso}')"
          onclick="openZadanieForm('${w.id}','${iso}')">
        ${zad.map(kartaZadania).join('')}<div class="zad-plus">+</div></td>`;
    }).join('');
    return `<tr><th class="prac" onclick="pokazPracownika('${w.id}')" title="Karta pracownika">
        <span class="prac-w"><span class="prac-av" style="background:${w.kolor||'#5E7F54'}">${esc(inicjaly)}</span>
        <span class="prac-txt"><b>${esc(w.imie)}</b>
          <span class="prac-h">${h?h.toFixed(0)+' h':'0 h'}</span></span></span></th>${komorki}</tr>`;
  }).join('');

  // Jeden spójny pasek sterujący zamiast kontrolek rozrzuconych po szerokości ekranu.
  const toolbar=`<div class="gr-toolbar">
      <div class="gr-tb-l">
        <button class="gr-ikona" onclick="przesunTydzien(-1)" title="Poprzedni tydzień">‹</button>
        <div class="gr-zakres">📅 ${zakres}</div>
        <button class="gr-ikona" onclick="przesunTydzien(1)" title="Następny tydzień">›</button>
        <button class="btn small" onclick="tenTydzien()">Dzisiaj</button>
      </div>
      <div class="gr-tb-r">
        <button class="btn small primary" onclick="openZadanieForm('${state.workers[0].id}','${dzisISO}')">+ Zadanie</button>
        <button class="btn small" onclick="openWorkerForm()">+ Pracownik</button>
      </div>
    </div>
    <div class="gr-filtry">
      <div class="gr-chipy">
        <button class="gr-chip${g.miejsce?'':' akt'}" onclick="ustawGrafik('miejsce','')">Wszystkie</button>
        ${Object.entries(MIEJSCA_PRACY).filter(([k])=>k!=='inne').map(([k,v])=>
          `<button class="gr-chip${g.miejsce===k?' akt':''}" onclick="ustawGrafik('miejsce','${k}')">${v.ikona} ${v.krotko}</button>`).join('')}
      </div>
      <div class="gr-sel">
        <select class="sel" onchange="ustawGrafik('pracownik',this.value)">
          <option value="">Wszyscy pracownicy</option>
          ${state.workers.map(w=>`<option value="${w.id}" ${g.pracownik===w.id?'selected':''}>${esc(w.imie)}</option>`).join('')}</select>
        <select class="sel" onchange="ustawGrafik('maszyna',this.value)">
          <option value="">Wszystkie maszyny</option>
          ${state.machines.map(m=>`<option value="${m.id}" ${g.maszyna===m.id?'selected':''}>${esc(m.nazwa)}</option>`).join('')}</select>
        <select class="sel" onchange="ustawGrafik('stan',this.value)">
          <option value="">Każdy status</option>
          ${Object.entries(STATUSY_ZADAN).map(([k,v])=>`<option value="${k}" ${g.stan===k?'selected':''}>${v.label}</option>`).join('')}</select>
        ${(g.miejsce||g.pracownik||g.maszyna||g.stan)?`<button class="btn small" onclick="wyczyscFiltryGrafiku()">Wyczyść</button>`:''}
      </div>
    </div>`;

  // Podsumowanie tygodnia — jeden kompaktowy pasek, nie kafle dashboardu.
  const wt=state.schedule.filter(z=>wTygodniu(z) && z.status!=='anulowane' && pasuje(z));
  const wgMiejsc=Object.keys(MIEJSCA_PRACY)
    .map(k=>[k, wt.filter(z=>miejsceKlucz(z)===k).length]).filter(([,n])=>n);
  const godzRazem=wt.reduce((s,z)=>s+liczba((z.wykonanie&&z.wykonanie.godziny)||godzinyZadania(z)),0);
  const maszynIle=new Set(wt.flatMap(z=>[z.ciagnikId,z.maszynaId]).filter(Boolean)).size;
  const polIle=new Set(wt.map(z=>z.poleId).filter(Boolean)).size;
  const podsum=`<div class="gr-podsum">
      <span class="gr-ps-tyt">Podsumowanie tygodnia</span>
      <span><b>${state.workers.length}</b> pracowników</span>
      <span><b>${godzRazem.toFixed(0)} h</b> zaplanowanych</span>
      <span><b>${maszynIle}</b> maszyn w użyciu</span>
      <span><b>${polIle}</b> pola w pracach</span>
      ${wgMiejsc.map(([k,n])=>`<span class="gr-ps-m">${MIEJSCA_PRACY[k].ikona} <b>${n}</b> ${esc(MIEJSCA_PRACY[k].krotko.toLowerCase())}</span>`).join('')}
    </div>`;

  return head+toolbar+`<div class="grafik-uklad">
      <div class="gr-lewa">
        <div class="tablica-wrap"><table class="tablica">
          <thead><tr><th class="prac-naglowek">Pracownik<span>h w tygodniu</span></th>${naglowki}</tr></thead>
          <tbody>${wiersze}</tbody></table></div>
        ${podsum}
        <div class="set-desc" style="margin-top:10px">Kliknij pustą kratkę, aby dodać zadanie. Przeciągnij zadanie z listy
          na pracownika, a maszynę albo pole — wprost na gotową kartę.</div>
      </div>
      ${renderPanelZasobow()}
    </div>`;
}

/* ─── Przeciąganie ───────────────────────────────────────────────────────────
   Prosty HTML5 drag&drop. Rodzaj ładunku niesiemy w `text/plain` jako „typ:id",
   bo `dataTransfer.types` bywa niedostępne w trakcie dragover na części przeglądarek. */
function dragZadanie(e,id){ e.dataTransfer.setData('text/plain','szablon:'+id); e.dataTransfer.effectAllowed='copy'; }
function dragMaszyne(e,id){ e.dataTransfer.setData('text/plain','maszyna:'+id); e.dataTransfer.effectAllowed='copy'; }
function dragPole(e,id){ e.dataTransfer.setData('text/plain','pole:'+id); e.dataTransfer.effectAllowed='copy'; }
function dragKarte(e,id){ e.dataTransfer.setData('text/plain','karta:'+id); e.dataTransfer.effectAllowed='move'; }

/* Upuszczenie na kratkę PRACOWNIK + DZIEŃ: nowa praca z listy albo przeniesienie istniejącej. */
function dropNaKomorke(e,workerId,iso){
  e.preventDefault(); e.stopPropagation();
  document.querySelectorAll('.cel').forEach(x=>x.classList.remove('cel'));
  const [typ,id]=(e.dataTransfer.getData('text/plain')||'').split(':');
  if(typ==='szablon'){
    const t=state.tasks.find(x=>x.id===id); if(!t) return;
    openZadanieForm(workerId,iso,null,{zadanie:t.nazwa});      // formularz dopyta o godziny i sprzęt
  } else if(typ==='karta'){
    const z=zadanieById(id); if(!z) return;
    // Przeniesienie nie może cicho utworzyć konfliktu — sprawdzamy w NOWYM terminie
    // i u NOWEGO pracownika (upuszczenie zmienia oba naraz).
    const kolP=konfliktPracownika(workerId,iso,z.od,z.do,z.id);
    if(kolP && !potwierdzKonflikt(kolP,'pracownik')) return;
    const kol = konfliktMaszyny(z.ciagnikId,iso,z.od,z.do,z.id) || konfliktMaszyny(z.maszynaId,iso,z.od,z.do,z.id);
    if(kol && !potwierdzKonflikt(kol,'maszyna')) return;
    z.workerId=workerId; z.date=iso; save(); render();
  }
}

/* Upuszczenie maszyny albo pola wprost na gotową kartę — najszybsza droga do „czym i gdzie". */
function dropNaKarte(e,zadanieId){
  e.preventDefault(); e.stopPropagation();
  document.querySelectorAll('.cel').forEach(x=>x.classList.remove('cel'));
  const [typ,id]=(e.dataTransfer.getData('text/plain')||'').split(':');
  const z=zadanieById(zadanieId); if(!z) return;
  if(typ==='maszyna'){
    const m=maszynaById(id); if(!m) return;
    const kol=konfliktMaszyny(m.id,z.date,z.od,z.do,z.id);
    if(kol && !potwierdzKonflikt(kol)) return;
    if(jestCiagnik(m)) z.ciagnikId=m.id; else z.maszynaId=m.id;   // ciągnik i narzędzie to osobne pola
    save(); render();
  } else if(typ==='pole'){
    if(!poleById(id)) return;
    z.poleId=id; save(); render();
  } else if(typ==='szablon'){
    const t=state.tasks.find(x=>x.id===id); if(t){ z.zadanie=t.nazwa; save(); render(); }
  }
}

/* Konflikt pokazujemy JAKO PYTANIE, nie blokadę — bywa, że dwie prace dzielą maszynę po kolei,
   a system nie wie o wszystkim. Ale nie da się go przeoczyć: trzeba świadomie potwierdzić. */
/* Konflikt trzeba nazwać po imieniu — inaczej komunikat „ta maszyna jest zajęta" pojawiał
   się także wtedy, gdy zajęty był człowiek, i nikt nie wiedział, o co chodzi. */
function potwierdzKonflikt(kol, czego){
  const w=workerById(kol.workerId), p=kol.poleId?poleById(kol.poleId):null;
  const M=miejscePracy(kol);
  const naglowek = czego==='pracownik'
    ? 'KONFLIKT — '+(w?w.imie:'pracownik')+' ma już zadanie w tym czasie:'
    : 'KONFLIKT — ta maszyna jest już zajęta:';
  return confirm(naglowek+'\n\n'
    +M.ikona+' '+(kol.zadanie||'Zadanie')+'  '+(kol.od||'')+(kol.do?'–'+kol.do:'')
    +(czego==='pracownik'?'':'\n'+(w?w.imie:'—'))
    +(p?'\nPole: '+p.nazwa:'')
    +(kol.opis?'\n'+kol.opis:'')
    +'\n\nZapisać mimo to?');
}

/* ═══ FORMULARZ ZADANIA ════════════════════════════════════════════════════════
   Dwa kroki zamiast jednego wielkiego formularza: najpierw MIEJSCE pracy, potem tylko
   pola, które w tym miejscu mają sens. Przy pracy warsztatowej nie pytamy o pole uprawne,
   przy polowej — o priorytet naprawy.
   ⚠️ To jest JEDYNA ścieżka zapisu zadania w całej aplikacji. Pulpit, mapa, Flota, Grafik
   i karta maszyny otwierają ten sam formularz z gotowym presetem. Nie rób drugiego. */
let _zadanieSzkic=null;   // szkic przeżywa przełączenie miejsca pracy, żeby nie tracić wpisanego

const PRIORYTETY = {niski:'Niski', normalny:'Normalny', pilny:'Pilny'};

function openZadanieForm(workerId,iso,zadanieId,preset){
  const z = zadanieId ? zadanieById(zadanieId) : null;
  _zadanieSzkic = Object.assign(
    {id:'', workerId, date:iso, od:'07:00', do:'15:00', zadanie:'', rodzaj:'', status:'zaplanowane',
     ciagnikId:'', maszynaId:'', poleId:'', opis:'', priorytet:'normalny',
     zrodlo:'OWN', klient:'', uwagi:''},
    z||{}, preset||{}, z?{id:z.id}:{});
  const d=_zadanieSzkic;
  // Miejsce bierze się z rodzaju pracy; puste = pokaż wybór „co chcesz zaplanować".
  if(d.rodzaj) d.miejsce=(RODZAJE_PRAC[d.rodzaj]||{}).miejsce||'inne';
  else if(preset && preset.miejsce) { d.miejsce=preset.miejsce; d.rodzaj=domyslnyRodzaj(d.miejsce); }
  else d.miejsce='';
  rysujZadanieForm();
}
function domyslnyRodzaj(miejsce){ const l=RODZAJE_MIEJSCA(miejsce); return l.length?l[0][0]:'inne'; }

/* Przepisanie tego, co użytkownik zdążył wpisać, do szkicu — wołane przed każdym
   przerysowaniem formularza. Pola nieobecne w danym wariancie po prostu pomijamy. */
function zbierzZeSzkicu(){
  const d=_zadanieSzkic; if(!d) return;
  const we=(id,k)=>{ const e=document.getElementById(id); if(e) d[k]=e.value; };
  we('z_worker','workerId'); we('z_date','date'); we('z_od','od'); we('z_do','do');
  we('z_zadanie','zadanie'); we('z_rodzaj','rodzaj'); we('z_status','status');
  we('z_ciagnik','ciagnikId'); we('z_maszyna','maszynaId'); we('z_pole','poleId');
  we('z_opis','opis'); we('z_priorytet','priorytet'); we('z_klient','klient'); we('z_uwagi','uwagi');
  const p=document.getElementById('z_pojazd');
  if(p){ const m=p.value?maszynaById(p.value):null;
    d.ciagnikId = m&&jestCiagnik(m) ? m.id : '';
    d.maszynaId = m&&!jestCiagnik(m) ? m.id : ''; }
}
function wybierzMiejsce(k){
  zbierzZeSzkicu();
  const d=_zadanieSzkic;
  if(d.miejsce!==k){
    d.miejsce=k;
    d.rodzaj=domyslnyRodzaj(k);
    if(k!=='pole' && k!=='transport') d.poleId='';   // warsztat nie ma pola uprawnego
  }
  rysujZadanieForm();
}

function rysujZadanieForm(){
  const d=_zadanieSzkic, edycja=!!d.id;

  // Krok 1 — nic nie wiadomo o rodzaju pracy, więc pytamy o niego zamiast wysypywać
  // wszystkie pola naraz.
  if(!d.miejsce){
    openModal(`
      <div class="modal-head"><h3>Co chcesz zaplanować?</h3><button class="x" onclick="closeModal()">×</button></div>
      <div class="modal-body"><div class="wyb-miejsca">
        ${Object.entries(MIEJSCA_PRACY).map(([k,v])=>`
          <button class="wyb-m" onclick="wybierzMiejsce('${k}')">
            <span class="wm-ik">${v.ikona}</span><span class="wm-t">${v.label}</span></button>`).join('')}
      </div></div>
      <div class="modal-foot"><div class="spacer"></div>
        <button class="btn" onclick="closeModal()">Anuluj</button></div>`);
    return;
  }

  const M=MIEJSCA_PRACY[d.miejsce]||MIEJSCA_PRACY.inne;
  const opcje=(lista,wybrany,pusty)=>`<option value="">${pusty}</option>`+
    lista.map(o=>`<option value="${o.v}" ${o.v===wybrany?'selected':''}>${esc(o.t)}</option>`).join('');
  const prac=state.workers.map(w=>({v:w.id,t:w.imie}));
  const ciag=state.machines.filter(jestCiagnik).map(m=>({v:m.id,t:m.nazwa+(m.nr_rej?' · '+m.nr_rej:'')}));
  const masz=state.machines.filter(m=>!jestCiagnik(m)).map(m=>({v:m.id,t:m.nazwa+(m.typ?' · '+m.typ:'')}));
  const wszystkie=state.machines.map(m=>({v:m.id,t:m.nazwa+(m.typ?' · '+m.typ:'')}));
  const pola=state.fields.map(f=>{ const o=opisPola(f); return {v:f.id,t:f.nazwa+(o.ha?' – '+o.ha:'')+(o.uprawa?' · '+o.uprawa:'')}; });
  const podpowiedzi = d.miejsce==='warsztat' ? state.rodzajeWarsztatowe : state.tasks.map(t=>t.nazwa);
  const rodzaje=RODZAJE_MIEJSCA(d.miejsce);
  const pojazd = d.ciagnikId || d.maszynaId || '';

  const wspolne=`
    <div class="field row2">
      <div><label>Pracownik</label><select id="z_worker">${opcje(prac,d.workerId,'— wybierz —')}</select></div>
      <div><label>Data</label><input id="z_date" type="date" value="${esc(d.date||'')}"></div>
    </div>
    <div class="field row3">
      <div><label>Od</label><input id="z_od" type="time" value="${esc(d.od||'')}"></div>
      <div><label>Do</label><input id="z_do" type="time" value="${esc(d.do||'')}"></div>
      <div><label>Status</label><select id="z_status">${Object.entries(STATUSY_ZADAN)
        .map(([k,v])=>`<option value="${k}" ${k===(d.status||'zaplanowane')?'selected':''}>${v.label}</option>`).join('')}</select></div>
    </div>`;

  const polePracy=`
    <div class="field"><label>${d.miejsce==='warsztat'?'Rodzaj pracy':'Zadanie'}</label>
      <input id="z_zadanie" list="lista_zadan" value="${esc(d.zadanie||d.zajecie||'')}"
        placeholder="${d.miejsce==='warsztat'?'np. Naprawa':'np. Orka'}" autofocus>
      <datalist id="lista_zadan">${podpowiedzi.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>
      ${d.miejsce==='warsztat'?`<div class="hint">Lista podpowiada — możesz wpisać własną pracę. Pozycje zmienisz w Ustawieniach.</div>`:''}</div>`;

  // Rodzaj pracy pokazujemy tylko tam, gdzie jest z czego wybierać (pole ma 5 rodzajów,
  // warsztat czy transport — jeden, więc select byłby pustym gestem).
  const wyborRodzaju = rodzaje.length>1 ? `
    <div class="field"><label>Rodzaj</label><select id="z_rodzaj">${rodzaje
      .map(([k,v])=>`<option value="${k}" ${k===d.rodzaj?'selected':''}>${v.label}</option>`).join('')}</select>
      <div class="hint">Oprysk, nawożenie i siew po wykonaniu trafią do ewidencji zabiegów pola.</div></div>`
    : `<input type="hidden" id="z_rodzaj" value="${esc(d.rodzaj)}">`;

  let osobne='';
  if(d.miejsce==='pole'){
    osobne=`
      <div class="field"><label>Pole</label><select id="z_pole">${opcje(pola,d.poleId,'— bez pola —')}</select></div>
      <div class="field row2">
        <div><label>Ciągnik</label><select id="z_ciagnik">${opcje(ciag,d.ciagnikId,'— bez ciągnika —')}</select></div>
        <div><label>Maszyna / narzędzie</label><select id="z_maszyna">${opcje(masz,d.maszynaId,'— bez maszyny —')}</select></div>
      </div>`;
  } else if(d.miejsce==='transport'){
    osobne=`
      <div class="field row2">
        <div><label>Ciągnik / pojazd</label><select id="z_ciagnik">${opcje(ciag,d.ciagnikId,'— bez pojazdu —')}</select></div>
        <div><label>Przyczepa / maszyna</label><select id="z_maszyna">${opcje(masz,d.maszynaId,'— bez przyczepy —')}</select></div>
      </div>
      <div class="field"><label>Skąd — dokąd</label>
        <input id="z_opis" value="${esc(d.opis||'')}" placeholder="np. Pole 12 → magazyn"></div>
      <div class="field"><label>Pole (jeśli transport z pola)</label><select id="z_pole">${opcje(pola,d.poleId,'— bez pola —')}</select></div>`;
  } else if(d.miejsce==='warsztat'){
    /* Warsztat naprawia też cudze maszyny — architektura ma tego nie blokować. Pełnego
       CRM klientów tu nie ma i nie udajemy, że jest: przy maszynie klienta wystarczy nazwa. */
    const klienta = d.zrodlo==='CUSTOMER';
    osobne=`
      <div class="field"><label>Czyja maszyna</label>
        <div class="przelacz2">
          <button class="pz${klienta?'':' akt'}" onclick="ustawZrodlo('OWN')">Własna flota</button>
          <button class="pz${klienta?' akt':''}" onclick="ustawZrodlo('CUSTOMER')">Maszyna klienta</button>
        </div></div>
      ${klienta
        ? `<div class="field"><label>Klient / maszyna</label>
             <input id="z_klient" value="${esc(d.klient||'')}" placeholder="np. Kowalski — Zetor 7745"></div>`
        : `<div class="field"><label>Maszyna / pojazd</label>
             <select id="z_pojazd">${opcje(wszystkie,pojazd,'— bez maszyny (praca ogólna) —')}</select>
             <div class="hint">Nie każda praca w warsztacie dotyczy maszyny — porządki czy spawanie zostaw bez wyboru.</div></div>`}
      <div class="field"><label>Opis — co jest do zrobienia</label>
        <input id="z_opis" value="${esc(d.opis||'')}" placeholder="np. Wymiana pompy hydraulicznej"></div>
      <div class="field"><label>Priorytet</label><select id="z_priorytet">${Object.entries(PRIORYTETY)
        .map(([k,v])=>`<option value="${k}" ${k===(d.priorytet||'normalny')?'selected':''}>${v}</option>`).join('')}</select></div>`;
  } else {
    osobne=`
      <div class="field"><label>Maszyna / pojazd</label>
        <select id="z_pojazd">${opcje(wszystkie,pojazd,'— bez maszyny —')}</select></div>
      <div class="field"><label>Opis</label>
        <input id="z_opis" value="${esc(d.opis||'')}" placeholder="opcjonalnie"></div>`;
  }

  openModal(`
    <div class="modal-head"><h3>${M.ikona} ${edycja?'Zadanie':'Nowe zadanie'} — ${esc(M.krotko.toLowerCase())}</h3>
      <button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <button class="zmien-miejsce" onclick="zmienMiejsce()">↔ Zmień rodzaj pracy</button>
      ${wspolne}${polePracy}${wyborRodzaju}${osobne}
      <div class="field"><label>Uwagi</label><input id="z_uwagi" value="${esc(d.uwagi||'')}" placeholder="opcjonalnie"></div>
      <div id="z_err" class="auth-err"></div>
    </div>
    <div class="modal-foot">
      ${edycja?`<button class="btn danger" onclick="usunZadanie('${d.id}')">Usuń</button>`:''}
      <div class="spacer"></div>
      <button class="btn" onclick="closeModal()">Anuluj</button>
      <button class="btn primary" onclick="zapiszZadanie()">Zapisz</button></div>`);
}
function zmienMiejsce(){ zbierzZeSzkicu(); _zadanieSzkic.miejsce=''; rysujZadanieForm(); }
function ustawZrodlo(k){ zbierzZeSzkicu(); _zadanieSzkic.zrodlo=k; rysujZadanieForm(); }

function zapiszZadanie(){
  zbierzZeSzkicu();
  const d=_zadanieSzkic;
  const err=document.getElementById('z_err');
  const dane={
    workerId:d.workerId, date:d.date, od:d.od, do:d.do,
    zadanie:(d.zadanie||'').trim(), rodzaj:d.rodzaj||domyslnyRodzaj(d.miejsce), status:d.status||'zaplanowane',
    ciagnikId:d.ciagnikId||'', maszynaId:d.maszynaId||'', poleId:d.poleId||'',
    opis:(d.opis||'').trim(), uwagi:(d.uwagi||'').trim(),
  };
  if(d.miejsce==='warsztat'){
    dane.priorytet=d.priorytet||'normalny';
    dane.zrodlo=d.zrodlo||'OWN';
    dane.klient=dane.zrodlo==='CUSTOMER'?(d.klient||'').trim():'';
    if(dane.zrodlo==='CUSTOMER'){ dane.ciagnikId=''; dane.maszynaId=''; }
  }
  if(!dane.workerId){ err.textContent='Wybierz pracownika.'; return; }
  if(!dane.date){ err.textContent='Podaj datę.'; return; }
  if(!dane.zadanie){ err.textContent=d.miejsce==='warsztat'?'Wpisz rodzaj pracy warsztatowej.':'Wpisz, co ma być zrobione.'; return; }
  if(dane.od && dane.do && naMinuty(dane.do)<=naMinuty(dane.od)){ err.textContent='Godzina „do" musi być późniejsza niż „od".'; return; }

  // Konflikty: najpierw człowiek (jeden pracownik nie stanie w dwóch miejscach), potem sprzęt.
  const kolP=konfliktPracownika(dane.workerId,dane.date,dane.od,dane.do,d.id||null);
  if(kolP && !potwierdzKonflikt(kolP,'pracownik')) return;
  const kolM = konfliktMaszyny(dane.ciagnikId,dane.date,dane.od,dane.do,d.id||null)
            || konfliktMaszyny(dane.maszynaId,dane.date,dane.od,dane.do,d.id||null);
  if(kolM && !potwierdzKonflikt(kolM,'maszyna')) return;

  const kto=ktoTeraz();
  if(d.id){
    const stare=zadanieById(d.id);
    const przed={workerId:stare.workerId, date:stare.date, od:stare.od, do:stare.do,
      poleId:stare.poleId, ciagnikId:stare.ciagnikId, maszynaId:stare.maszynaId, rodzaj:stare.rodzaj,
      status:stare.status};
    Object.assign(stare, dane, {zmienilKto:kto.kto, zmieniono:new Date().toISOString()});
    powiadomOZmianie(stare, przed);
  } else {
    const nowe={id:uid(), ...dane, utworzylKto:kto.kto, utworzono:new Date().toISOString(),
      przypisalKto:kto.kto};
    state.schedule.push(nowe);
    powiadomONowym(nowe);
    // Zgłoszenie zamienione w zadanie — dopinamy ślad DOPIERO teraz, gdy zadanie naprawdę istnieje.
    if(_zgloszenieDoPowiazania){
      const t=(state.tasks||[]).find(x=>x.id===_zgloszenieDoPowiazania);
      if(t){ t.zadanieId=nowe.id; t.status='PLANNED';
        t.zaplanowalKto=kto.kto; t.zaplanowano=new Date().toISOString();
        if(t.zglosilWorkerId && t.zglosilWorkerId!==nowe.workerId)
          createNotification(t.zglosilWorkerId,'zgloszenie','Twoje zgłoszenie zaplanowane','„'+t.nazwa+'"',{});
      }
    }
  }
  _zgloszenieDoPowiazania=null;
  _zadanieSzkic=null;
  save(); closeModal(); render();
}

function usunZadanie(id){
  if(!confirm('Usunąć to zadanie z grafiku?')) return;
  const z=zadanieById(id);
  if(z && z.workerId) createNotification(z.workerId,'anulowane','Zadanie odwołane',
    opisZadaniaKrotko(z), {zadanieId:null});
  // Zgłoszenie, z którego to zadanie powstało, wraca do kolejki — praca dalej czeka.
  (state.tasks||[]).forEach(t=>{ if(t.zadanieId===id){ t.zadanieId=null; t.status='NEW'; } });
  state.schedule=state.schedule.filter(x=>x.id!==id);
  save(); closeModal(); render();
}

/* ═══ POWIADOMIENIA O ZADANIACH ════════════════════════════════════════════════
   Pracownik ma wiedzieć o rzeczach, które zmieniają JEGO dzień: nowa praca, przesunięcie,
   inne pole, inna maszyna, odwołanie. Zmiana uwagi czy literówki w opisie nie budzi nikogo. */
function opisZadaniaKrotko(z){
  const M=miejscePracy(z), p=z.poleId?poleById(z.poleId):null;
  const c=z.ciagnikId?maszynaById(z.ciagnikId):null;
  return [M.ikona+' '+(z.zadanie||M.krotko), p?p.nazwa:(z.klient||''),
    dataKrotko(z.date)+(z.od?' '+z.od+(z.do?'–'+z.do:''):''), c?c.nazwa:'']
    .filter(Boolean).join(' · ');
}
function powiadomONowym(z){
  if(!z.workerId) return;
  createNotification(z.workerId,'nowe','Nowe zadanie',opisZadaniaKrotko(z),{zadanieId:z.id});
}
function powiadomOZmianie(z, przed){
  if(!z.workerId) return;
  if(z.status==='anulowane' && przed.status!=='anulowane'){
    createNotification(z.workerId,'anulowane','Zadanie anulowane',opisZadaniaKrotko(z),{zadanieId:z.id});
    return;
  }
  // Przepisanie na innego człowieka to dla nowego nowe zadanie, a nie „zmiana".
  if(przed.workerId && przed.workerId!==z.workerId){
    createNotification(przed.workerId,'anulowane','Zadanie przekazane komu innemu',opisZadaniaKrotko(z),{zadanieId:z.id});
    createNotification(z.workerId,'nowe','Nowe zadanie',opisZadaniaKrotko(z),{zadanieId:z.id});
    return;
  }
  const istotne=['date','od','do','poleId','ciagnikId','maszynaId','rodzaj'];
  if(!istotne.some(k=>przed[k]!==z[k])) return;    // zmiana bez znaczenia dla pracownika
  createNotification(z.workerId,'zmiana','Zmieniono zadanie',opisZadaniaKrotko(z),{zadanieId:z.id});
}

/* Podgląd pełnych informacji — na karcie świadomie pokazujemy tylko cztery linijki. */
function pokazZadanie(id){
  const z=zadanieById(id); if(!z) return;

  const kolM=(c&&konfliktMaszyny(c.id,z.date,z.od,z.do,z.id))||(m&&konfliktMaszyny(m.id,z.date,z.od,z.do,z.id));
  const kolP=konfliktPracownika(z.workerId,z.date,z.od,z.do,z.id);
  const M=miejscePracy(z);
  openModal(`
    <div class="modal-head"><h3>${esc(z.zadanie||'Zadanie')}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      ${kolP?`<div class="warn-box" style="margin-bottom:12px">⚠ ${esc((workerById(z.workerId)||{}).imie||'Pracownik')} ma w tym czasie także: ${esc(kolP.zadanie||'inne zadanie')} ${esc(kolP.od||'')}${kolP.do?'–'+esc(kolP.do):''}</div>`:''}
      ${kolM?`<div class="warn-box" style="margin-bottom:12px">⚠ Ta maszyna jest w tym czasie przypisana także do innego zadania.</div>`:''}
      ${wiersz('Miejsce', M.ikona+' '+M.label)}
      ${wiersz('Pracownik', w?esc(w.imie):'—')}
      ${wiersz('Kiedy', esc(new Date(z.date+'T00:00:00').toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'}))
        +(z.od?' · '+esc(z.od)+(z.do?'–'+esc(z.do):''):''))}
      ${wiersz('Ciągnik', c?esc(c.nazwa)+(c.nr_rej?' · '+esc(c.nr_rej):''):'')}
      ${wiersz('Maszyna', m?esc(m.nazwa)+(m.typ?' · '+esc(m.typ):''):'')}
      ${wiersz('Pole', p?esc(p.nazwa)+(o.ha?' · '+o.ha:'')+(o.uprawa?' · '+esc(o.uprawa):''):'')}
      ${wiersz('Rodzaj', rodzajPracy(z).label)}
      ${wiersz('Opis', esc(z.opis||''))}
      ${wiersz('Klient', esc(z.klient||''))}
      ${wiersz('Priorytet', z.priorytet&&z.priorytet!=='normalny'?PRIORYTETY[z.priorytet]:'')}
      ${wiersz('Status', (STATUSY_ZADAN[z.status||'zaplanowane']||{}).label)}
      ${wiersz('Uwagi', esc(z.uwagi||''))}
      ${z.wykonanie?`<div class="wyk-blok">
        <div class="wyk-tyt">Wykonanie</div>
        ${wiersz('Zrobiono', z.wykonanie.ha?esc(z.wykonanie.ha)+' ha':'')}
        ${wiersz('Godziny', z.wykonanie.godziny?esc(z.wykonanie.godziny)+' h':'')}
        ${wiersz('Motogodziny', esc(z.wykonanie.mth||''))}
        ${wiersz('Paliwo', z.wykonanie.paliwo?esc(z.wykonanie.paliwo)+' l':'')}
        ${wiersz('Środek', z.wykonanie.srodek?esc(z.wykonanie.srodek)+(z.wykonanie.dawka?' · '+esc(z.wykonanie.dawka)+' '+esc(z.wykonanie.jednostka||''):''):'')}
        ${wiersz('Powód', esc(z.wykonanie.powod||''))}
        ${wiersz('Uwagi', esc(z.wykonanie.uwagi||''))}
      </div>`:''}
    </div>
    <div class="modal-foot" style="flex-wrap:wrap">
      <button class="btn danger" onclick="usunZadanie('${z.id}')">Usuń</button>
      <div class="spacer"></div>

        :`<button class="btn" onclick="closeModal();openWykonanieForm('${z.id}')">Popraw wykonanie</button>`}

}

/* ═══ WIDOK PRACOWNIKA ═════════════════════════════════════════════════════════
   Osobny ekran dla konta pracownika: wyłącznie JEGO zaplanowane prace, duże i czytelne,
   na całą szerokość strony. Bez sidebara, bez modułów, bez panelu administracyjnego.

   🔑 Tylko do odczytu — konto pracownika nie ma prawa zapisu do gospodarstwa (patrz
   `schema_pracownicy.sql`). Zapis oznaczałby nadpisanie CAŁEGO dokumentu właściciela.
   ⚠️ Dopasowanie po `worker_id` z powiązania. Gdy go brak (albo pracownika usunięto
   z listy), mówimy o tym wprost zamiast pokazywać pusty ekran, który wygląda jak awaria. */
function renderWidokPracownika(){
  const wid=trybPracownika.workerId;
  const w = wid ? workerById(wid) : null;
  const dzis=new Date(), dzisISO=fmtISO(dzis);

  const naglowek=`<div class="pr-top">
      <div class="pr-brand"><span class="mark">M</span>M-FarmX</div>
      <div class="pr-kto">${esc(w?w.imie:(trybPracownika.imie||'Pracownik'))}</div>
      <button class="pr-ikona" onclick="openZgloszenieForm()" title="Zgłoś coś do zrobienia">+ Zgłoś</button>
      <button class="pr-ikona" onclick="pokazPowiadomienia()" title="Powiadomienia">🔔${
        nieprzeczytane(trybPracownika.workerId).length?`<span class="pr-badge">${nieprzeczytane(trybPracownika.workerId).length}</span>`:''}</button>
      <button class="pr-wyloguj" onclick="logout()" title="Wyloguj">Wyloguj</button>
    </div>`;

  if(!w){
    document.getElementById('app').innerHTML=naglowek+`<div class="pr-body">
      <div class="pr-brak"><b>Konto nie jest jeszcze powiązane z pracownikiem</b>
      <div>Poproś gospodarza, żeby przypisał to konto do Twojego nazwiska w grafiku.</div></div></div>`;
    return;
  }

  const moje=state.schedule.filter(z=>z.workerId===w.id && z.status!=='anulowane');
  const dzisiaj=moje.filter(z=>z.date===dzisISO).sort((a,b)=>(a.od||'').localeCompare(b.od||''));
  const przyszle=moje.filter(z=>z.date>dzisISO).sort((a,b)=>(a.date+a.od).localeCompare(b.date+b.od)).slice(0,20);

  const duzaKarta=(z,gl)=>{
    const r=rodzajPracy(z), st=STATUSY_ZADAN[z.status||'zaplanowane'];
    const c=z.ciagnikId?maszynaById(z.ciagnikId):null, m=z.maszynaId?maszynaById(z.maszynaId):null;
    const p=z.poleId?poleById(z.poleId):null, o=p?opisPola(p):null;
    const dt=new Date(z.date+'T00:00:00');
    return `<article class="pr-karta${gl?' glowna':''}" style="border-left-color:${r.kolor}">
      <div class="pr-k-gora">
        <div class="pr-k-czas">${z.od?esc(z.od):''}${z.do?'–'+esc(z.do):''}</div>
        <div class="pr-k-stan" style="color:${st.kolor}">● ${st.label}</div>
      </div>
      <h2 class="pr-k-tytul">${esc(z.zadanie||r.label)}</h2>
      ${!gl?`<div class="pr-k-data">${esc(dt.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'}))}</div>`:''}
      <div class="pr-k-linie">
        ${p?`<div class="pr-k-linia"><span>📍</span><b>${esc(p.nazwa)}</b>${o.ha?`<i>${o.ha}${o.uprawa?' · '+esc(o.uprawa):''}</i>`:''}</div>`:''}
        ${c?`<div class="pr-k-linia"><span>🚜</span><b>${esc(c.nazwa)}</b></div>`:''}
        ${m?`<div class="pr-k-linia"><span>🔧</span><b>${esc(m.nazwa)}</b></div>`:''}
        ${z.uwagi?`<div class="pr-k-linia"><span>📝</span><b>${esc(z.uwagi)}</b></div>`:''}
      </div></article>`;
  };

  const dataDzis=dzis.toLocaleDateString('pl-PL',{weekday:'long',day:'numeric',month:'long'});
  document.getElementById('app').innerHTML=naglowek+`<div class="pr-body">
    <div class="pr-dzien">DZIŚ · ${esc(dataDzis.charAt(0).toUpperCase()+dataDzis.slice(1))}</div>
    ${dzisiaj.length ? `<div class="pr-lista glowne">${dzisiaj.map(z=>duzaKarta(z,true)).join('')}</div>`
      : `<div class="pr-brak"><b>Na dziś nie masz zaplanowanych prac</b>
         <div>Gdy gospodarz coś zaplanuje, pojawi się tutaj.</div></div>`}
    ${przyszle.length?`<div class="pr-dzien nast">NAJBLIŻSZE DNI</div>
      <div class="pr-lista">${przyszle.map(z=>duzaKarta(z,false)).join('')}</div>`:''}
    ${mojeZgloszeniaHtml(w)}
    <div class="pr-stopka">Widok pracownika · zadania tylko do odczytu, zgłoszenia możesz wysyłać</div>
  </div>`;
}

/* Zgłoszenia tej osoby wraz ze statusem. Wpisy przeniesione już przez gospodarza do listy
   „Do zrobienia" siedzą w `state.tasks` (pracownik czyta dokument gospodarstwa), więc widać
   je razem z tym, co się z nimi stało. Świeżo wysłane, jeszcze niepobrane, dociągamy z tabeli. */
function mojeZgloszeniaHtml(w){
  const moje=(state.tasks||[]).filter(t=>t.zglosilWorkerId===w.id);
  if(!moje.length && !(_swiezeZgloszenia||[]).length) return '';
  const swieze=(_swiezeZgloszenia||[]).map(r=>
    `<div class="zg-mini"><span class="zg-st" style="color:${STATUSY_ZGLOSZEN.NEW.kolor}">○</span>
      <span class="op-t"><b>${ikonaKategorii(r.kategoria)} ${esc(r.nazwa)}</b>
        <span class="op-sub">Wysłane — czeka na gospodarza</span></span></div>`).join('');
  return `<div class="pr-dzien nast">MOJE ZGŁOSZENIA</div>
    <div class="pr-zgl">${swieze}${moje.map(kartaZgloszeniaMini).join('')}</div>`;
}
let _swiezeZgloszenia=[];
/* Dociągnięcie własnych, jeszcze nieprzeniesionych zgłoszeń — RLS oddaje wyłącznie te,
   których autorem jest zalogowany pracownik. */
async function odswiezMojeZgloszenia(){
  if(!trybPracownika || !sb) return;
  try{
    const { data } = await sb.from('zgloszenia').select('*').eq('przeniesione',false);
    _swiezeZgloszenia=data||[];
    render();
  }catch(e){ /* brak tabeli → po prostu nic nie pokazujemy */ }
}

/* ═══ HISTORIA PRAC — jedno źródło, trzy widoki ════════════════════════════════
   Pole, maszyna i pracownik NIE mają własnych dzienników. Wszystkie trzy czytają
   `state.schedule`, czyli ten sam grafik, w którym praca została zaplanowana i odhaczona.
   Dzięki temu nie da się mieć „historii pola" mówiącej co innego niż grafik. */
function historiaPrac(filtr, opcje){
  const o=Object.assign({pokazPole:true, pokazPracownika:true, limit:40}, opcje||{});
  const lista=state.schedule.filter(filtr).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(!lista.length) return `<div class="hist-pusto">Brak zapisanych prac.</div>`;

  const wiersze=lista.slice(0,o.limit).map(z=>{
    const r=rodzajPracy(z), w=workerById(z.workerId), p=z.poleId?poleById(z.poleId):null;
    const c=z.ciagnikId?maszynaById(z.ciagnikId):null, m=z.maszynaId?maszynaById(z.maszynaId):null;
    const st=STATUSY_ZADAN[z.status||'zaplanowane']||STATUSY_ZADAN.zaplanowane;
    const wyk=z.wykonanie||{};
    const szczegoly=[
      o.pokazPracownika&&w?esc(w.imie):'', o.pokazPole&&p?'📍 '+esc(p.nazwa):'',
      c?'🚜 '+esc(c.nazwa):'', m?'🔧 '+esc(m.nazwa):'',
      wyk.srodek?esc(wyk.srodek)+(wyk.dawka?' '+esc(wyk.dawka)+' '+esc(wyk.jednostka||''):''):'',
      wyk.ha?esc(wyk.ha)+' ha':'', wyk.godziny?esc(wyk.godziny)+' h':'',
      z.opis?esc(z.opis):'', z.klient?'👤 '+esc(z.klient):'',
    ].filter(Boolean).join(' · ');
    const dt=new Date(z.date+'T00:00:00');
    return `<div class="hist-w" onclick="pokazZadanie('${z.id}')" title="Kliknij, aby zobaczyć całość">
      <div class="hist-data">${String(dt.getDate()).padStart(2,'0')}.${String(dt.getMonth()+1).padStart(2,'0')}</div>
      <div class="hist-pasek" style="background:${r.kolor}"></div>
      <div class="hist-tresc">
        <div class="hist-tyt">${esc(z.zadanie||r.label)}
          <span class="hist-stan" style="color:${st.kolor}">● ${st.label}</span></div>
        ${szczegoly?`<div class="hist-meta">${szczegoly}</div>`:''}
      </div></div>`;
  }).join('');
  const wiecej = lista.length>o.limit ? `<div class="hist-pusto">…i jeszcze ${lista.length-o.limit}</div>` : '';
  return `<div class="hist-lista">${wiersze}${wiecej}</div>`;
}

/* Karta pracownika: grafik, wykonane prace, godziny, maszyny i pola, na których pracował.
   Wszystko wyliczone z grafiku — pracownik nie ma osobnego dziennika do wypełniania. */
function pokazPracownika(id){
  const w=workerById(id); if(!w) return;
  const jego=state.schedule.filter(z=>z.workerId===id);
  const wykonane=jego.filter(z=>z.status==='wykonane');
  const maszyny=[...new Set(jego.flatMap(z=>[z.ciagnikId,z.maszynaId]).filter(Boolean))]
    .map(maszynaById).filter(Boolean).map(m=>m.nazwa);
  const pola=[...new Set(jego.map(z=>z.poleId).filter(Boolean))]
    .map(poleById).filter(Boolean).map(f=>f.nazwa);
  const wiersz=(et,tr)=>tr?`<div class="zd-row"><span>${et}</span><b>${tr}</b></div>`:'';
  openModal(`
    <div class="modal-head"><h3>${esc(w.imie)}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      ${wiersz('Rola', esc(w.rola||''))}
      ${wiersz('Telefon', esc(w.telefon||''))}
      ${wiersz('Zadań w grafiku', jego.length+' · wykonanych '+wykonane.length)}
      ${wiersz('Maszyny', maszyny.length?esc(maszyny.join(', ')):'')}
      ${wiersz('Pola', pola.length?esc(pola.join(', ')):'')}
      ${podsumowanieGodzin(jego)}
      <div class="sb-title" style="margin-top:16px">Historia prac</div>
      ${historiaPrac(z=>z.workerId===id, {pokazPracownika:false})}
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Zamknij</button>
      <div class="spacer"></div>
      <button class="btn primary" onclick="closeModal();openWorkerForm('${id}')">Edytuj dane</button></div>`);
}

/* Podsumowanie godzin per rodzaj pracy — to samo liczenie dla pracownika i dla maszyny. */
function podsumowanieGodzin(lista){
  const wg={}; let razem=0;
  lista.filter(z=>z.status==='wykonane').forEach(z=>{
    const h=liczba((z.wykonanie&&z.wykonanie.godziny)||godzinyZadania(z));
    if(!h) return;
    const k=rodzajPracy(z).label; wg[k]=(wg[k]||0)+h; razem+=h;
  });
  if(!razem) return '';
  const wiersze=Object.entries(wg).sort((a,b)=>b[1]-a[1])
    .map(([k,v])=>`<div class="cost-line"><span>${k}</span><b>${v.toFixed(1).replace('.',',')} h</b></div>`).join('');
  return `<div class="godz-blok"><div class="cost-line" style="font-weight:700;border-bottom:2px solid var(--line)">
      <span>Godziny wykonane</span><b>${razem.toFixed(1).replace('.',',')} h</b></div>${wiersze}</div>`;
}

/* ═══ WYKONANIE ZADANIA — jedno kliknięcie zasila resztę systemu ═══════════════
   To jest sedno: kierownik planuje, pracownik potwierdza, a dane rozchodzą się same.
   Zamiast przepisywać oprysk ręcznie do ewidencji, robi to `zapiszWykonanie()`.

   Co się dzieje po zatwierdzeniu:
     1. zadanie dostaje status „wykonane" i zapamiętuje, co faktycznie zrobiono,
     2. motogodziny z licznika trafiają do karty maszyny (jeśli podano),
     3. przy oprysku / nawożeniu / siewie powstaje WPIS W EWIDENCJI ZABIEGÓW pola —
        w tej samej strukturze `sezony[].zabiegi`, której moduł Pola używa od zawsze.
   ⚠️ Świadomie NIE tworzymy osobnego rejestru zabiegów — istniejący jest już w Polach
   i pokazuje go karta pola. Drugi byłby dokładnie tym dublowaniem, którego unikamy.
   ⏳ Zdjęcie ze stanu magazynu i koszt na pole dochodzą w Etapie 3 i 5. */
function openWykonanieForm(id){
  const z=zadanieById(id); if(!z) return;
  const r=rodzajPracy(z), p=z.poleId?poleById(z.poleId):null;
  const maszyna=z.ciagnikId?maszynaById(z.ciagnikId):(z.maszynaId?maszynaById(z.maszynaId):null);
  const haPola=p?(parseFloat(p.powierzchnia_ha)||0):0;
  const wyk=z.wykonanie||{};
  openModal(`
    <div class="modal-head"><h3>Potwierdź wykonanie</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="zd-row"><span>Zadanie</span><b>${esc(z.zadanie||'—')} · ${r.label}</b></div>
      ${p?`<div class="zd-row"><span>Pole</span><b>${esc(p.nazwa)}${haPola?' · '+haPola.toFixed(2).replace('.',',')+' ha':''}</b></div>`:''}
      <div class="field row2" style="margin-top:12px">
        <div><label>Wykonano (ha)</label><input id="wy_ha" inputmode="decimal" value="${esc(wyk.ha??(haPola||''))}"></div>
        <div><label>Motogodziny${maszyna?' — '+esc(maszyna.nazwa):''}</label>
          <input id="wy_mth" inputmode="decimal" value="${esc(wyk.mth??'')}" placeholder="${maszyna&&maszyna.mth?'obecnie '+esc(maszyna.mth):'stan licznika'}"></div>
      </div>
      ${r.zabieg?`
        <div class="field row2">
          <div><label>${z.rodzaj==='nawozenie'?'Nawóz':z.rodzaj==='siew'?'Materiał siewny':'Środek ochrony'}</label>
            <input id="wy_srodek" value="${esc(wyk.srodek??'')}" placeholder="np. Saletra"></div>
          <div><label>Dawka / ha</label>
            <div style="display:flex;gap:6px"><input id="wy_dawka" inputmode="decimal" value="${esc(wyk.dawka??'')}" placeholder="np. 200">
              <select id="wy_jedn" style="max-width:92px" onchange="przeliczRazem()">${['kg/ha','l/ha','g/ha','szt/ha','t/ha']
                .map(j=>`<option ${j===(wyk.jednostka|| (z.rodzaj==='oprysk'?'l/ha':'kg/ha'))?'selected':''}>${j}</option>`).join('')}</select></div></div>
        </div>
        <div class="hint" id="wy_razem" style="margin:-4px 0 10px">—</div>
        <div class="field"><label>Powód zastosowania (opcjonalnie)</label>
          <input id="wy_powod" value="${esc(wyk.powod??'')}" placeholder="np. chwasty dwuliścienne"></div>`:''}
      <div class="field row2">
        <div><label>Paliwo (l)</label><input id="wy_paliwo" inputmode="decimal" value="${esc(wyk.paliwo??'')}"></div>
        <div><label>Godziny pracy</label><input id="wy_godz" inputmode="decimal" value="${esc(wyk.godziny??godzinyZadania(z))}"></div>
      </div>
      <div class="field"><label>Uwagi z wykonania</label><input id="wy_uwagi" value="${esc(wyk.uwagi??'')}"></div>
      <div id="wy_err" class="auth-err"></div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Anuluj</button>
      <button class="btn primary" onclick="zapiszWykonanie('${z.id}')">Zapisz jako wykonane</button></div>`);
  przeliczRazem();
  ['wy_ha','wy_dawka'].forEach(i=>document.getElementById(i)?.addEventListener('input',przeliczRazem));
}

/* Ile godzin trwa zadanie wg zaplanowanych godzin — podpowiedź, nie wyrocznia. */
function godzinyZadania(z){
  const a=naMinuty(z.od), b=naMinuty(z.do);
  return (a!=null&&b!=null&&b>a) ? ((b-a)/60).toFixed(1).replace('.',',') : '';
}
const liczba = v => parseFloat(String(v??'').replace(',','.'))||0;

/* Całkowite zużycie liczymy NA ŻYWO — to jest ta arytmetyka, której nikt nie chce robić w głowie
   (18,72 ha × 200 kg/ha = 3 744 kg) i która w Etapie 3 zejdzie ze stanu magazynu. */
function przeliczRazem(){
  const el=document.getElementById('wy_razem'); if(!el) return;
  const ha=liczba(val('wy_ha')), d=liczba(val('wy_dawka'));
  const j=(val('wy_jedn')||'kg/ha').split('/')[0];
  el.textContent = (ha&&d) ? `Zużycie łącznie: ${(ha*d).toFixed(1).replace('.',',')} ${j}  (${ha} ha × ${d} ${j}/ha)` : '—';
}

function zapiszWykonanie(id){
  const z=zadanieById(id); if(!z) return;
  const r=rodzajPracy(z);
  const w={
    ha:val('wy_ha').trim(), mth:val('wy_mth').trim(), paliwo:val('wy_paliwo').trim(),
    godziny:val('wy_godz').trim(), uwagi:val('wy_uwagi').trim(), data:fmtISO(new Date()),
  };
  if(r.zabieg){
    w.srodek=val('wy_srodek').trim(); w.dawka=val('wy_dawka').trim();
    w.jednostka=val('wy_jedn'); w.powod=val('wy_powod').trim();
  }
  const skutki=[];

  // 1. Motogodziny → karta maszyny. Licznik idzie tylko w górę; niższy odczyt to pomyłka.
  const masz = z.ciagnikId?maszynaById(z.ciagnikId):(z.maszynaId?maszynaById(z.maszynaId):null);
  if(masz && w.mth){
    const nowe=liczba(w.mth), stare=liczba(masz.mth);
    if(nowe<stare){
      document.getElementById('wy_err').textContent =
        `Licznik ${masz.nazwa} pokazuje ${masz.mth} mth — nowy odczyt nie może być niższy.`;
      return;
    }
    masz.mth=String(nowe); skutki.push(`motogodziny ${masz.nazwa} → ${nowe}`);
  }

  // 2. Oprysk / nawożenie / siew → wpis do ewidencji zabiegów pola (istniejąca struktura).
  if(r.zabieg && z.poleId && w.srodek){
    const f=poleById(z.poleId);
    if(f){
      let s=seasonOf(f,view.year);
      if(!s){ s={rok:view.year,uprawa:'',zabiegi:[]}; f.sezony.push(s); }   // brak sezonu = zakładamy pusty
      (s.zabiegi=s.zabiegi||[]).push({
        data:z.date, rodzaj:z.rodzaj==='nawozenie'?'nawoz':z.rodzaj==='siew'?'zaprawa':'inne',
        srodek:w.srodek, dawka:w.dawka, jednostka:w.jednostka, koszt:0,
        zZadania:z.id,                                   // ślad źródła — po co przepisywać ręcznie
      });
      skutki.push(`wpis w ewidencji zabiegów — ${f.nazwa}`);
    }
  }

  z.status='wykonane'; z.wykonanie=w;
  save(); closeModal(); render();
  if(skutki.length) showToast('Zapisano wykonanie. Zaktualizowano: '+skutki.join(' · '));
}

/* Krótki komunikat u dołu ekranu — alert przerywa pracę, a to ma tylko potwierdzić skutek. */
function showToast(tekst){
  document.getElementById('mfx-toast')?.remove();
  const t=document.createElement('div'); t.id='mfx-toast'; t.textContent=tekst;
  t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:9998;'
    +'background:#3D3D3D;color:#fff;padding:11px 18px;border-radius:8px;font-size:13px;'
    +'box-shadow:0 4px 16px rgba(0,0,0,.28);max-width:90vw;text-align:center';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),4500);
}

function zmienStatus(id,st){
  const z=zadanieById(id); if(!z) return;
  if(st==='wykonane'){ closeModal(); openWykonanieForm(id); return; }  // wykonanie zawsze przez formularz
  z.status=st; save(); closeModal(); render();
}

/* Jedno pole „imię i nazwisko" zamiast dwóch — tak nazwisko jest zapisane w `state.workers`

function openWorkerForm(id){
  const w=id?state.workers.find(x=>x.id===id):null;
  const colorDots=WORKER_COLORS.map(c=>`<button type="button" class="cdot ${w&&w.kolor===c?'sel':''}" style="background:${c}" onclick="pickWorkerColor(this,'${c}')"></button>`).join('');
  const konto=(w&&w.konto)||{};
  const kanaly=(w&&w.powiadomieniaKanaly)||{};
  const stanowisko=w?w.rola||'':'';
  openModal(`
    <div class="modal-head"><h3>${w?'Edytuj pracownika':'Nowy pracownik'}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field"><label>Imię i nazwisko</label>
        <input id="w_imie" value="${w?esc(w.imie||''):''}" placeholder="np. Jan Kowalski" autofocus></div>
      <div class="field row2">

          <input id="w_rola" list="lista_stanowisk" value="${esc(stanowisko)}" placeholder="np. Operator">

        <div><label>Telefon</label><input id="w_tel" value="${w?esc(w.telefon||''):''}" placeholder="opcjonalnie"></div>
      </div>
      <div class="field"><label>E-mail</label>
        <input id="w_email" type="email" value="${esc(konto.email||'')}" placeholder="jan@email.pl">
        <div class="hint">Potrzebny tylko wtedy, gdy pracownik ma się logować do aplikacji.</div></div>
      <div class="field"><label>Typ konta</label><select id="w_typ">${Object.entries(TYPY_KONT)
        .map(([k,v])=>`<option value="${k}" ${k===((w&&w.typKonta)||'EMPLOYEE')?'selected':''}>${v.label}</option>`).join('')}</select>
        <div class="hint">Administrator ma wszystkie uprawnienia. Zwykły pracownik dostaje je pojedynczo, na swojej karcie.</div></div>
      <div class="field"><label>Powiadomienia</label>
        <label class="upr-w"><input type="checkbox" id="w_pow_mail" ${kanaly.email?'checked':''}> <span>E-mail</span></label>
        <label class="upr-w"><input type="checkbox" id="w_pow_wa" ${kanaly.whatsapp?'checked':''}> <span>WhatsApp</span></label>
        <div class="hint">Powiadomienia w aplikacji działają zawsze. E-mail i WhatsApp wymagają konfiguracji po stronie serwera — na razie zapisujemy samą zgodę.</div></div>
      <div class="field"><label>Kolor w grafiku</label><div class="cdots" id="w_kolory">${colorDots}</div>
        <input type="hidden" id="w_kolor" value="${w?w.kolor||WORKER_COLORS[0]:WORKER_COLORS[0]}"></div>
      <div id="w_err" class="auth-err"></div>
    </div>
    <div class="modal-foot">
      ${w?`<button class="btn danger" onclick="delWorker('${w.id}')" style="margin-right:auto">Usuń</button>`:''}
      <button class="btn" onclick="closeModal()">Anuluj</button>
      <button class="btn primary" onclick="saveWorker('${w?w.id:''}')">${w?'Zapisz':'Dodaj pracownika'}</button>

function pickWorkerColor(el,c){ document.querySelectorAll('#w_kolory .cdot').forEach(x=>x.classList.remove('sel')); el.classList.add('sel'); document.getElementById('w_kolor').value=c; }

function saveWorker(id){
  const imie=val('w_imie').trim();
  const err=document.getElementById('w_err');
  if(!imie){ err.textContent='Podaj imię i nazwisko.'; return; }
  const email=val('w_email').trim();
  if(email && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){ err.textContent='Adres e-mail wygląda na niepełny.'; return; }
  const dane={imie, rola:val('w_rola').trim(), telefon:val('w_tel').trim(),
    kolor:val('w_kolor')||WORKER_COLORS[0], typKonta:val('w_typ'),
    powiadomieniaKanaly:{email:!!document.getElementById('w_pow_mail').checked,
                         whatsapp:!!document.getElementById('w_pow_wa').checked}};
  if(id){
    const w=state.workers.find(x=>x.id===id);
    w.konto=Object.assign({}, w.konto||{}, {email});
    Object.assign(w,dane);
  } else {
    /* Dodany pracownik jest od razu AKTYWNY, czyli od razu widoczny w Grafiku. Nie ma
       drugiego kroku „dodaj do grafiku" — grafik czyta tę samą listę ludzi. */
    dane.kolor=dane.kolor||WORKER_COLORS[state.workers.length%WORKER_COLORS.length];
    state.workers.push({id:uid(), aktywny:true, konto:{email},
      uprawnienia:Object.assign({},UPRAWNIENIA_DOMYSLNE), ...dane});
  }
  save(); closeModal(); render();
}

/* Założenie konta w Supabase wymaga klucza service_role, którego NIGDY nie wolno wpuścić
   do przeglądarki. Robi to funkcja serwerowa `admin-uzytkownicy`, która sama sprawdza,
   czy woła ją administrator — przeglądarce w tej sprawie nie wolno wierzyć. */
async function zaproszenieDlaPracownika(id){
  const w=workerById(id); if(!w) return;
  const email=(w.konto||{}).email;
  if(!email){ alert('Najpierw uzupełnij adres e-mail pracownika (Edytuj dane).'); return; }
  const haslo=prompt('Hasło startowe dla '+w.imie+' ('+email+'):\n\nPracownik powinien je zmienić po pierwszym logowaniu.');
  if(!haslo) return;
  if(haslo.length<8){ alert('Hasło musi mieć co najmniej 8 znaków.'); return; }
  try{
    const { data, error } = await sb.functions.invoke('admin-uzytkownicy',
      {body:{akcja:'dodaj-pracownika', email, haslo, imie:w.imie, workerId:w.id}});
    if(error) throw error;
    if(data && data.blad) throw new Error(data.blad);
    w.konto=Object.assign({}, w.konto, {userId:(data&&data.userId)||'', utworzono:new Date().toISOString()});
    save(); render();
    alert('Konto założone. '+w.imie+' loguje się adresem '+email+'.');
  }catch(e){
    alert('Nie udało się założyć konta: '+(e.message||e)
      +'\n\nSprawdź, czy funkcja „admin-uzytkownicy" jest wdrożona w Supabase.');
  }
}

function delWorker(id){ if(!confirm('Usunąć pracownika i jego wpisy w grafiku?'))return;
  state.workers=state.workers.filter(x=>x.id!==id); state.schedule=state.schedule.filter(s=>s.workerId!==id); save(); closeModal(); render(); }

   `zajecie` bez rodzaju pracy i bez miejsca, więc takie wpisy nie trafiały ani do Floty, ani

const modalEl=()=>document.getElementById('modal');

function cropSelect(id,val){
  const opts=CROP_OPTIONS.map(c=>`<option ${c===val?'selected':''}>${c}</option>`).join('');

  return `<select id="${id}"><option value="">— wybierz —</option>${custom}${opts}<option value="__inne">➕ inna (wpisz)…</option></select>`;
}

/* --- Pole --- */

    <div class="modal-body">
      ${pendingGeo?`<div class="geo-note">◈ Obrys narysowany na mapie — powierzchnię policzono automatycznie. Nadaj polu nazwę.</div>`:''}
      ${(f&&f.geo&&f.geo.polygon)?`<div class="geo-note">◈ To pole ma obrys na mapie. Kształt zmienisz na zakładce Mapa.</div>`:''}
      <div class="field"><label>Nazwa pola</label><input id="f_nazwa" value="${f?esc(f.nazwa):''}" placeholder="np. Za stodołą" autofocus></div>
      <div class="field"><label>Powierzchnia (ha)</label><input id="f_ha" type="text" inputmode="decimal" value="${areaVal}" placeholder="np. 12,4">

      <div class="field"><label>Lokalizacja / gleba (opcjonalnie)</label><input id="f_lok" value="${f?esc(f.lokalizacja||''):''}" placeholder="np. przy lesie, gleba IV kl."></div>
      <div class="field"><label>Komentarz (opcjonalnie)</label><textarea id="f_kom" placeholder="uwagi o działce…">${f?esc(f.komentarz||''):''}</textarea></div>
    </div>
    <div class="modal-foot">
      ${f?`<button class="btn danger" onclick="delField('${f.id}')" style="margin-right:auto">Usuń pole</button>`:''}
      <button class="btn" onclick="closeModal()">Anuluj</button>
      <button class="btn primary" onclick="saveField('${f?f.id:''}')">${f?'Zapisz':'Dodaj pole'}</button>
    </div>`);
}
function saveField(id){
  const nazwa=val('f_nazwa').trim();
  if(!nazwa){ alert('Podaj nazwę pola.'); return; }
  const ha=num(val('f_ha'));
  const lok=val('f_lok').trim();
  const kom=val('f_kom').trim();
  if(id){
    const f=state.fields.find(x=>x.id===id);
    f.nazwa=nazwa; f.powierzchnia_ha=ha; f.lokalizacja=lok; f.komentarz=kom;
  }else{
    const nf={id:uid(),nazwa,powierzchnia_ha:ha,lokalizacja:lok,komentarz:kom,sezony:[]};
    if(pendingGeo) nf.geo=pendingGeo;
    state.fields.push(nf);
  }
  pendingGeo=null; save(); closeModal(); render();
}
function delField(id){
  if(!confirm('Usunąć to pole wraz z całą historią sezonów? Tej operacji nie można cofnąć.')) return;
  state.fields=state.fields.filter(x=>x.id!==id);
  save(); closeModal(); view.name='pola'; render();
}

    <div class="modal-body">
      <div class="field row2">
        <div><label>Rok zbioru</label><input id="s_rok" type="number" value="${yr}" ${s?'readonly':''}></div>
        <div><label>Uprawa</label>${cropSelect('s_uprawa', s?s.uprawa:'')}</div>
      </div>
      <div class="field" id="s_inne_wrap" style="display:none"><label>Nazwa uprawy (własna)</label><input id="s_inne" placeholder="wpisz uprawę"></div>
      <div class="field row2">
        <div><label>Odmiana</label><input id="s_odm" value="${s?esc(s.odmiana||''):''}" placeholder="np. RGT Ritter"></div>
        <div><label>Data siewu</label><input id="s_siew" type="date" value="${s?s.data_siewu||'':''}"></div>
      </div>
      <div class="field"><label>Norma wysiewu</label><input id="s_norma" value="${s?esc(s.norma_wysiewu||''):''}" placeholder="np. 185 kg/ha"></div>
      <div class="field"><label>Notatki</label><textarea id="s_notatki" placeholder="obserwacje, pogoda, uwagi…">${s?esc(s.notatki||''):''}</textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn" onclick="closeModal()">Anuluj</button>
      <button class="btn primary" onclick="saveSeason('${fid}',${s?s.rok:'null'})">${s?'Zapisz':'Dodaj sezon'}</button>
    </div>`);
  const sel=document.getElementById('s_uprawa');
  sel.addEventListener('change',()=>{ document.getElementById('s_inne_wrap').style.display=sel.value==='__inne'?'block':'none'; });
}
function saveSeason(fid,rok){
  const f=state.fields.find(x=>x.id===fid);
  const newRok=parseInt(val('s_rok'),10);
  if(!newRok){ alert('Podaj rok.'); return; }
  let uprawa=val('s_uprawa'); if(uprawa==='__inne') uprawa=val('s_inne').trim();
  const data={uprawa,odmiana:val('s_odm').trim(),data_siewu:val('s_siew'),norma_wysiewu:val('s_norma').trim(),notatki:val('s_notatki').trim()};
  if(rok!==null&&rok!==undefined){
    Object.assign(seasonOf(f,rok),data);
  }else{
    if(seasonOf(f,newRok)){ alert('Sezon '+newRok+' już istnieje na tym polu. Edytuj istniejący.'); return; }
    f.sezony.push({rok:newRok,...data,zabiegi:[],plon_t:'',plon_t_ha:'',wilgotnosc:'',data_zbioru:''});
  }
  save(); closeModal(); render();
  setTimeout(()=>document.getElementById('s-'+fid+'-'+newRok)?.classList.add('open'),0);
}
function delSeason(fid,rok){
  if(!confirm('Usunąć sezon '+rok+'?')) return;
  const f=state.fields.find(x=>x.id===fid);
  f.sezony=f.sezony.filter(s=>s.rok!==rok);
  save(); render();
}

/* --- Zabieg --- */
function openZabiegForm(fid,rok){
  const kinds=Object.keys(ZABIEG_KINDS).map(k=>`<option value="${k}">${ZABIEG_LABEL[k]}</option>`).join('');
  openModal(`
    <div class="modal-head"><h3>Nowy zabieg</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field row2">
        <div><label>Rodzaj</label><select id="z_rodzaj">${kinds}</select></div>
        <div><label>Data</label><input id="z_data" type="date"></div>
      </div>
      <div class="field"><label>Środek / nawóz</label><input id="z_srodek" placeholder="np. Input 460 EC" autofocus></div>
      <div class="field row2">
        <div><label>Dawka</label><input id="z_dawka" inputmode="decimal" placeholder="np. 1,0"></div>
        <div><label>Jednostka</label><select id="z_jedn"><option>l/ha</option><option>kg/ha</option><option>g/ha</option><option>szt/ha</option><option>t/ha</option></select></div>
      </div>
      <div class="field"><label>Koszt zabiegu (zł, opcjonalnie)</label><input id="z_koszt" inputmode="decimal" placeholder="np. 320">
        <div class="hint">Łączny koszt tego zabiegu na całe pole — policzy się zużycie i koszt na hektar.</div></div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Anuluj</button>
      <button class="btn primary" onclick="saveZabieg('${fid}',${rok})">Dodaj zabieg</button></div>`);
}
function saveZabieg(fid,rok){
  const srodek=val('z_srodek').trim();
  if(!srodek){ alert('Podaj nazwę środka.'); return; }
  const f=state.fields.find(x=>x.id===fid); const s=seasonOf(f,rok);
  (s.zabiegi=s.zabiegi||[]).push({data:val('z_data'),rodzaj:val('z_rodzaj'),srodek,dawka:val('z_dawka').trim(),jednostka:val('z_jedn'),koszt:num(val('z_koszt'))});
  save(); closeModal(); render();
  setTimeout(()=>document.getElementById('s-'+fid+'-'+rok)?.classList.add('open'),0);
}
function delZabieg(fid,rok,idx){
  const f=state.fields.find(x=>x.id===fid); const s=seasonOf(f,rok);
  s.zabiegi.splice(idx,1); save(); render();
  setTimeout(()=>document.getElementById('s-'+fid+'-'+rok)?.classList.add('open'),0);
}

/* --- Plon --- */
function openPlonForm(fid,rok){
  const f=state.fields.find(x=>x.id===fid); const s=seasonOf(f,rok);
  openModal(`
    <div class="modal-head"><h3>Plon — ${esc(s.uprawa||'')} ${rok}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field row2">
        <div><label>Plon łącznie (t)</label><input id="p_t" inputmode="decimal" value="${s.plon_t||''}" placeholder="np. 46,5"></div>
        <div><label>Plon z hektara (t/ha)</label><input id="p_tha" inputmode="decimal" value="${s.plon_t_ha||''}" placeholder="auto z ha"></div>
      </div>
      <div class="hint">Podaj plon łączny — t/ha policzy się z powierzchni pola (${fmt(f.powierzchnia_ha)} ha). Możesz też wpisać t/ha ręcznie.</div>
      <div class="field row2" style="margin-top:15px">
        <div><label>Wilgotność (%)</label><input id="p_wilg" inputmode="decimal" value="${s.wilgotnosc||''}" placeholder="np. 13"></div>
        <div><label>Data zbioru</label><input id="p_data" type="date" value="${s.data_zbioru||''}"></div>
      </div>
    </div>
    <div class="modal-foot"><button class="btn" onclick="closeModal()">Anuluj</button>
      <button class="btn primary" onclick="savePlon('${fid}',${rok})">Zapisz plon</button></div>`);
  const t=document.getElementById('p_t'), tha=document.getElementById('p_tha');
  t.addEventListener('input',()=>{ const ha=parseFloat(f.powierzchnia_ha)||0; const v=num(t.value);
    if(ha>0&&v!=='') tha.value=(parseFloat(v)/ha).toFixed(2).replace('.',','); });
}
function savePlon(fid,rok){
  const f=state.fields.find(x=>x.id===fid); const s=seasonOf(f,rok);
  s.plon_t=num(val('p_t')); s.plon_t_ha=num(val('p_tha')); s.wilgotnosc=num(val('p_wilg')); s.data_zbioru=val('p_data');
  save(); closeModal(); render();
  setTimeout(()=>document.getElementById('s-'+fid+'-'+rok)?.classList.add('open'),0);
}

/* =========================================================
   Nazwa / eksport / import
   ========================================================= */
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a'); const d=new Date().toISOString().slice(0,10);
  a.href=URL.createObjectURL(blob); a.download=`m-farmx-kopia-${d}.json`; a.click(); URL.revokeObjectURL(a.href);
}
function importData(ev){
  const file=ev.target.files[0]; if(!file) return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data.fields||!Array.isArray(data.fields)) throw new Error('zły format');
      if(!confirm('Wczytać dane z pliku? Zastąpią one obecne dane w tej przeglądarce.\n(Jeśli chcesz je zachować — najpierw zrób Kopię.)')) return;
      state=data;
      if(!state.ui) state.ui={}; if(!state.cropColors) state.cropColors={};
      if(!state.machines) state.machines=[]; if(!state.finance) state.finance=[]; if(!state.cattle) state.cattle=[];
      save();
      view={module:'pulpit',name:'sezon',fieldId:null,year:currentSeasonYear(),machineId:null,cattleId:null,finYear:new Date().getFullYear(),finMonth:null};
      render();
    }catch(e){ alert('Nie udało się wczytać pliku — nieprawidłowy format kopii M-FarmX.'); }
    ev.target.value='';
  };
  r.readAsText(file);
}

/* ---------- helpers ---------- */
function val(id){ const el=document.getElementById(id); return el?el.value:''; }
function num(v){ if(v===''||v==null) return ''; return String(v).replace(',','.').replace(/[^\d.]/g,''); }
function fmt(v){ if(v===''||v==null) return '—'; const n=parseFloat(String(v).replace(',','.')); if(isNaN(n)) return esc(v); return n.toLocaleString('pl-PL',{maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

boot();
</script>
