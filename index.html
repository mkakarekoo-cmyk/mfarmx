function initMap(){
  const el=document.getElementById('map');
  if(!el) return;
  if(typeof L==='undefined'){
    el.outerHTML=`<div class="map-off"><div style="font-size:19px;font-family:var(--serif);color:var(--ink)">Mapa wymaga internetu</div>
      <div>Zdjęcia satelitarne pobierają się z sieci. Reszta dziennika (pola, sezony, plony) działa offline.</div></div>`;
    return;
  }
  if(LMAP){ try{LMAP.remove();}catch(e){} LMAP=null; }
  const ui=state.ui||(state.ui={});
  LMAP=L.map(el,{zoomControl:true}).setView(ui.mapCenter||[52.03,19.3], ui.mapZoom||6);
  drawnItems=new L.FeatureGroup().addTo(LMAP);
  wlaczWarstwy(LMAP);
  fieldsWithGeo().forEach((f,i)=>addFieldPolygon(f,i));

  const drawControl=new L.Control.Draw({
    position:'topright',
    edit:{featureGroup:drawnItems, remove:false, edit:{selectedPathOptions:{maintainColor:true}}},
    draw:{polygon:{allowIntersection:false,showArea:true,metric:true,shapeOptions:{color:'#C89B2C',weight:2,fillOpacity:.25}},
          polyline:false,rectangle:false,circle:false,marker:false,circlemarker:false}
  });
  LMAP.addControl(drawControl);
  LMAP.on(L.Draw.Event.CREATED, onDrawCreated);
  LMAP.on(L.Draw.Event.EDITED, onDrawEdited);
  LMAP.on('moveend',()=>{ const c=LMAP.getCenter(); ui.mapCenter=[c.lat,c.lng]; ui.mapZoom=LMAP.getZoom(); save(); });

  // dopasuj widok
  if(mapFocusFieldId){
    const f=state.fields.find(x=>x.id===mapFocusFieldId);
    if(f&&f.geo&&f.geo.polygon) LMAP.fitBounds(L.polygon(f.geo.polygon).getBounds().pad(0.6));
    mapFocusFieldId=null;
  }else if(!ui.mapCenter){
    /* Świeże gospodarstwo nie ma jeszcze zapamiętanego widoku. Jeśli znamy siedzibę,
       zaczynamy od niej — mapa nad środkiem Polski nie mówi nikomu nic. */
    const obrysy=fieldsWithGeo().length;
    if(obrysy && maSiedzibe()){
      try{ LMAP.fitBounds(drawnItems.getBounds().extend([state.farm.lat,state.farm.lng]).pad(0.25)); }catch(e){}
    } else if(obrysy){
      try{ LMAP.fitBounds(drawnItems.getBounds().pad(0.25)); }catch(e){}
    } else if(maSiedzibe()){
      LMAP.setView([state.farm.lat,state.farm.lng], state.farm.zoom||15);
    }
  }
  rysujSiedzibe();
  rysujMaszynyNaMapie();   // znaczniki z aktywnych zadań — patrz blok INTEGRACJA
  if(drawTargetField){ new L.Draw.Polygon(LMAP, drawControl.options.draw.polygon).enable(); }
  setTimeout(()=>{ if(LMAP) LMAP.invalidateSize(); },60);
}

/* Stan operacyjny pola — wyliczany z zadań na dziś, nigdzie nie zapisywany.
   ⚠️ Wypełnienie zostaje kolorem UPRAWY (legenda płodozmianu jest znakiem firmowym apki);
   stan niesie OBWÓDKA. Zamiana tych ról zabiłaby czytelność płodozmianu na mapie. */
function statusPola(f){
  const dzis=fmtISO(new Date());
  const dzisiejsze=state.schedule.filter(z=>z.poleId===f.id && z.date===dzis && z.status!=='anulowane');
  const otwarte=dzisiejsze.filter(z=>z.status!=='wykonane');
  if(otwarte.some(z=>zadanieTrwa(z))) return {kolor:'#F0B13A',opis:'praca w toku'};
  if(otwarte.length) return {kolor:'#5B8A93',opis:'zaplanowane na dziś'};
  if(dzisiejsze.length) return {kolor:'#57B657',opis:'zrobione dzisiaj'};
  return null;
}
/* Siedziba — punkt odniesienia całego gospodarstwa. Grafitowy, ze złotą obwódką, żeby
   nie mylił się ze znacznikiem maszyny (biały krążek) ani z obrysem pola. */
let warstwaSiedziby=null;

/* ═══ PODKŁADY I NAKŁADKI MAPY ═════════════════════════════════════════════════
   Obrys pola na zdjęciu satelitarnym bywa nieczytelny: zielona linia na zielonym polu
   w lipcu znika. Stąd dwie rzeczy — możliwość przełączenia podkładu oraz warstwa
   GRANIC DZIAŁEK EWIDENCYJNYCH z GUGiK, po której można obrysowywać pola dokładnie
   po miedzy zamiast „na oko".

   ⚠️ Warstwa działek pojawia się dopiero od zbliżenia ~15. Serwis GUGiK ma limit skali
   i przy mniejszym powiększeniu oddaje puste kafle — pokazywanie przełącznika, który
   nic nie robi, byłoby mylące, więc informujemy o tym wprost. */
const GUGIK_URL='https://integracja.gugik.gov.pl/cgi-bin/KrajowaIntegracjaEwidencjiGruntow';
const ZOOM_DZIALEK=15;

function podkladSatelita(){
  return L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:19,maxNativeZoom:18,attribution:'Zdjęcia: Esri, Maxar'});
}
function podkladNazwy(){
  return L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:19,maxNativeZoom:18,opacity:.9});
}
function podkladMapa(){
  return L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19,attribution:'© OpenStreetMap'});
}
/* ⚠️ GUGiK rysuje granice kreską grubą na JEDEN PIKSEL, w bladym błękicie — na zdjęciu
   satelitarnym praktycznie nie istnieje, a serwisu nie da się poprosić o inny styl.

   ⚠️ CZEGO NIE ROBIĆ: próbowałem pogrubić linie prosząc o obraz o połowę mniejszy
   i rozciągając go w przeglądarce. To NIE DZIAŁA z tym serwisem — mniejszy obraz na tym
   samym wycinku oznacza dwukrotnie większą skalę, a GUGiK ma limit skali i zwraca wtedy
   PUSTE kafle. Granice znikały całkowicie.

   CO DZIAŁA: pełna rozdzielczość + „rozlanie" linii filtrem drop-shadow. Cztery cienie
   przesunięte o piksel w każdą stronę otaczają każdy niepusty piksel, więc kreska 1 px
   robi się wizualnie 3 px. Do tego mocny kontrast, który wyciąga blady błękit na granat. */
function warstwaDzialek(){
  return L.tileLayer.wms(GUGIK_URL,{
    layers:'dzialki,numery_dzialek', format:'image/png', transparent:true,
    version:'1.1.1', opacity:1, maxZoom:19, minZoom:ZOOM_DZIALEK,
    className:'warstwa-dzialki', attribution:'Działki: GUGiK'});
}

/* Panel warstw — własny, w stylu aplikacji. Wbudowany L.control.layers wygląda jak
   z innego programu i nie da się go opisać po polsku bez walki z jego HTML-em. */
function panelWarstw(mapa, stan){
  const C=L.Control.extend({
    onAdd:function(){
      const d=L.DomUtil.create('div','mapa-warstwy');
      d.innerHTML=`
        <div class="mw-grupa">
          <button class="mw-b${stan.podklad==='satelita'?' akt':''}" data-p="satelita">Satelita</button>
          <button class="mw-b${stan.podklad==='mapa'?' akt':''}" data-p="mapa">Mapa</button>
        </div>
        <label class="mw-chk"><input type="checkbox" ${stan.dzialki?'checked':''} data-dz="1">
          <span>Granice działek</span></label>
        <label class="mw-chk mw-pod${stan.dzialki?'':' ukryte'}"><input type="checkbox" ${stan.mocne?'checked':''} data-mc="1">
          <span>Mocniejszy kontur</span></label>
        <div class="mw-info${mapa.getZoom()>=ZOOM_DZIALEK?' ukryte':''}">Przybliż, aby zobaczyć działki</div>`;
      L.DomEvent.disableClickPropagation(d);
      d.querySelectorAll('.mw-b').forEach(b=>b.onclick=()=>{ stan.podklad=b.dataset.p; stan.zastosuj(); });
      d.querySelector('[data-dz]').onchange=e=>{ stan.dzialki=e.target.checked; stan.zastosuj(); };
      d.querySelector('[data-mc]').onchange=e=>{ stan.mocne=e.target.checked; stan.zastosuj(); };
      stan.panel=d;
      return d;
    }
  });
  return new C({position:'topleft'}).addTo(mapa);
}

/* Wspólna obsługa warstw dla obu map (Pulpit i „Nowe pole"). Stan trafia do
   `state.ui.mapaWarstwy`, więc wybór przeżywa przejście między ekranami. */
function wlaczWarstwy(mapa){
  state.ui.mapaWarstwy=Object.assign({podklad:'satelita', dzialki:false, mocne:false}, state.ui.mapaWarstwy||{});
  const u=state.ui.mapaWarstwy;
  const stan={podklad:u.podklad, dzialki:u.dzialki, mocne:u.mocne, panel:null, warstwy:{}};

  stan.zastosuj=()=>{
    Object.values(stan.warstwy).forEach(w=>{ if(w) try{ mapa.removeLayer(w); }catch(e){} });
    stan.warstwy={};
    if(stan.podklad==='mapa'){ stan.warstwy.b=podkladMapa().addTo(mapa); }
    else { stan.warstwy.b=podkladSatelita().addTo(mapa); stan.warstwy.n=podkladNazwy().addTo(mapa); }
    if(stan.dzialki) stan.warstwy.d=warstwaDzialek().addTo(mapa);
    // Przygaszamy zdjęcie tylko przy włączonych działkach — samo w sobie ma być jasne.
    const kontener=mapa.getContainer();
    kontener.classList.toggle('mapa-z-dzialkami', !!stan.dzialki);
    kontener.classList.toggle('mocne-dzialki', !!(stan.dzialki && stan.mocne));
    // Obrysy pól muszą zostać NAD podkładem — po podmianie kafli trafiłyby pod spód.
    if(typeof drawnItems!=='undefined' && drawnItems && mapa.hasLayer(drawnItems)) drawnItems.bringToFront();
    if(stan.panel){
      stan.panel.querySelectorAll('.mw-b').forEach(b=>b.classList.toggle('akt', b.dataset.p===stan.podklad));
      const c=stan.panel.querySelector('[data-dz]'); if(c) c.checked=stan.dzialki;
      const m=stan.panel.querySelector('[data-mc]'); if(m) m.checked=!!stan.mocne;
      const p=stan.panel.querySelector('.mw-pod'); if(p) p.classList.toggle('ukryte', !stan.dzialki);
    }
    u.podklad=stan.podklad; u.dzialki=stan.dzialki; u.mocne=stan.mocne; save();
  };
  stan.zastosuj();
  panelWarstw(mapa, stan);
  mapa.on('zoomend',()=>{ if(stan.panel){
    const i=stan.panel.querySelector('.mw-info');
    if(i) i.classList.toggle('ukryte', mapa.getZoom()>=ZOOM_DZIALEK);
  }});
  return stan;
}
function rysujSiedzibe(){
  if(!LMAP) return;
  if(warstwaSiedziby){ try{ LMAP.removeLayer(warstwaSiedziby); }catch(e){} warstwaSiedziby=null; }
  if(!maSiedzibe()) return;
  const adres=[state.farm.adres, [state.farm.kod,state.farm.miasto].filter(Boolean).join(' ')]
    .filter(Boolean).join(', ');
  warstwaSiedziby=L.marker([state.farm.lat, state.farm.lng], {
    icon:L.divIcon({className:'hq-marker', iconSize:[38,38], iconAnchor:[19,19],
      html:'<div class="hq-pin" title="Siedziba gospodarstwa">🏠</div>'}),
    zIndexOffset:500
  }).addTo(LMAP);
  warstwaSiedziby.bindPopup('<div class="pf-pop"><div class="pf-tyt">'+esc(state.farm.nazwa||'Gospodarstwo')+'</div>'
    +(adres?'<div class="pf-lin">'+esc(adres)+'</div>':'')
    +'<div class="pf-lin">Siedziba gospodarstwa</div>'
    +'<div class="pf-akcje"><button onclick="LMAP.closePopup();goModule(\'ustawienia\')">Zmień adres</button></div></div>');
}

function addFieldPolygon(f,i){
  const last=latestSeason(f);
  const fill=cropColor(last&&last.uprawa);
  const st=statusPola(f);
  const gr=st?4:2;
  const border=st?st.kolor:POLE_OBWODKA_NEUTRALNA;
  /* ⚠️ Sama kolorowa linia ginie na zdjęciu satelitarnym — zielony obrys na zielonym
     polu w lipcu jest niewidoczny. Pod spodem rysujemy szerszą białą „otoczkę", która
     odcina linię od tła niezależnie od pory roku i uprawy. */
  L.polygon(f.geo.polygon,{color:'#FFFFFF',weight:gr+3.5,opacity:.85,fill:false,
    interactive:false,lineJoin:'round'}).addTo(drawnItems);
  const poly=L.polygon(f.geo.polygon,{color:border,weight:gr,opacity:1,fillColor:fill,fillOpacity:.3});
  poly._fieldId=f.id;
  poly.bindTooltip(`${esc(f.nazwa)} <small>· ${fmt(f.powierzchnia_ha)} ha</small>`,{permanent:true,direction:'center',className:'field-label'});
  poly.on('mouseover',()=>poly.setStyle({weight:gr+2,fillOpacity:.48}));
  poly.on('mouseout',()=>poly.setStyle({weight:gr,fillOpacity:.3}));
  poly.on('click',()=>otworzDymekPola(f,poly));
  poly.addTo(drawnItems);
}
/* Klik w pole otwiera dymek, a nie od razu dziennik: z mapy częściej planuje się pracę,
   niż czyta historię. Do dziennika prowadzi stąd jeden przycisk, więc nic nie ginie. */
function otworzDymekPola(f,poly){
  const last=latestSeason(f), st=statusPola(f);
  const teraz=maszynyNaPolu(f.id).map(({maszyna,zadanie})=>{
    const w=workerById(zadanie.workerId);
    return `${maszyna?esc(maszyna.nazwa):'praca bez sprzętu'} — ${esc(zadanie.zadanie||rodzajPracy(zadanie).label)}${w?' · '+esc(w.imie):''}`;
  }).join('<br>');
  poly.bindPopup(`<div class="pf-pop">
    <div class="pf-tyt">${esc(f.nazwa)}</div>
    <div class="pf-lin">${fmt(f.powierzchnia_ha)} ha</div>
    ${last&&last.uprawa?`<div class="pf-lin">${uprawaZIkona(last.uprawa,22)}</div>`:''}
    ${st?`<div class="pf-teraz">● ${st.opis}</div>`:''}
    ${teraz?`<div class="pf-lin">${teraz}</div>`:''}
    <div class="pf-akcje">
      <button class="gl" onclick="LMAP.closePopup();szybkieZadanie('${f.id}')">+ Zadanie</button>
      <button onclick="LMAP.closePopup();go('detail','${f.id}')">Dziennik pola</button>
    </div></div>`).openPopup();
}

function startDrawNew(){
  if(!LMAP){ alert('Mapa jeszcze się ładuje — spróbuj za chwilę.'); return; }
  drawTargetField=null;
  const dc=new L.Draw.Polygon(LMAP,{allowIntersection:false,showArea:true,metric:true,shapeOptions:{color:'#C89B2C',weight:2,fillOpacity:.25}});
  dc.enable();
}
function cancelDrawTarget(){ drawTargetField=null; render(); }

function onDrawCreated(e){
  const latlngs=e.layer.getLatLngs()[0].map(p=>[+p.lat.toFixed(7),+p.lng.toFixed(7)]);
  const ha=polygonAreaHa(latlngs);
  if(drawTargetField){
    const f=state.fields.find(x=>x.id===drawTargetField);
    f.geo={polygon:latlngs}; f.powierzchnia_ha=+ha.toFixed(2);
    drawTargetField=null; save(); render();
    return;
  }
  pendingGeo={polygon:latlngs};
  openFieldForm(null, +ha.toFixed(2));
}
function onDrawEdited(e){
  e.layers.eachLayer(layer=>{
    if(!layer._fieldId) return;
    const f=state.fields.find(x=>x.id===layer._fieldId);
    if(!f) return;
    const latlngs=layer.getLatLngs()[0].map(p=>[+p.lat.toFixed(7),+p.lng.toFixed(7)]);
    f.geo={polygon:latlngs}; f.powierzchnia_ha=+polygonAreaHa(latlngs).toFixed(2);
  });
  save();
  // odśwież etykiety (powierzchnia mogła się zmienić)
  document.getElementById('statHa').textContent=totalHa().toFixed(1).replace('.',',');
}

/* geodezyjne pole wielokąta -> ha */
function polygonAreaHa(pts){
  const R=6378137, d2r=Math.PI/180, n=pts.length;
  if(n<3) return 0;
  let area=0;
  for(let i=0;i<n;i++){
    const [la1,lo1]=pts[i], [la2,lo2]=pts[(i+1)%n];
    area+=(lo2-lo1)*d2r*(2+Math.sin(la1*d2r)+Math.sin(la2*d2r));
  }
  return Math.abs(area*R*R/2)/10000;
}

async function mapSearch(q){
  q=(q||'').trim(); if(!q||!LMAP) return;
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=pl&q='+encodeURIComponent(q));
    const d=await r.json();
    if(d&&d[0]) LMAP.setView([+d[0].lat,+d[0].lon],15);
    else alert('Nie znaleziono takiej miejscowości.');
  }catch(e){ alert('Wyszukiwanie wymaga internetu.'); }
}

function initMiniMap(){
  const el=document.getElementById('miniMap');
  if(!el||typeof L==='undefined') return;
  const f=state.fields.find(x=>x.id===view.fieldId);
  if(!f||!f.geo||!f.geo.polygon) return;
  const m=L.map(el,{zoomControl:false,dragging:false,scrollWheelZoom:false,doubleClickZoom:false,attributionControl:false});
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19}).addTo(m);
  const last=latestSeason(f), col=cropColor(last&&last.uprawa);
  const poly=L.polygon(f.geo.polygon,{color:col,weight:2,fillColor:col,fillOpacity:.4}).addTo(m);
  m.fitBounds(poly.getBounds().pad(0.4));
  setTimeout(()=>m.invalidateSize(),60);
}

/* =========================================================
   Ekran „Nowe pole" — najpierw obrys na mapie, potem opis
   ========================================================= */
function renderNewFieldView(){
  const area = newFieldGeo ? polygonAreaHa(newFieldGeo.polygon) : null;
  const chip = area!=null
    ? `<b style="color:var(--primary)">✓ Obrys gotowy</b> · <b class="num">${fmt(area.toFixed(2))} ha</b>`
    : '<b style="color:var(--accent)">Obrys niegotowy</b> — klikaj narożniki działki, a na koniec '
      +'<b>kliknij jeszcze raz pierwszy punkt</b>, żeby zamknąć kształt. Dopiero wtedy policzy się powierzchnia.';
  return `
    <button class="btn ghost small" onclick="cancelNewField()" style="margin-bottom:14px">← Anuluj</button>
    <h1 style="font-family:var(--serif);font-size:30px;margin:0 0 4px">Nowe pole</h1>
    <p class="muted" style="margin:0 0 18px">Obrysuj działkę na zdjęciu satelitarnym, potem nadaj jej nazwę i komentarz.</p>
    <div class="create-grid">
      <div>
        <div class="map-toolbar">
          <input class="map-search" id="cMapSearch" placeholder="🔍 Znajdź miejscowość…" onkeydown="if(event.key==='Enter')createSearch(this.value)">
          <button class="btn primary" onclick="createStartDraw()">✏️ Narysuj obrys</button>
          <button class="btn" onclick="createClear()">Wyczyść</button>
        </div>
        <div id="createMap"></div>
        <div class="map-hint"><span id="areaChip">${chip}</span></div>
      </div>
      <div class="create-form">
        <div class="field"><label>Nazwa działki</label><input id="nf_nazwa" placeholder="np. Za stodołą" autofocus></div>
        <div class="field"><label>Powierzchnia (ha)</label><input id="nf_ha" inputmode="decimal" value="${area!=null?area.toFixed(2).replace('.',','):''}" placeholder="policzy się z obrysu">
          <div class="hint">Wypełnia się automatycznie po narysowaniu obrysu — możesz poprawić ręcznie.</div></div>
        <div class="field"><label>Lokalizacja / gleba</label><input id="nf_lok" placeholder="np. przy lesie, gleba IV kl."></div>
        <div class="field"><label>Komentarz</label><textarea id="nf_kom" placeholder="uwagi o działce: dojazd, kamienie, zastoiska wody, zwierzyna…"></textarea></div>
        <button class="btn primary" style="width:100%;justify-content:center" onclick="saveNewField()">Zapisz pole</button>
      </div>
    </div>`;
}

function initCreateMap(){
  const el=document.getElementById('createMap'); if(!el) return;
  if(typeof L==='undefined'){
    el.outerHTML=`<div class="map-off"><div style="font-size:19px;font-family:var(--serif);color:var(--ink)">Mapa wymaga internetu</div>
      <div>Bez sieci możesz zapisać pole bez obrysu — powierzchnię wpisz ręcznie.</div></div>`;
    return;
  }
  if(CMAP){ try{CMAP.remove();}catch(e){} CMAP=null; }
  const ui=state.ui||(state.ui={});
  CMAP=L.map(el,{zoomControl:true}).setView(ui.mapCenter||[52.03,19.3], ui.mapZoom||6);
  wlaczWarstwy(CMAP);
  // istniejące pola jako lekkie tło (dla orientacji)
  fieldsWithGeo().forEach(f=>{ L.polygon(f.geo.polygon,{color:'#6b6b6b',weight:1,fillOpacity:.08,interactive:false,dashArray:'4'}).addTo(CMAP); });
  createDrawn=new L.FeatureGroup().addTo(CMAP);
  if(newFieldGeo){
    const p=L.polygon(newFieldGeo.polygon,{color:'#C89B2C',weight:2,fillOpacity:.3}).addTo(createDrawn);
    CMAP.fitBounds(p.getBounds().pad(0.5));
  }else if(fieldsWithGeo().length){
    try{ CMAP.fitBounds(L.featureGroup(fieldsWithGeo().map(f=>L.polygon(f.geo.polygon))).getBounds().pad(0.3)); }catch(e){}
  }
  /* ⚠️ Widok mapy nie był zapamiętywany — po dojechaniu do swojej wsi i wyjściu z ekranu
     następne pole zaczynało się znowu nad środkiem Polski. Teraz zapamiętujemy tak samo,
     jak robi to mapa na Pulpicie. */
  CMAP.on('moveend',()=>{ const c=CMAP.getCenter(); ui.mapCenter=[c.lat,c.lng]; ui.mapZoom=CMAP.getZoom(); save(); });
  CMAP.on(L.Draw.Event.CREATED,e=>{
    createDrawn.clearLayers();
    if(e.layer.setStyle) e.layer.setStyle({color:'#C89B2C',weight:2,fillOpacity:.3});
    e.layer.addTo(createDrawn);
    const ll=e.layer.getLatLngs()[0].map(p=>[+p.lat.toFixed(7),+p.lng.toFixed(7)]);
    onCreateDrawn(ll);
  });
  setTimeout(()=>{ if(CMAP) CMAP.invalidateSize(); },60);
  if(!newFieldGeo) setTimeout(createStartDraw,250);
}
function createStartDraw(){
  if(!CMAP) return;
  createDrawn.clearLayers(); newFieldGeo=null;
  new L.Draw.Polygon(CMAP,{allowIntersection:false,showArea:true,metric:true,shapeOptions:{color:'#C89B2C',weight:2,fillOpacity:.25}}).enable();
}
function createClear(){
  if(createDrawn) createDrawn.clearLayers();
  newFieldGeo=null;
  const c=document.getElementById('areaChip'); if(c) c.textContent='Kliknij „Narysuj obrys" i klikaj narożniki działki.';
  const h=document.getElementById('nf_ha'); if(h) h.value='';
}
function onCreateDrawn(latlngs){
  newFieldGeo={polygon:latlngs};
  const ha=polygonAreaHa(latlngs);
  const c=document.getElementById('areaChip'); if(c) c.innerHTML=`✓ Obrys zapisany · <b class="num">${fmt(ha.toFixed(2))} ha</b>`;
  const h=document.getElementById('nf_ha'); if(h) h.value=ha.toFixed(2).replace('.',',');
}
async function createSearch(q){
  q=(q||'').trim(); if(!q||!CMAP) return;
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=pl&q='+encodeURIComponent(q));
    const d=await r.json();
    if(d&&d[0]) CMAP.setView([+d[0].lat,+d[0].lon],15); else alert('Nie znaleziono takiej miejscowości.');
  }catch(e){ alert('Wyszukiwanie wymaga internetu.'); }
}
function saveNewField(){
  const nazwa=val('nf_nazwa').trim();
  if(!nazwa){ alert('Podaj nazwę działki.'); document.getElementById('nf_nazwa')?.focus(); return; }
  const ha=num(val('nf_ha'));

  /* ⚠️ TO NAPRAWIA REALNY BŁĄD: formularz przyjmował pole bez zamkniętego obrysu
     i bez powierzchni, nie mówiąc ani słowa. Powstawało pole „0 ha, bez obrysu",
     niewidoczne na mapie i bez miniatury — a użytkownik był przekonany, że obrysował
     działkę. Najczęstsza przyczyna: obrys nie został ZAMKNIĘTY (trzeba kliknąć
     pierwszy punkt jeszcze raz), więc Leaflet.draw nigdy nie zgłosił gotowego kształtu. */
  if(!newFieldGeo && !(ha>0)){
    alert('Pole nie ma ani obrysu, ani powierzchni.\n\n'
      +'Jeśli klikałeś narożniki na mapie — obrys trzeba ZAMKNĄĆ, klikając jeszcze raz '
      +'pierwszy punkt (albo klikając dwukrotnie przy ostatnim).\n\n'
      +'Możesz też wpisać powierzchnię ręcznie w polu „Powierzchnia (ha)".');
    return;
  }
  if(!newFieldGeo && !confirm('To pole nie ma obrysu na mapie — nie będzie się podświetlać '
      +'ani nie dostanie miniatury.\n\nZapisać mimo to? Obrys dorysujesz później '
      +'przyciskiem „Narysuj obrys" na karcie pola.')) return;

  const nf={id:uid(),nazwa,powierzchnia_ha:ha,lokalizacja:val('nf_lok').trim(),komentarz:val('nf_kom').trim(),sezony:[]};
  if(newFieldGeo){
    nf.geo=newFieldGeo;
    // Powierzchnia zawsze z obrysu, chyba że użytkownik świadomie wpisał własną.
    if(!(ha>0)) nf.powierzchnia_ha=+polygonAreaHa(newFieldGeo.polygon).toFixed(2);
  }
  state.fields.push(nf);
  newFieldGeo=null; if(CMAP){ try{CMAP.remove();}catch(e){} CMAP=null; }
  save(); go('detail', nf.id);
}
function cancelNewField(){
  newFieldGeo=null; if(CMAP){ try{CMAP.remove();}catch(e){} CMAP=null; }
  go('pola');
}

/* =========================================================
   Widok Pola
   ========================================================= */
/* ═══ POLA — widok tabelaryczny ════════════════════════════════════════════════
   Tabela zamiast siatki kart: przy kilkunastu polach porównanie powierzchni, uprawy
   i plonu w kolumnach jest szybsze niż wodzenie wzrokiem po kaflach. Kafle zostają
   jako drugi tryb — przełącznik w prawym rogu paska filtrów.
   ⚠️ Widok tylko czyta `state.fields`. Żadnej logiki tu nie ma i nie ma jej tu wnosić. */

/* ═══ MINIATURA POLA ═══════════════════════════════════════════════════════════
   Wycinek zdjęcia satelitarnego z nałożonym obrysem — „zrzut ekranu" działki.

   ⚠️ NIE renderujemy tu Leafletu. Kilkanaście żywych map w komórkach tabeli oznacza
   kilkaset zapytań o kafle i zauważalne przycięcie przy każdym przewinięciu listy.
   Zamiast tego: JEDEN statyczny obrazek na pole z końcówki `export` Esri (ok. 9 kB),
   ładowany leniwie i cache'owany przez przeglądarkę, a na nim obrys rysowany SVG-iem.

   ⚠️ Bez internetu obrazek się nie wczyta — dlatego pod spodem zawsze leży wersja
   rysunkowa (sam obrys na jednolitym tle). onerror ją odsłania. */
function miniaturaPola(f){
  const pts=(f.geo&&f.geo.polygon)||[];
  if(pts.length<3){
    return `<div class="pole-mini pusta" title="Bez obrysu — kliknij, aby narysować"
      onclick="event.stopPropagation();rysujObrysPola('${f.id}')"><span>+ obrys</span></div>`;
  }
  const lat=pts.map(p=>p[0]), lng=pts.map(p=>p[1]);
  const minLat=Math.min(...lat), maxLat=Math.max(...lat);
  const minLng=Math.min(...lng), maxLng=Math.max(...lng);
  // Margines wokół działki, żeby obrys nie dotykał krawędzi kadru.
  const mLat=Math.max((maxLat-minLat)*0.18, 0.00025);
  const mLng=Math.max((maxLng-minLng)*0.18, 0.00040);
  const b=[minLng-mLng, minLat-mLat, maxLng+mLng, maxLat+mLat];

  const W=128, H=84;   // rysujemy w podwójnej gęstości, wyświetlamy w 64×42
  const zdjecie='https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/export'
    +'?bbox='+b.join(',')+'&bboxSR=4326&imageSR=3857&size='+W+','+H+'&format=jpg&f=image';

  // Obrys w układzie kadru: proporcje bierzemy z tego samego bboxa, co obrazek.
  const sx=v=>((v-b[0])/(b[2]-b[0]))*W;
  const sy=v=>((b[3]-v)/(b[3]-b[1]))*H;
  const d=pts.map((p,i)=>(i?'L':'M')+sx(p[1]).toFixed(1)+' '+sy(p[0]).toFixed(1)).join(' ')+' Z';
  const k=cropColor((latestSeason(f)||{}).uprawa);

  return `<div class="pole-mini" title="${esc(f.nazwa)}">
    <img src="${zdjecie}" alt="" loading="lazy" decoding="async"
      onerror="this.classList.add('nieudane')">
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
      <path d="${d}" fill="${k}" fill-opacity=".22" stroke="#fff" stroke-width="3.4"
        stroke-linejoin="round" opacity=".8"/>
      <path d="${d}" fill="none" stroke="${k}" stroke-width="2" stroke-linejoin="round"/>
    </svg></div>`;
}

/* Dorysowanie obrysu do istniejącego pola — ta sama ścieżka, z której korzysta mapa
   na Pulpicie (drawTargetField), więc nie powstaje druga metoda rysowania. */
function rysujObrysPola(id){
  drawTargetField=id;
  mapFocusFieldId=id;
  goModule('pulpit');
}

function statystykiPol(){
  const rok=view.year;
  const sezony=state.fields.map(f=>(f.sezony||[]).find(s=>s.rok===rok)).filter(Boolean);
  const uprawy=new Set(sezony.map(s=>s.uprawa).filter(Boolean));
  const zabiegi=sezony.reduce((n,s)=>n+((s.zabiegi||[]).length),0);
  const k=(ikona,tlo,kolor,etykieta,wartosc,spod)=>`<div class="stat-b">
    <span class="si" style="background:${tlo};color:${kolor}">${ikonaMenu(ikona,'currentColor')}</span>
    <span><span class="stat-t">${etykieta}</span><span class="stat-v">${wartosc}</span>
      ${spod?`<span class="stat-s">${spod}</span>`:''}</span></div>`;
  const zObrysem=state.fields.filter(f=>f.geo&&(f.geo.polygon||[]).length).length;
  const srednia=state.fields.length ? totalHa()/state.fields.length : 0;
  const nazwyUpraw=[...uprawy].slice(0,3).join(', ')+([...uprawy].length>3?' +'+([...uprawy].length-3):'');
  return `<div class="stat-row">
    ${k('pola','var(--primary-soft)','var(--primary)','Liczba pól',state.fields.length,
        zObrysem+' z obrysem na mapie')}
    ${k('pulpit','#EAF0F5','#3E6FB0','Łączna powierzchnia',fmt(totalHa().toFixed(1))+' ha',
        state.fields.length?'średnio '+fmt(srednia.toFixed(1))+' ha':'')}
    ${k('skup','var(--accent-soft)','var(--accent)','Uprawy w sezonie '+rok,uprawy.size,
        nazwyUpraw||'brak zasiewów')}
    ${k('todo','#EDF5EE','#4A7C59','Wykonane zabiegi',zabiegi,'w sezonie '+rok)}
  </div>`;
}

function paskFiltrowPol(){
  const rok=view.year;
  const uprawy=[...new Set(state.fields.map(f=>(f.sezony||[]).find(s=>s.rok===rok))
    .filter(Boolean).map(s=>s.uprawa).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));
  const u=view.polaUprawa||'', sort=view.polaSort||'nazwa';
  const lupa=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
    stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`;
  return `<div class="tbar">
    <span class="szuk">${lupa}<input placeholder="Szukaj pola…" value="${esc(view.polaSzukaj||'')}"
      oninput="view.polaSzukaj=this.value;render()"></span>
    <select onchange="view.polaUprawa=this.value;render()">
      <option value="">Wszystkie uprawy</option>
      ${uprawy.map(x=>`<option value="${esc(x)}" ${u===x?'selected':''}>${esc(x)}</option>`).join('')}
    </select>
    <select onchange="view.polaSort=this.value;render()">
      <option value="nazwa" ${sort==='nazwa'?'selected':''}>Sortuj: nazwa A–Z</option>
      <option value="ha" ${sort==='ha'?'selected':''}>Sortuj: powierzchnia</option>
      <option value="uprawa" ${sort==='uprawa'?'selected':''}>Sortuj: uprawa</option>
    </select>
    <span class="tbar-r">
      <button class="btn small${view.polaWidok!=='kafle'?' primary':''}" onclick="view.polaWidok='tabela';render()">Tabela</button>
      <button class="btn small${view.polaWidok==='kafle'?' primary':''}" onclick="view.polaWidok='kafle';render()">Kafelki</button>
    </span></div>`;
}

function polaPoFiltrach(){
  const rok=view.year, q=(view.polaSzukaj||'').trim().toLowerCase();
  const sezon=f=>(f.sezony||[]).find(s=>s.rok===rok)||{};
  let l=state.fields.filter(f=>{
    if(view.polaUprawa && sezon(f).uprawa!==view.polaUprawa) return false;
    if(!q) return true;
    return (f.nazwa||'').toLowerCase().includes(q)
        || (f.lokalizacja||'').toLowerCase().includes(q)
        || (sezon(f).uprawa||'').toLowerCase().includes(q);
  });
  const s=view.polaSort||'nazwa';
  l.sort((a,b)=> s==='ha' ? (parseFloat(b.powierzchnia_ha)||0)-(parseFloat(a.powierzchnia_ha)||0)
    : s==='uprawa' ? (sezon(a).uprawa||'').localeCompare(sezon(b).uprawa||'','pl')
    : (a.nazwa||'').localeCompare(b.nazwa||'','pl'));
  return l;
}

function renderFieldsView(){
  if(!state.fields.length){
    return `<div class="pusto"><div class="pi">${ikonaMenu('pola','currentColor')}</div>
      <b>Zacznij od pierwszego pola</b>
      <span>Obrysuj działkę na zdjęciu satelitarnym — powierzchnia policzy się sama.</span>
      <div><button class="btn primary" onclick="go('nowePole')">+ Dodaj pole</button></div></div>`
      + lineArtGospodarstwa();
  }
  const lista=polaPoFiltrach();
  if(view.polaWidok==='kafle') return paskFiltrowPol()+kafelkiPol(lista)+legendaUpraw()+lineArtGospodarstwa();

  const rok=view.year;
  // Paginacja: przy kilkudziesięciu polach przewijanie całej listy przestaje być wygodne.
  const naStr=view.polaNaStrone||10;
  const stron=Math.max(1, Math.ceil(lista.length/naStr));
  const str=Math.min(view.polaStrona||1, stron);
  const widoczne=lista.slice((str-1)*naStr, str*naStr);
  const zazn=view.polaZazn||[];

  const wiersze=widoczne.map(f=>{
    const sz=(f.sezony||[]).find(x=>x.rok===rok)||{};
    const zab=(sz.zabiegi||[]).length;
    const naw=(sz.zabiegi||[]).filter(z=>z.rodzaj==='nawoz').length;
    const brak=t=>`<span class="brak">— ${t}</span>`;
    return `<tr class="klik${zazn.includes(f.id)?' zazn':''}" onclick="go('detail','${f.id}')">
      <td class="kol-zazn" onclick="event.stopPropagation();zaznaczPole('${f.id}')">
        <span class="ptak${zazn.includes(f.id)?' on':''}"></span></td>
      <td><span class="pole-cell">${miniaturaPola(f)}
        <span><span class="t-glowna">${esc(f.nazwa)}</span>
          ${f.lokalizacja?`<span class="t-pod">${esc(f.lokalizacja)}</span>`:''}</span></span></td>
      <td class="num"><b>${fmt(f.powierzchnia_ha)}</b> ha</td>
      <td>${sz.uprawa
        ? `${uprawaZIkona(sz.uprawa,26)}${sz.odmiana?`<span class="t-pod odm">Odm. ${esc(sz.odmiana)}</span>`:''}`
        : brak('brak uprawy')}</td>
      <td>${sz.data_siewu?esc(new Date(sz.data_siewu).toLocaleDateString('pl-PL')):brak('brak siewu')}</td>
      <td>${zab?`<b>${zab}</b> ${zab===1?'zabieg':'zabiegi'}${naw?`<span class="t-pod">w tym ${naw} nawożenie</span>`:''}`
        : brak('brak zabiegów')}</td>
      <td class="num">${sz.plon_t_ha?`<b>${fmt(sz.plon_t_ha)}</b> t/ha`:brak('')}</td>
      <td class="num"><button class="kropki" onclick="event.stopPropagation();menuPola(this,'${f.id}')" title="Akcje">⋯</button></td>
    </tr>`;
  }).join('');

  const ha=lista.reduce((n,f)=>n+(parseFloat(f.powierzchnia_ha)||0),0);
  const wszystkieZazn = widoczne.length && widoczne.every(f=>zazn.includes(f.id));

  return paskFiltrowPol()
    + `<div class="tab-wrap"><table class="tab tab-pola">
      <thead><tr>
        <th class="kol-zazn" onclick="zaznaczWszystkiePola()"><span class="ptak${wszystkieZazn?' on':''}"></span></th>
        <th>Pole</th><th class="num">Powierzchnia</th><th>Uprawa (${rok})</th>
        <th>Siew</th><th>Zabiegi / nawożenie</th><th class="num">Plon</th><th class="num">Akcje</th></tr></thead>
      <tbody>${wiersze||`<tr><td colspan="8" style="padding:22px;text-align:center;color:var(--color-text-muted)">Nic nie pasuje do filtrów.</td></tr>`}</tbody>
      <tfoot><tr><td colspan="2">Razem ${lista.length} ${lista.length===1?'pole':'pól'}${zazn.length?` · zaznaczono ${zazn.length}`:''}</td>
        <td class="num"><b>${fmt(ha.toFixed(1))}</b> ha</td><td colspan="5"></td></tr></tfoot>
    </table></div>`
    + stopkaTabeliPol(lista.length, str, stron, naStr)
    + lineArtGospodarstwa();
}

/* Legenda i paginacja w JEDNYM pasku pod tabelą — dwa osobne paski pod listą
   rozbijały ją na trzy piętra i odsuwały treść od danych. */
function stopkaTabeliPol(ile, str, stron, naStr){
  const rok=view.year;
  const uprawy=[...new Set(state.fields.map(f=>(f.sezony||[]).find(s=>s.rok===rok))
    .filter(Boolean).map(s=>s.uprawa).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));
  const od=ile?((str-1)*naStr+1):0, doo=Math.min(str*naStr, ile);
  return `<div class="tab-stopka">
    ${uprawy.length?`<span class="ts-leg"><span class="lg-t2">Legenda upraw:</span>
      ${uprawy.map(u=>`<span class="lg-p"><span class="crop-swatch" style="background:${cropColor(u)}"></span>${esc(u)}</span>`).join('')}</span>`:'<span></span>'}
    <span class="ts-str">
      <span class="muted">Pola na stronie:</span>
      <select onchange="view.polaNaStrone=+this.value;view.polaStrona=1;render()">
        ${[10,25,50].map(n=>`<option value="${n}" ${naStr===n?'selected':''}>${n}</option>`).join('')}</select>
      <span class="muted">${od}–${doo} z ${ile}</span>
      <button class="kropki" ${str<=1?'disabled':''} onclick="view.polaStrona=${str-1};render()">‹</button>
      <button class="kropki" ${str>=stron?'disabled':''} onclick="view.polaStrona=${str+1};render()">›</button>
    </span></div>`;
}

function zaznaczPole(id){
  const z=view.polaZazn||[];
  view.polaZazn = z.includes(id) ? z.filter(x=>x!==id) : [...z,id];
  render();
}
function zaznaczWszystkiePola(){
  const naStr=view.polaNaStrone||10, str=view.polaStrona||1;
  const widoczne=polaPoFiltrach().slice((str-1)*naStr, str*naStr).map(f=>f.id);
  const z=view.polaZazn||[];
  view.polaZazn = widoczne.every(id=>z.includes(id)) ? z.filter(id=>!widoczne.includes(id))
    : [...new Set([...z,...widoczne])];
  render();
}
function menuPola(btn,id){
  document.querySelectorAll('.pola-menu').forEach(x=>x.remove());
  const m=document.createElement('div'); m.className='pola-menu';
  m.innerHTML=`<button onclick="go('detail','${id}')">Otwórz dziennik</button>
    <button onclick="mapFocusFieldId='${id}';goModule('pulpit')">Pokaż na mapie</button>
    <button onclick="szybkieZadanie('${id}')">+ Zaplanuj pracę</button>`;
  btn.parentNode.appendChild(m);
  setTimeout(()=>document.addEventListener('click',function z(){ m.remove(); document.removeEventListener('click',z); }),0);
}

/* Kafle zostają dla tych, którzy wolą oglądać pola jako obrazki. Ten sam zestaw danych. */
function kafelkiPol(lista){
  const rok=view.year;
  return `<div class="grid">${lista.map(f=>{
    const s=(f.sezony||[]).find(x=>x.rok===rok)||latestSeason(f)||{};
    return `<div class="field-card" onclick="go('detail','${f.id}')">
      <div class="fc-head">
        <div><h3 class="fc-name">${esc(f.nazwa)}</h3>
          <div class="fc-loc">${esc(f.lokalizacja||'')}</div></div>
        <div class="fc-area"><b class="num">${fmt(f.powierzchnia_ha)}</b><span>ha</span></div>
      </div>
      ${ribbon(f)}
      <div class="fc-foot">${s.uprawa?uprawaZIkona(s.uprawa,24):'<span class="muted">—</span>'}
        ${s.plon_t_ha?`<span class="fc-yield">plon <b class="num">${fmt(s.plon_t_ha)} t/ha</b></span>`:''}</div>
    </div>`;}).join('')}
    <div class="add-card" onclick="go('nowePole')"><div class="plus">+</div><div>Dodaj pole</div></div>
  </div>`;
}

/* Legenda: kolory pochodzą z REJESTR_UPRAW przez cropColor(), więc zgadzają się
   z obrysami na mapie i z paskiem płodozmianu. */
function legendaUpraw(){
  const rok=view.year;
  const uprawy=[...new Set(state.fields.map(f=>(f.sezony||[]).find(s=>s.rok===rok))
    .filter(Boolean).map(s=>s.uprawa).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pl'));
  if(!uprawy.length) return '';
  return `<div class="legenda"><span class="lg-t">Uprawy w sezonie ${rok}</span>
    ${uprawy.map(u=>`<span class="lg-p"><span class="crop-swatch" style="background:${cropColor(u)}"></span>${esc(u)}</span>`).join('')}
  </div>`;
}

function ribbon(f){
  const years=f.sezony.map(s=>s.rok);
  const maxY=Math.max(view.year, ...(years.length?years:[view.year]));
  const list=[]; for(let y=maxY-5;y<=maxY;y++) list.push(y);
  const segs=list.map(y=>{
    const s=seasonOf(f,y);
    if(!s) return `<div class="ribbon-seg empty"><span class="yr">${String(y).slice(2)}</span></div>`;
    const col=cropColor(s.uprawa);
    return `<div class="ribbon-seg" style="background:${col}" title="${y}: ${esc(s.uprawa||'')}">
      <span class="ribbon-crop">${shortCrop(s.uprawa)}</span><span class="yr">${String(y).slice(2)}</span></div>`;
  }).join('');
  return `<div class="ribbon"><div class="ribbon-label">Płodozmian · ${list[0]}–${list[list.length-1]}</div>
    <div class="ribbon-track">${segs}</div></div>`;
}
function shortCrop(c){
  if(!c) return '';
  const map={'Pszenica ozima':'Psz. oz.','Pszenica jara':'Psz. jara','Rzepak ozimy':'Rzepak','Rzepak':'Rzepak',
    'Kukurydza na ziarno':'Kukur.','Kukurydza na kiszonkę':'Kukur. kisz','Jęczmień ozimy':'Jęcz. oz.','Jęczmień jary':'Jęcz. jary',
    'Buraki cukrowe':'Buraki','Ziemniaki':'Ziemn.'};
  return map[c]||c;
}

/* =========================================================
   Widok Sezon
   ========================================================= */
function renderSeasonView(){
  const rows=state.fields.map(f=>{
    const s=seasonOf(f,view.year);
    if(!s){
      return `<tr data-field onclick="go('detail','${f.id}')">
        <td><b>${esc(f.nazwa)}</b><div class="muted" style="font-size:12px">${fmt(f.powierzchnia_ha)} ha</div></td>
        <td class="muted" colspan="4" style="font-style:italic">— brak uprawy na ${view.year} —</td>
        <td><button class="btn small primary" onclick="event.stopPropagation();openSeasonForm('${f.id}')">+ Dodaj uprawę</button></td></tr>`;
    }
    const zab=s.zabiegi||[];
    const zabHtml=zab.length?zab.map(z=>`<span class="badge" style="font-size:11px;padding:2px 7px;margin:1px 2px 1px 0">
        <span class="dot" style="width:8px;height:8px;background:${ZABIEG_KINDS[z.rodzaj]||'#888'}"></span>${esc(z.srodek)} <span class="num muted">${esc(z.dawka)} ${esc(z.jednostka)}</span></span>`).join('')
      :'<span class="muted">—</span>';
    const plon=s.plon_t_ha?`<b class="num">${fmt(s.plon_t_ha)}</b> t/ha`:'<span class="muted">jeszcze rośnie</span>';
    return `<tr data-field onclick="go('detail','${f.id}')">
      <td><b>${esc(f.nazwa)}</b><div class="muted" style="font-size:12px">${fmt(f.powierzchnia_ha)} ha</div></td>
      <td><span class="badge"><span class="dot" style="background:${cropColor(s.uprawa)}"></span>${esc(s.uprawa||'—')}</span>
          ${s.odmiana?`<div class="muted" style="font-size:12px;margin-top:3px">${esc(s.odmiana)}</div>`:''}</td>
      <td class="num">${esc(s.data_siewu||'—')}</td>
      <td style="max-width:340px">${zabHtml}</td>
      <td>${plon}</td>

/* =========================================================
   MODUŁ: FLOTA
   ========================================================= */
/* ═══ INTEGRACJA: ZADANIE JAKO JEDYNE ŹRÓDŁO ══════════════════════════════════
   Flota, mapa i karta pola NIE trzymają własnych informacji o tym, gdzie maszyna pracuje.
   Wszystko wylicza się z `state.schedule`. Dzięki temu przeciągnięcie zadania w Grafiku
   na inne pole albo podmiana ciągnika od razu zmienia Flotę, mapę i kartę pola —
   bez żadnej ręcznej synchronizacji i bez pól typu `machine.currentField`.

   ⚠️ NIE dodawaj `maszyna.aktualnePole` ani `maszyna.aktualnyPracownik`. Każde takie pole
   trzeba by odświeżać w kilku miejscach i po pierwszej pomyłce zacznie kłamać. */

/* Czy zadanie trwa TERAZ. Zadanie bez godzin traktujemy jako całodniowe — inaczej wpis
   „na dziś, bez godzin" nigdy nie pokazałby maszyny jako pracującej. */
function zadanieTrwa(z, teraz){
  const t=teraz||new Date();
  if(z.date!==fmtISO(t)) return false;
  if(z.status==='wykonane'||z.status==='anulowane') return false;
  const min=t.getHours()*60+t.getMinutes();
  const od=naMinuty(z.od)??0, dow=naMinuty(z.do)??1440;
  return min>=od && min<=dow;
}

/* Aktywne zadanie maszyny (jako ciągnik ALBO narzędzie). Gdy żadne nie trwa w tej chwili,
   bierzemy najbliższe dzisiejsze — żeby Flota pokazała plan dnia, a nie pustkę o 6 rano. */
function aktywneZadanieMaszyny(maszynaId){
  const dzis=fmtISO(new Date());
  const jej=state.schedule.filter(z=>(z.ciagnikId===maszynaId||z.maszynaId===maszynaId)
    && z.date===dzis && z.status!=='anulowane');
  return jej.find(z=>zadanieTrwa(z)) || jej.filter(z=>z.status!=='wykonane')
    .sort((a,b)=>(a.od||'').localeCompare(b.od||''))[0] || null;
}

/* Status maszyny — WYLICZANY, nie zapisywany.
   🔑 Kolejność z wymagań: status ręczny (awaria/serwis/niedostępna) ma pierwszeństwo zawsze;
   dopiero potem patrzymy, czy trwa zadanie. „Pracuje" nigdy nie jest zapisywane w danych. */
/* Hierarchia stanów, od najsilniejszego:
   1. ręczna AWARIA / NIEDOSTĘPNA — człowiek stwierdził fakt, żadne zadanie tego nie przebije,
   2. trwające zadanie WARSZTATOWE → „warsztat" (maszyna stoi u mechanika, nie orze),
   3. ręczny SERWIS — zapowiedź bez wpisu w grafiku,
   4. trwające zadanie polowe / transportowe / gospodarcze → „pracuje",
   5. inaczej → „dostępna".
   ⚠️ Warsztat wyprzedza ręczny serwis świadomie: zadanie niesie KTO, CO i DO KIEDY,
   ręczny status niesie samo słowo. Stan dalej nigdzie nie jest zapisywany. */
function statusMaszyny(m){
  const reczny=(m.status||'').toLowerCase();
  if(['awaria','niedostępna'].includes(reczny)) return reczny;
  const z=aktywneZadanieMaszyny(m.id);
  const trwa = z && zadanieTrwa(z);
  if(trwa && jestWarsztat(z)) return 'warsztat';
  if(reczny==='serwis') return 'serwis';
  return trwa ? 'pracuje' : 'dostępna';
}

/* Wszystkie maszyny pracujące teraz na danym polu — dla sekcji „Aktualnie" w karcie pola
   i dla znaczników na mapie. */
function maszynyNaPolu(poleId){
  const dzis=fmtISO(new Date());
  const out=[];
  state.schedule.filter(z=>z.poleId===poleId && z.date===dzis && z.status!=='anulowane'
      && z.status!=='wykonane' && jestPolowe(z))
    .forEach(z=>{
      [z.ciagnikId,z.maszynaId].filter(Boolean).forEach(id=>{
        const m=maszynaById(id); if(m && !out.some(x=>x.maszyna.id===id)) out.push({maszyna:m, zadanie:z});
      });
      if(!z.ciagnikId && !z.maszynaId) out.push({maszyna:null, zadanie:z});   // praca bez sprzętu
    });
  return out;
}

/* Środek pola — pozycja znacznika maszyny.
   ⚠️ GPS-u tu nie ma i na tym etapie nie ma go być. Ale funkcja jest jedynym miejscem,
   które ustala pozycję, więc dołożenie GPS-u sprowadzi się do jednego warunku:
   świeża pozycja z urządzenia → użyj jej; brak → centroid pola z aktywnego zadania. */
function pozycjaMaszyny(m, pole){
  // if (m.lat && m.lng && świeże(m.lastPositionAt)) return [m.lat, m.lng];   // ← przyszły GPS
  if(!pole || !pole.geo || !(pole.geo.polygon||[]).length) return null;
  const pts=pole.geo.polygon;
  const s=pts.reduce((a,p)=>[a[0]+p[0], a[1]+p[1]],[0,0]);
  return [s[0]/pts.length, s[1]/pts.length];
}

/* ─── Przejścia między modułami ─────────────────────────────────────────────── */
function idzDoZadania(id){ const z=zadanieById(id); if(z) pokazZadanie(id); }

/* Grafik ustawiony na tygodniu, w którym leży zadanie — inaczej po kliknięciu „pokaż zadanie"
   użytkownik trafiał na bieżący tydzień i sam musiał go szukać. */
function idzDoGrafiku(dataISO){
  if(dataISO){
    const d=new Date(dataISO+'T00:00:00');
    d.setDate(d.getDate()-((d.getDay()+6)%7));
    view.weekStart=fmtISO(d);
  }
  goModule('grafik');
}
function idzDoMaszyny(id){ view.machineId=id; goModule('flota'); window.scrollTo(0,0); }
function idzDoPola(id){ go('detail',id); }

/* „Pokaż na mapie" — Pulpit, kadr na polu, otwarty dymek maszyny. */
let mapFocusMaszynaId=null;
function pokazNaMapie(maszynaId){
  const z=aktywneZadanieMaszyny(maszynaId);
  const f=z&&z.poleId?poleById(z.poleId):null;
  if(!f||!f.geo||!(f.geo.polygon||[]).length){
    alert('Nie wiadomo, gdzie pokazać tę maszynę — jej zadanie nie ma pola z obrysem na mapie.');
    return;
  }
  mapFocusFieldId=f.id; mapFocusMaszynaId=maszynaId;
  goModule('pulpit'); window.scrollTo(0,0);
}

/* Znaczniki maszyn — generowane WYŁĄCZNIE z aktywnych zadań, nigdy zapisywane. */
let warstwaMaszyn=null;
function rysujMaszynyNaMapie(){
  if(!LMAP) return;
  if(warstwaMaszyn){ try{LMAP.removeLayer(warstwaMaszyn);}catch(e){} }
  warstwaMaszyn=L.layerGroup().addTo(LMAP);

  const dzis=fmtISO(new Date());
  const wgPola={};
  // Tylko praca POLOWA daje znacznik. Naprawa w warsztacie nie odbywa się na polu, więc
  // marker w centroidzie działki byłby kłamstwem — nawet gdyby zadanie miało pole wpisane.
  state.schedule.filter(z=>z.date===dzis && z.status!=='anulowane' && z.status!=='wykonane'
      && z.poleId && jestPolowe(z))
    .forEach(z=>{ (wgPola[z.poleId]=wgPola[z.poleId]||[]).push(z); });

  Object.entries(wgPola).forEach(([poleId,zadania])=>{
    const f=poleById(poleId); if(!f) return;
    const poz=pozycjaMaszyny(null,f); if(!poz) return;

    zadania.forEach((z,i)=>{
      const c=z.ciagnikId?maszynaById(z.ciagnikId):null;
      const glowna=c||(z.maszynaId?maszynaById(z.maszynaId):null);
      const w=workerById(z.workerId);
      const nar=z.maszynaId&&z.maszynaId!==(c&&c.id)?maszynaById(z.maszynaId):null;
      // Kilka zadań na jednym polu — lekki rozstrzał, żeby znaczniki się nie zasłaniały.
      const pos=[poz[0]+(i?0.00035*i:0), poz[1]+(i?0.00055*i:0)];
      const trwa=zadanieTrwa(z);
      const ikona=L.divIcon({className:'masz-marker',html:
        `<div class="mm-pin${trwa?' trwa':''}" title="${esc((glowna&&glowna.nazwa)||z.zadanie||'')}">${glowna&&!jestCiagnik(glowna)?'🔧':'🚜'}</div>`,
        // Kotwica nad punktem: podpis pola siedzi w środku obrysu (warstwa tooltipów jest
        // NAD warstwą znaczników), więc znacznik zakotwiczony w centroidzie chowałby się pod nim.
        iconSize:[34,34], iconAnchor:[17,46]});
      const mk=L.marker(pos,{icon:ikona}).addTo(warstwaMaszyn);
      mk._maszynaId=glowna?glowna.id:null;
      mk.bindPopup(`<div class="mm-pop">
          <div class="mm-tyt">${esc((glowna&&glowna.nazwa)||'Zadanie')}</div>
          <div class="mm-stan${trwa?' trwa':''}">● ${trwa?'w trakcie':'zaplanowane'}</div>
          <div class="mm-zad">${esc(z.zadanie||'')}</div>
          <div class="mm-lin">${w?esc(w.imie):'—'}</div>
          <div class="mm-lin">${esc(f.nazwa)}${z.od?' · '+esc(z.od)+(z.do?'–'+esc(z.do):''):''}</div>
          ${nar?`<div class="mm-lin">🔧 ${esc(nar.nazwa)}</div>`:''}
          <div class="mm-akcje">
            ${glowna?`<button onclick="idzDoMaszyny('${glowna.id}')">Otwórz maszynę</button>`:''}
            <button onclick="idzDoZadania('${z.id}')">Otwórz zadanie</button>
          </div></div>`);
      if(mapFocusMaszynaId && glowna && glowna.id===mapFocusMaszynaId){
        setTimeout(()=>{ try{ mk.openPopup(); }catch(e){} },350);
        mapFocusMaszynaId=null;
      }
    });
  });
}

/* ═══ FLOTA — panel zarządzania maszynami ══════════════════════════════════════
   Widok listy zamiast galerii dużych kart: przy kilkunastu maszynach karty zjadały ekran,
   a informacji było mniej niż miejsca. Lista pokazuje wszystko naraz i skaluje się do floty
   kilkudziesięciu pozycji.
   ⚠️ Model danych bez zmian. Pola `interwal`, `oc`, `badanie`, `vin` są OPCJONALNE — maszyny
   sprzed tej zmiany działają dalej, po prostu pokazują „—" tam, gdzie danych nie ma. */

/* Ile godzin do serwisu. Liczone z ostatniego przeglądu + interwał; bez interwału nie zgadujemy. */
function serwisMaszyny(m){
  const interwal=liczba(m.interwal);
  const teraz=liczba(m.mth);
  const ostatni=(m.przeglady||[]).slice().sort((a,b)=>liczba(b.mth)-liczba(a.mth))[0];
  if(!interwal) return {stan:'brak'};
  const bazowe = ostatni ? liczba(ostatni.mth) : 0;
  const nastepny = bazowe + interwal;
  const zostalo = Math.round(nastepny - teraz);
  return { stan: zostalo<0 ? 'po' : (zostalo<=50 ? 'blisko' : 'ok'), zostalo, nastepny, ostatni };
}

/* Ile dni do terminu (OC, badanie). Zwraca null, gdy daty nie podano. */
function dniDo(data){
  if(!data) return null;
  const d=new Date(data+'T00:00:00'); if(isNaN(d)) return null;
  return Math.round((d - new Date(fmtISO(new Date())+'T00:00:00'))/86400000);
}
function terminHtml(data){
  const n=dniDo(data);
  if(n===null) return '<span class="fl-pusto">—</span>';
  const kl = n<0 ? 'zly' : (n<=30 ? 'uwaga' : 'ok');
  const opis = n<0 ? ('po terminie ('+(-n)+' dni)') : (n<=30 ? ('za '+n+' dni') : '');
  return '<span class="fl-termin '+kl+'">'+esc(new Date(data+'T00:00:00').toLocaleDateString('pl-PL'))+'</span>'
    + (opis?'<span class="fl-sub">'+opis+'</span>':'');
}
function serwisHtml(m){
  const s=serwisMaszyny(m);
  if(s.stan==='brak') return '<span class="fl-pusto">—</span><span class="fl-sub">brak interwału</span>';
  const plan='<span class="fl-sub">plan '+fmt(s.nastepny)+' mth</span>';
  if(s.stan==='po')     return '<span class="fl-termin zly">🔴 przekroczony o '+(-s.zostalo)+' mth</span>'+plan;
  if(s.stan==='blisko') return '<span class="fl-termin uwaga">⚠ '+s.zostalo+' mth do serwisu</span>'+plan;
  return '<span class="fl-termin ok">✓ '+s.zostalo+' mth do serwisu</span>'+plan;
}

function ustawFlote(pole,wartosc){
  state.ui.flota[pole]=wartosc; save();
  if(pole==='szukaj'){                      // bez pełnego renderu — pole nie może tracić ogniska
    const stary=document.querySelector('.fl-wrap'); if(!stary) return render();
    const n=document.createElement('div'); n.innerHTML=flotaLista();
    stary.replaceWith(n.firstElementChild); return;
  }
  render();
}

/* Sama lista/karty — wydzielone, żeby wyszukiwarka mogła odświeżyć wyłącznie tę część. */
function flotaLista(){
  const f=state.ui.flota, szuk=(f.szukaj||'').toLowerCase().trim();
  let lista=state.machines.filter(m=>{
    if(f.typ && (m.typ||'')!==f.typ) return false;
    if(f.status==='pracuje'){ if(statusMaszyny(m)!=='pracuje') return false; }
    else if(f.status && statusMaszyny(m)!==f.status) return false;
    if(!szuk) return true;
    return [m.nazwa,m.typ,m.marka,m.model,m.nr_rej,m.vin].some(x=>(x||'').toLowerCase().includes(szuk));
  });
  lista.sort((a,b)=>{
    if(f.sort==='serwis'){
      const sa=serwisMaszyny(a), sb=serwisMaszyny(b);
      const va=sa.stan==='brak'?1e9:sa.zostalo, vb=sb.stan==='brak'?1e9:sb.zostalo;
      return va-vb;                          // najpilniejsze na górze
    }
    if(f.sort==='mth') return liczba(b.mth)-liczba(a.mth);
    return (a.nazwa||'').localeCompare(b.nazwa||'','pl');
  });

  if(!lista.length) return '<div class="fl-wrap"><div class="fl-pusto-box">Żadna maszyna nie pasuje do filtrów.</div></div>';

  const kropka=m=>{ const st=statusMaszyny(m);   // WYLICZANY z zadań — patrz blok INTEGRACJA
    return '<span class="fl-stan"><span class="fl-kropka" style="background:'+(KOLOR_STATUSU[st]||'#8A8A8A')+'"></span>'+esc(st)+'</span>'; };

  if(f.widok==='karty'){
    return '<div class="fl-wrap"><div class="fl-karty">'+lista.map(m=>
      '<div class="fl-karta" onclick="goMachine(\''+m.id+'\')">'
      +'<div class="fl-k-gora"><span class="fl-ik">'+(jestCiagnik(m)?'🚜':'🔧')+'</span>'+kropka(m)+'</div>'
      +'<div class="fl-k-nazwa">'+esc(m.nazwa)+'</div>'
      +'<div class="fl-k-sub">'+esc([m.marka,m.rok].filter(Boolean).join(' · ')||m.typ||'')+'</div>'
      +'<div class="fl-k-dol"><span>'+(m.mth?fmt(m.mth)+' mth':'—')+'</span><span>'+esc(m.typ||'')+'</span></div>'
      +'</div>').join('')+'</div></div>';
  }

  const wiersze=lista.map(m=>
    '<tr onclick="goMachine(\''+m.id+'\')">'
    +'<td class="fl-masz"><span class="fl-ik">'+(jestCiagnik(m)?'🚜':'🔧')+'</span>'
      +'<span class="fl-masz-t"><b>'+esc(m.nazwa)+'</b>'
      +'<span class="fl-sub">'+esc([m.marka,m.rok].filter(Boolean).join(' · ')||'—')+(m.nr_rej?' · '+esc(m.nr_rej):'')+'</span></span></td>'
    +'<td class="k-typ">'+esc(m.typ||'—')+'</td>'
    +'<td>'+kropka(m)+'</td>'
    +'<td class="k-praca">'+pracaHtml(m)+'</td>'
    +'<td class="k-mth"><b>'+(m.mth?fmt(m.mth):'—')+'</b>'+(m.mth?'<span class="fl-sub">mth</span>':'')+'</td>'
    +'<td class="k-serwis">'+serwisHtml(m)+'</td>'
    +'<td class="k-oc">'+terminHtml(m.oc)+'</td>'
    +'<td class="k-bad">'+terminHtml(m.badanie)+'</td>'
    +'<td class="k-akcje">'+menuMaszyny(m)+'</td>'
    +'</tr>').join('');

  return '<div class="fl-wrap"><div class="fl-tab-wrap"><table class="fl-tab">'
    +'<thead><tr><th>Maszyna</th><th class="k-typ">Typ</th><th>Status</th>'
    +'<th class="k-praca">Aktualna praca</th><th class="k-mth">MTH</th>'
    +'<th class="k-serwis">Serwis</th><th class="k-oc">OC</th><th class="k-bad">Badanie</th><th class="k-akcje"></th>'
    +'</tr></thead><tbody>'+wiersze+'</tbody></table></div></div>';
}


/* Kolumna „Aktualna praca" — czytana z zadania, nie z pola w maszynie.
   Nazwa pracownika i pola są linkami: z Floty wchodzi się wprost w Grafik i w kartę pola. */
function pracaHtml(m){
  const z=aktywneZadanieMaszyny(m.id);
  if(!z) return '<span class="fl-pusto">—</span>';
  const w=workerById(z.workerId), p=z.poleId?poleById(z.poleId):null;
  const trwa=zadanieTrwa(z);
  return '<span class="fl-praca'+(trwa?' trwa':'')+'" onclick="event.stopPropagation();idzDoZadania(\''+z.id+'\')">'
      +esc(z.zadanie||'Zadanie')+(z.od?' <span class="fl-sub2">'+esc(z.od)+(z.do?'–'+esc(z.do):'')+'</span>':'')+'</span>'
    +'<span class="fl-sub">'
      +(p?'<a class="fl-link" onclick="event.stopPropagation();idzDoPola(\''+p.id+'\')">'+esc(p.nazwa)+'</a>':'—')
      +(w?' · <a class="fl-link" onclick="event.stopPropagation();pokazPracownika(\''+w.id+'\')">'+esc(w.imie)+'</a>':'')
    +'</span>';
}

/* Menu akcji. Pozycje niedostępne są WYSZARZONE, nie ukryte — inaczej menu zmieniałoby
   kształt przy każdej maszynie i trudno byłoby trafić w tę samą pozycję. */
function menuMaszyny(m){
  const z=aktywneZadanieMaszyny(m.id);
  const naMapie = z && z.poleId && (()=>{ const f=poleById(z.poleId); return f&&f.geo&&(f.geo.polygon||[]).length; })();
  return '<div class="fl-menu">'
    +'<button class="btn small" onclick="event.stopPropagation();goMachine(\''+m.id+'\')">Szczegóły</button>'
    +'<button class="fl-kropki" onclick="event.stopPropagation();przelaczMenu(this)" title="Więcej">⋯</button>'
    +'<div class="fl-menu-lista">'
      +'<button onclick="event.stopPropagation();zamknijMenu();goMachine(\''+m.id+'\')">Szczegóły</button>'
      +(z?'<button onclick="event.stopPropagation();zamknijMenu();idzDoZadania(\''+z.id+'\')">Pokaż aktualne zadanie</button>'
         :'<button disabled title="Ta maszyna nie ma dziś zadania">Pokaż aktualne zadanie</button>')
      +(naMapie?'<button onclick="event.stopPropagation();zamknijMenu();pokazNaMapie(\''+m.id+'\')">Pokaż na mapie</button>'
         :'<button disabled title="Brak zadania z polem obrysowanym na mapie">Pokaż na mapie</button>')
      +'<button onclick="event.stopPropagation();zamknijMenu();goMachine(\''+m.id+'\')">Historia prac</button>'
      +'<button onclick="event.stopPropagation();zamknijMenu();openPrzegladForm(\''+m.id+'\')">Dodaj serwis</button>'
      +'<button onclick="event.stopPropagation();zamknijMenu();przypiszZadanie(\''+m.id+'\')">+ Przypisz zadanie</button>'
      +'<button onclick="event.stopPropagation();zamknijMenu();zadanieWarsztatowe(\''+m.id+'\')">+ Zadanie warsztatowe</button>'
    +'</div></div>';
}
function zamknijMenu(){ document.querySelectorAll('.fl-menu.otw').forEach(x=>x.classList.remove('otw')); }
function przelaczMenu(btn){
  const menu=btn.closest('.fl-menu'), bylo=menu.classList.contains('otw');
  zamknijMenu(); if(!bylo) menu.classList.add('otw');
}
document.addEventListener('click',e=>{ if(!e.target.closest('.fl-menu')) zamknijMenu(); });

/* Szybkie przypisanie zadania prosto z Floty — ciągnik (albo narzędzie) już wybrany.
   Trafia do tego samego formularza co Grafik, więc nie ma drugiej ścieżki zapisu. */
function przypiszZadanie(maszynaId, miejsce){
  if(!state.workers.length){ alert('Najpierw dodaj pracownika w module Grafik.'); return; }
  const m=maszynaById(maszynaId); if(!m) return;
  // Ciągnik idzie w gniazdo pojazdu, reszta w gniazdo narzędzia — patrz maszynyZadania().
  const preset = jestCiagnik(m) ? {ciagnikId:m.id} : {maszynaId:m.id};
  if(miejsce) preset.miejsce=miejsce;
  openZadanieForm(state.workers[0].id, fmtISO(new Date()), null, preset);
}
/* Naprawa/serwis prosto z karty maszyny — ten sam formularz, tylko od razu w wariancie
   warsztatowym i z maszyną wybraną. Zadanie ląduje w grafiku mechanika jak każde inne. */
function zadanieWarsztatowe(maszynaId){ przypiszZadanie(maszynaId,'warsztat'); }

    +'<button class="btn primary" onclick="openMachineForm()">+ Dodaj pierwszą maszynę</button></div>';

  const f=state.ui.flota;

    +'<span><b>'+licz('serwis')+'</b> serwis</span>'
    +'<span><b>'+licz('awaria')+'</b> awaria</span>'
    +(pilne?'<span class="fl-pilne"><b>'+pilne+'</b> wymaga serwisu</span>':'')

  const toolbar='<div class="fl-toolbar">'
    +'<div class="fl-szukaj"><input placeholder="🔍 Szukaj maszyny…" value="'+esc(f.szukaj||'')
      +'" oninput="ustawFlote(\'szukaj\',this.value)"></div>'
    +'<div class="fl-grupa">'+chip('typ','','Wszystkie')+typy.map(t=>chip('typ',t,esc(t))).join('')+'</div>'
    +'<div class="fl-grupa">'+chip('status','','Każdy status')+['pracuje','warsztat','dostępna','serwis','awaria','niedostępna']
      .map(s=>chip('status',s,s==='pracuje'?'W pracy':(s==='warsztat'?'🔧 W warsztacie':esc(s)))).join('')+'</div>'
    +'<div class="fl-grupa fl-prawo">'
      +'<select class="fl-sort" onchange="ustawFlote(\'sort\',this.value)">'
      +'<option value="nazwa"'+(f.sort==='nazwa'?' selected':'')+'>Nazwa</option>'
      +'<option value="serwis"'+(f.sort==='serwis'?' selected':'')+'>Najbliższy serwis</option>'
      +'<option value="mth"'+(f.sort==='mth'?' selected':'')+'>Motogodziny</option></select>'
      +'<button class="fl-chip'+(f.widok==='lista'?' akt':'')+'" onclick="ustawFlote(\'widok\',\'lista\')" title="Lista">☷</button>'
      +'<button class="fl-chip'+(f.widok==='karty'?' akt':'')+'" onclick="ustawFlote(\'widok\',\'karty\')" title="Karty">▦</button>'
    +'</div></div>';

  return head+podsum+toolbar+flotaLista();
}

function saveMachine(id){
  const nazwa=val('m_nazwa').trim(); if(!nazwa){ alert('Podaj nazwę maszyny.'); return; }
  const data={nazwa,typ:val('m_typ'),mth:num(val('m_mth')),marka:val('m_marka').trim(),model:val('m_model').trim(),
    rok:val('m_rok').trim(),nr_rej:val('m_rej').trim(),notatki:val('m_not').trim(),
    // Pola opcjonalne — puste zostają puste, lista pokaże wtedy „—".
    vin:val('m_vin').trim(), status:val('m_status'), interwal:val('m_interwal').trim(),
    oc:val('m_oc'), badanie:val('m_badanie')};
  if(id){ Object.assign(state.machines.find(x=>x.id===id),data); }
  else{ state.machines.push({id:uid(),...data,przeglady:[]}); }
  save(); closeModal(); render();

   MODUŁ: FINANSE
   ========================================================= */
function renderFinanseModule(){
  const cy=String(view.finYear);
  const years=[...new Set(state.finance.map(t=>(t.data||'').slice(0,4)).filter(Boolean))];
  if(!years.includes(cy)) years.push(cy);
  years.sort((a,b)=>b-a);
  const yopts=years.map(y=>`<option value="${y}" ${y===cy?'selected':''}>${y}</option>`).join('');
  const head=naglowekStrony('finanse','Finanse','Koszty i przychody — miesiąc po miesiącu','')+`<div class="module-head">
    <div class="spacer"></div>
    <select class="sel" onchange="view.finYear=+this.value;view.finMonth=null;render()">${yopts}</select>
    <button class="btn primary" onclick="openFinForm()">+ Dodaj wpis</button></div>`;
  const inYear=state.finance.filter(t=>(t.data||'').slice(0,4)===cy);
  const monthCost=Array(12).fill(0), monthInc=Array(12).fill(0);
  inYear.forEach(t=>{ const mi=parseInt((t.data||'').slice(5,7),10)-1; if(mi<0||mi>11)return;
    const v=parseFloat(String(t.kwota||'').replace(',','.'))||0; if(t.typ==='przychod') monthInc[mi]+=v; else monthCost[mi]+=v; });
  const tiles=MIESIACE.map((mn,i)=>`<div class="fin-month ${view.finMonth===i?'active':''}" onclick="view.finMonth=(view.finMonth===${i}?null:${i});render()">
      <div class="m">${mn}</div><div class="v">${monthCost[i]?'-'+fmt(monthCost[i]):'—'}</div>
      ${monthInc[i]?`<div class="v plus">+${fmt(monthInc[i])}</div>`:''}</div>`).join('');
  const catSum={};
  inYear.filter(t=>t.typ!=='przychod').forEach(t=>{ catSum[t.kategoria]=(catSum[t.kategoria]||0)+(parseFloat(String(t.kwota||'').replace(',','.'))||0); });
  const chips=Object.entries(catSum).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
    const c=FIN_CATEGORIES[k]||FIN_CATEGORIES.inne;
    return `<div class="cat-chip"><span class="dot" style="background:${c.color}"></span>${c.label}: <b>${fmt(v)} zł</b></div>`;
  }).join('');
  const totalCost=monthCost.reduce((a,b)=>a+b,0), totalInc=monthInc.reduce((a,b)=>a+b,0);
  let rows=inYear.slice();
  if(view.finMonth!=null) rows=rows.filter(t=>parseInt((t.data||'').slice(5,7),10)-1===view.finMonth);
  rows.sort((a,b)=>(b.data||'').localeCompare(a.data||''));
  const trs=rows.length?rows.map(t=>{
    const c=FIN_CATEGORIES[t.kategoria]||FIN_CATEGORIES.inne; const isInc=t.typ==='przychod';
    return `<tr>
      <td class="num muted">${esc(t.data||'')}</td>
      <td><span class="cat-chip" style="padding:2px 9px;font-size:12px"><span class="dot" style="background:${c.color}"></span>${c.label}</span></td>
      <td>${esc(t.opis||'')}</td>
      <td class="fin-amt ${isInc?'przychod':'koszt'}">${isInc?'+':'−'}${fmt(t.kwota)} zł</td>
      <td style="text-align:right"><button class="x" onclick="delFin('${t.id}')">×</button></td></tr>`;
  }).join(''):`<tr><td colspan="5" class="muted" style="padding:20px">Brak wpisów w tym okresie. Dodaj pierwszy koszt lub przychód.</td></tr>`;
  return head+`
    <div class="mini-stats">
      <div class="mini-stat"><b class="num" style="color:var(--rust)">${fmt(totalCost)} zł</b><span>koszty ${cy}</span></div>
      <div class="mini-stat"><b class="num">${fmt(totalInc)} zł</b><span>przychody ${cy}</span></div>
      <div class="mini-stat"><b class="num" style="color:${totalInc-totalCost>=0?'var(--pole-dark)':'var(--rust)'}">${fmt(totalInc-totalCost)} zł</b><span>saldo</span></div>
    </div>
    <div class="fin-months">${tiles}</div>
    ${chips?`<div class="cat-chips">${chips}</div>`:''}
    ${view.finMonth!=null?`<div class="muted" style="margin-bottom:10px;font-size:13px">Filtr: ${MIESIACE[view.finMonth]} ${cy} · <a href="#" onclick="view.finMonth=null;render();return false" style="color:var(--pole-dark)">pokaż cały rok</a></div>`:''}
    <table class="fin-table"><thead><tr><th>Data</th><th>Kategoria</th><th>Opis</th><th style="text-align:right">Kwota</th><th></th></tr></thead>
      <tbody>${trs}</tbody></table>`;
}
function openFinForm(){
  const cats=Object.entries(FIN_CATEGORIES).map(([k,c])=>`<option value="${k}">${c.label}</option>`).join('');
  openModal(`
    <div class="modal-head"><h3>Nowy wpis</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field row2">
        <div><label>Typ</label><select id="fn_typ"><option value="koszt">Koszt</option><option value="przychod">Przychód</option></select></div>
        <div><label>Data</label><input id="fn_data" type="date" value="${new Date().toISOString().slice(0,10)}"></div>

function saveFin(){

/* =========================================================
   MODUŁ: BYDŁO
   ========================================================= */
function wiek(d){ if(!d) return '—'; const days=Math.floor((Date.now()-new Date(d))/86400000); if(days<0) return '—';
  const y=Math.floor(days/365), mo=Math.floor((days%365)/30); return y>0?`${y} l ${mo} mies`:`${mo} mies`; }
function renderBydloModule(){
  const S=sp();
  if(view.cattleId) return renderCattleDetail();
  const head=naglowekStrony(state.settings.species||'bydlo',S.label,S.sub,'')+`<div class="module-head">
    <div class="spacer"></div><button class="btn primary" onclick="openCattleForm()">+ Dodaj zwierzę</button></div>`;
  if(!state.cattle.length) return head+`<div class="empty-state"><div class="big">Puste stado</div>
    <div style="margin-bottom:16px">Dodaj zwierzęta — z numerami, ${S.breedPl.toLowerCase()} i ${S.birthPl.toLowerCase()}.</div>
    <button class="btn primary" onclick="openCattleForm()">+ Dodaj pierwsze zwierzę</button></div>`;
  const stado=state.cattle.filter(c=>c.status==='na stanie');
  const upcoming=[];
  stado.forEach(c=>{
    const ins=(c.inseminacje||[]).slice().sort((a,b)=>(b.data||'').localeCompare(a.data||''))[0];
    if(ins&&ins.data){
      const due=new Date(ins.data); due.setDate(due.getDate()+S.gest);
      const lastWyc=(c.wycielenia||[]).slice().sort((a,b)=>(b.data||'').localeCompare(a.data||''))[0];
      if(!lastWyc || (lastWyc.data||'')<ins.data) upcoming.push({c,due});
    }
  });
  upcoming.sort((a,b)=>a.due-b.due);
  const upHtml=upcoming.length?`<div class="season" style="margin-bottom:22px"><div class="season-bar" style="background:var(--wheat)"></div>
    <div style="padding:14px 18px"><div class="sb-title" style="margin-bottom:12px">🍼 Spodziewane ${S.birthPl.toLowerCase()}</div>
    ${upcoming.map(u=>{ const days=Math.round((u.due-new Date())/86400000);
      return `<div class="kv"><span>${esc(u.c.kolczyk||'')}${u.c.imie?` · ${esc(u.c.imie)}`:''}</span>
        <b>${u.due.toLocaleDateString('pl-PL')} <span class="muted" style="font-weight:400">(${days>=0?'za '+days+' dni':Math.abs(days)+' dni temu'})</span></b></div>`;
    }).join('')}</div></div>`:'';
  const counts={};
  stado.forEach(c=>{ counts[c.plec]=(counts[c.plec]||0)+1; });
  const sexTiles=S.sexes.slice(0,3).map(sx=>`<div class="mini-stat"><b class="num">${counts[sx]||0}</b><span>${esc(sx)}</span></div>`).join('');
  const stats=`<div class="mini-stats">
    <div class="mini-stat"><b class="num">${stado.length}</b><span>na stanie</span></div>
    ${sexTiles}
  </div>`;
  const rows=state.cattle.slice().sort((a,b)=>(a.status==='na stanie'?0:1)-(b.status==='na stanie'?0:1)).map(c=>{
    const off=c.status!=='na stanie';
    return `<tr data-field onclick="goCattle('${c.id}')" style="${off?'opacity:.5':''}">
      <td class="num"><b>${esc(c.kolczyk||'—')}</b>${c.imie?`<div class="muted" style="font-size:12px">${esc(c.imie)}</div>`:''}</td>
      <td><span class="tag-pill">${esc(c.plec)}</span></td>
      <td>${esc(c.rasa||'—')}</td>
      <td class="num">${wiek(c.data_urodzenia)}</td>
      <td>${off?`<span class="muted">${esc(c.status)}</span>`:'<span style="color:var(--pole-dark)">na stanie</span>'}</td>
      <td class="num muted">${(c.inseminacje||[]).length} ins · ${(c.wycielenia||[]).length} wyc</td>
    </tr>`;
  }).join('');
  return head+stats+upHtml+`<div class="season-wrap"><table class="season-table">
    <thead><tr><th>Kolczyk</th><th>Płeć</th><th>Rasa</th><th>Wiek</th><th>Status</th><th>Zdarzenia</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
function goCattle(id){ view.module='bydlo'; view.cattleId=id; render(); window.scrollTo(0,0); }
function renderCattleDetail(){
  const S=sp();
  const c=state.cattle.find(x=>x.id===view.cattleId);
  if(!c){ view.cattleId=null; return renderBydloModule(); }
  const ins=(c.inseminacje||[]).slice().sort((a,b)=>(b.data||'').localeCompare(a.data||''));

  const insList=ins.length?ins.map(x=>`<div class="zabieg"><div class="z-kind" style="background:#5B8A93"></div>
    <div class="z-main"><div class="z-name">${esc(x.nasienie||S.breed.toLowerCase())}</div><div class="z-sub">${esc(x.data||'')}${x.uwagi?` · ${esc(x.uwagi)}`:''}</div></div>
    <button class="x" onclick="delIns('${c.id}',${(c.inseminacje||[]).indexOf(x)})">×</button></div>`).join(''):`<div class="z-empty">Brak: ${S.breedPl.toLowerCase()}.</div>`;
  const wycList=wyc.length?wyc.map(x=>`<div class="zabieg"><div class="z-kind" style="background:var(--wheat)"></div>
    <div class="z-main"><div class="z-name">${S.birth}${x.cielak?` — ${S.young} ${esc(x.cielak)}`:''}</div><div class="z-sub">${esc(x.data||'')}${x.uwagi?` · ${esc(x.uwagi)}`:''}</div></div>
    <button class="x" onclick="delWyc('${c.id}',${(c.wycielenia||[]).indexOf(x)})">×</button></div>`).join(''):`<div class="z-empty">Brak: ${S.birthPl.toLowerCase()}.</div>`;
  let due='';
  const lastIns=ins[0];
  if(lastIns&&lastIns.data){ const d=new Date(lastIns.data); d.setDate(d.getDate()+S.gest);
    const lastW=wyc[0]; if(!lastW||(lastW.data||'')<lastIns.data){ const days=Math.round((d-new Date())/86400000);
      due=`<div class="geo-note" style="margin-bottom:20px">🍼 Spodziewane ${S.birth.toLowerCase()}: <b>${d.toLocaleDateString('pl-PL')}</b> (${days>=0?'za '+days+' dni':Math.abs(days)+' dni temu'})</div>`; } }
  const off=c.status!=='na stanie';
  return `
    <button class="btn ghost small" onclick="goModule('bydlo')" style="margin-bottom:14px">← ${S.label}</button>
    <div class="detail-head">
      <div><h1>${esc(c.kolczyk||'—')}${c.imie?` · ${esc(c.imie)}`:''}</h1>
        <div class="detail-meta">
          <div><span>Płeć</span><b style="font-family:var(--sans);font-size:14px;color:var(--ink)">${esc(c.plec)}</b></div>
          <div><span>Rasa</span><b style="font-family:var(--sans);font-size:14px;color:var(--ink)">${esc(c.rasa||'—')}</b></div>
          <div><span>Wiek</span><b class="num">${wiek(c.data_urodzenia)}</b></div>
          <div><span>Status</span><b style="font-family:var(--sans);font-size:14px;color:${off?'var(--rust)':'var(--pole-dark)'}">${esc(c.status||'na stanie')}</b></div>
          ${c.matka?`<div><span>Matka</span><b class="num" style="font-size:14px">${esc(c.matka)}</b></div>`:''}
        </div>
      </div>
      <div class="detail-actions">
        <button class="btn small" onclick="openCattleForm('${c.id}')">Edytuj</button>
        ${off?`<button class="btn small" onclick="restoreCattle('${c.id}')">Przywróć na stan</button>`:`<button class="btn small danger" onclick="removeCattle('${c.id}')">Zdejmij ze stanu</button>`}
      </div>
    </div>
    ${due}
    ${c.notatki?`<div class="geo-note" style="background:rgba(200,155,44,.12);border-color:rgba(200,155,44,.35);color:var(--ink);margin-bottom:20px">📝 ${esc(c.notatki)}</div>`:''}
    <div class="sb-grid">
      <div class="season" style="margin:0"><div class="season-bar" style="background:#5B8A93"></div><div style="padding:16px 18px">
        <div class="sb-title">${S.breedPl} <button class="btn small" onclick="openInsForm('${c.id}')">+ Dodaj</button></div>
        <div class="zabieg-list">${insList}</div></div></div>
      <div class="season" style="margin:0"><div class="season-bar" style="background:var(--wheat)"></div><div style="padding:16px 18px">
        <div class="sb-title">${S.birthPl} <button class="btn small" onclick="openWycForm('${c.id}')">+ Dodaj</button></div>
        <div class="zabieg-list">${wycList}</div></div></div>
    </div>`;
}
function openCattleForm(id){
  const c=id?state.cattle.find(x=>x.id===id):null;

function saveCattle(id){

  if(id){ Object.assign(state.cattle.find(x=>x.id===id),data); }
  else{ state.cattle.push({id:uid(),...data,status:'na stanie',inseminacje:[],wycielenia:[]}); }

function removeCattle(id){ const powod=prompt('Powód zdjęcia ze stanu (np. sprzedane, padłe, ubój):','sprzedane'); if(powod===null)return;

/* ⚠️ JEDNA lista modułów — steruje i przełącznikami w Ustawieniach, i pozycjami w menu.
   Dopisanie modułu tutaj wystarczy; `renderSidebar` czyta tę samą listę, więc nie da się

/* Adres → współrzędne przez Nominatim (ten sam serwis, co wyszukiwarka miejscowości).
   ⚠️ Zapisujemy WSPÓŁRZĘDNE, nie sam adres: geokoder bywa niedostępny, a raz znaleziony
   domek ma się rysować także bez internetu. */
async function znajdzSiedzibe(){
  const err=document.getElementById('f_hq_err');
  const adres=val('f_adres').trim(), kod=val('f_kod').trim(), miasto=val('f_miasto').trim();
  state.farm.adres=adres; state.farm.kod=kod; state.farm.miasto=miasto;
  const zapytanie=[adres, kod, miasto].filter(Boolean).join(', ');
  if(!zapytanie){ err.textContent='Wpisz przynajmniej miejscowość.'; return; }
  err.textContent='Szukam…';
  try{
    const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=pl&q='
      +encodeURIComponent(zapytanie));
    const d=await r.json();
    if(!d || !d[0]){ err.textContent='Nie znalazłem tego adresu. Spróbuj samej miejscowości.'; save(); return; }
    state.farm.lat=+d[0].lat; state.farm.lng=+d[0].lon; state.farm.zoom=16;
    save(); render();
  }catch(e){ err.textContent='Wyszukiwanie adresu wymaga internetu.'; save(); }
}
function pokazSiedzibe(){
  if(!maSiedzibe()) return;
  state.ui.mapCenter=[state.farm.lat,state.farm.lng];
  state.ui.mapZoom=state.farm.zoom||16;
  save(); goModule('pulpit');
}
function usunSiedzibe(){
  delete state.farm.lat; delete state.farm.lng; delete state.farm.zoom;
  save(); render();
}

function toggleModule(m){

  // zostałby pusty ekran bez pozycji w menu, którą można by kliknąć.
  if(!modulDostepny(view.module)) view.module='pulpit';
  save(); render();
}

const STATUSY_ZGLOSZEN = {

};

/* Status zgłoszenia WYNIKA ze stanu powiązanego zadania, o ile takie powstało — ta sama
   zasada co przy statusie maszyny. Ręcznie zapisany status zdążyłby skłamać. */
function statusZgloszenia(t){
  if(t.status==='REJECTED') return 'REJECTED';
  const z=t.zadanieId?zadanieById(t.zadanieId):null;
  if(!z) return t.status==='PLANNED' ? 'NEW' : (t.status||'NEW');   // zadanie skasowane → wraca do kolejki
  if(z.status==='wykonane')  return 'DONE';
  if(z.status==='anulowane') return 'NEW';
  if(z.status==='rozpoczete')return 'IN_PROGRESS';
  return 'PLANNED';
}

   Wewnątrz aplikacji, bez maila i WhatsAppa — te wymagają serwera i zgody użytkownika,
   a powiadomienie w aplikacji działa od razu i niczego nie wysyła na zewnątrz.
   `workerId === null` znaczy „dla administratora". */
function createNotification(workerId, typ, tytul, tresc, ref){
  state.powiadomienia = state.powiadomienia || [];
  state.powiadomienia.unshift(Object.assign(
    {id:uid(), workerId:workerId||null, typ, tytul, tresc:tresc||'', kiedy:new Date().toISOString(), przeczytane:false},
    ref||{}));
  if(state.powiadomienia.length>200) state.powiadomienia.length=200;   // to dziennik, nie archiwum
}
function nieprzeczytane(workerId){
  return (state.powiadomienia||[]).filter(p=>!p.przeczytane && (workerId===undefined || p.workerId===workerId));
}
/* Kto wykonuje operację — do audytu. W trybie pracownika to jego konto, inaczej właściciel. */
function ktoTeraz(){
  if(trybPracownika && trybPracownika.workerId){
    const w=workerById(trybPracownika.workerId);
    return {workerId:w?w.id:null, kto:w?w.imie:(currentEmail||'pracownik')};
  }
  return {workerId:null, kto:currentEmail||'administrator'};
}
