  .op-chipy{display:flex;gap:5px;flex-wrap:wrap;padding:0 2px 10px;margin-bottom:4px;
    border-bottom:1px solid var(--line)}
  .op-chipy .gr-chip{padding:4px 9px;font-size:11.5px}
  .op-grupa{font-size:10.5px;font-weight:800;letter-spacing:.06em;color:var(--ink-soft);
    padding:9px 3px 3px;text-transform:uppercase}
  .op-grupa:first-child{padding-top:2px}

  /* ═══ Pracownicy, zgłoszenia, powiadomienia ═════════════════════════════════ */
  .pr-tab tbody tr{cursor:pointer}
  .pr-nieakt{opacity:.5}
  .pr-osoba{display:flex;align-items:center;gap:10px}
  .pr-txt{display:flex;flex-direction:column;line-height:1.3;min-width:0}
  .pr-txt b{font-size:13.5px}
  .pr-sub{font-size:11.5px;color:var(--ink-soft)}
  .pr-ranga{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
  .pr-ranga.r-adm{background:#EAF0F7;color:#2F5C99}
  .pr-ranga.r-graf{background:#FDF3DF;color:#8A6A22}
  .pr-ranga.r-prac{background:var(--line2);color:var(--ink-soft)}
  .pr-stan{font-size:12.5px;font-weight:600;white-space:nowrap}
  .pr-karta-uklad{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px;align-items:start}
  .pr-kol{display:flex;flex-direction:column;gap:14px;min-width:0}
  .pr-blok{background:#fff;border:1px solid var(--line-strong);border-radius:8px;
    box-shadow:var(--shadow);padding:14px 16px}
  .pr-blok-tyt{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:var(--ink-soft);margin-bottom:10px}
  .upr-grupa{margin-bottom:14px}
  .upr-tyt{font-size:12.5px;font-weight:700;color:var(--ink);margin-bottom:6px}
  .upr-w{display:flex;align-items:center;gap:9px;padding:5px 2px;font-size:13px;cursor:pointer}
  .upr-w.zablokowane{opacity:.55;cursor:not-allowed}
  .upr-w input{width:16px;height:16px;accent-color:var(--pole);flex-shrink:0}

  /* Zgłoszenia */
  .zg-w{background:#fff;border:1px solid var(--line-strong);border-radius:8px;
    box-shadow:var(--shadow);padding:12px 14px;margin-bottom:9px}
  .zg-w.st-REJECTED,.zg-w.st-DONE{opacity:.62}
  .zg-glowna{display:flex;align-items:flex-start;gap:12px}
  .zg-st{font-size:14px;flex-shrink:0}
  .zg-st.duzy{font-size:19px;line-height:1.1}
  .zg-tresc{flex:1;min-width:0}
  .zg-tyt{font-size:14px;font-weight:600;color:var(--ink);line-height:1.35}
  .zg-szcz{font-size:12.5px;color:var(--ink-soft);margin-top:3px}
  .zg-slad{font-size:11.5px;color:var(--ink-soft);margin-top:5px;opacity:.85}
  .zg-etyk{font-size:11px;font-weight:700;border:1px solid;border-radius:99px;
    padding:2px 9px;white-space:nowrap;flex-shrink:0}
  .zg-akcje{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;padding-left:31px}
  .zg-mini{display:flex;align-items:center;gap:10px;padding:7px 3px;border-top:1px solid var(--line);cursor:pointer}
  .zg-mini:first-of-type{border-top:none}
  .zg-mini:hover{background:#F7F8F8}

  /* Skrzynka powiadomień */
  .pw-w{display:flex;gap:11px;padding:10px 8px;border-radius:8px;align-items:flex-start;cursor:pointer}
  .pw-w:hover{background:#F7F8F8}
  .pw-w.nowe{background:#F2F5F1}
  .pw-ik{font-size:17px;flex-shrink:0}
  .pw-kiedy{font-size:11px;color:var(--ink-soft);margin-top:2px}

  @media(max-width:1000px){ .pr-karta-uklad{grid-template-columns:1fr} }
  @media(max-width:760px){ .zg-akcje{padding-left:0} .zg-akcje .btn{flex:1;justify-content:center} }

  .pr-ikona{position:relative;background:rgba(255,255,255,.14);border:none;color:#fff;
    border-radius:8px;padding:8px 12px;font-family:var(--sans);font-size:14px;font-weight:600;cursor:pointer}
  .pr-ikona:hover{background:rgba(255,255,255,.24)}
  .pr-badge{position:absolute;top:2px;right:2px;background:#D9534F;color:#fff;border-radius:99px;
    min-width:16px;height:16px;font-size:10px;font-weight:700;display:flex;align-items:center;
    justify-content:center;padding:0 4px}
  .pr-zgl{background:#fff;border:1px solid var(--line-strong);border-radius:10px;padding:6px 14px;margin-top:8px}

  /* ═══ Skup / obrót zbożem ═══════════════════════════════════════════════════
     Moduł operacyjny: gęste tabele, duże liczby, żadnych wielkich kafli z pustką. */
  .skup-nav{display:flex;gap:2px;border-bottom:1px solid var(--color-border);margin-bottom:16px;
    overflow-x:auto;scrollbar-width:none}
  .skup-nav::-webkit-scrollbar{display:none}
  .sn-tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 15px;
    cursor:pointer;font-family:var(--sans);font-size:13.5px;color:var(--color-text-muted);
    white-space:nowrap;margin-bottom:-1px}
  .sn-tab:hover{color:var(--color-text)}
  .sn-tab.akt{color:var(--color-primary);border-bottom-color:var(--color-primary);font-weight:600}

  .skup-kafle{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
  .skup-kafel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:8px;
    padding:11px 14px;box-shadow:var(--shadow)}
  .skup-kafel[onclick]{cursor:pointer}
  .skup-kafel[onclick]:hover{border-color:var(--color-primary)}
  .sk-w{font-size:21px;font-weight:700;color:var(--color-text);line-height:1.15;
    font-variant-numeric:tabular-nums}
  .sk-e{font-size:11.5px;color:var(--color-text-muted);margin-top:2px}

  .skup-dzis{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;background:var(--color-surface);
    border:1px solid var(--color-border);border-radius:8px;padding:11px 16px;margin-bottom:12px}
  .sd-tyt{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-muted)}
  .sd-poz{font-size:12px;color:var(--color-text-muted)}
  .sd-poz b{font-size:16px;color:var(--color-text);margin-right:5px;font-variant-numeric:tabular-nums}

  .skup-szukaj{margin-bottom:10px}
  .skup-szukaj input{width:100%;max-width:520px;padding:9px 12px;border:1px solid var(--color-border);
    border-radius:8px;background:var(--color-surface);font-family:var(--sans);font-size:13.5px}
  .skup-szukaj input:focus{outline:none;border-color:var(--color-primary)}

  /* Tabele: wąskie wiersze, liczby prawym marginesem, tabelaryczne cyfry — kolumna ton
     ma się dać czytać w pionie bez wodzenia palcem. */
  .skup-tab td,.skup-tab th{padding:7px 10px;font-size:13px}
  .skup-tab .lc{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  .skup-tab tfoot td{border-top:2px solid var(--color-border);font-weight:600;
    background:var(--color-surface-2)}
  .skup-tab .rej{font-family:var(--mono);letter-spacing:.02em}
  .wiersz-anulowany{opacity:.45;text-decoration:line-through}
  .wiersz-anulowany .btn,.wiersz-anulowany .zg-etyk{text-decoration:none}
  .saldo{font-size:12.5px;font-weight:600;white-space:nowrap}
  .sk-typ{font-size:11px;font-weight:700;border-radius:3px;padding:1px 6px}
  .sk-typ.p{background:var(--color-success-soft);color:var(--color-success)}
  .sk-typ.z{background:var(--color-info-soft);color:var(--color-info)}

  .postep{height:5px;background:var(--color-neutral-soft);border-radius:3px;overflow:hidden;min-width:70px}
  .postep-w{height:100%;background:var(--color-accent)}

  .skup-saldo{display:flex;gap:22px;flex-wrap:wrap;align-items:center;background:var(--color-surface);
    border:1px solid var(--color-border);border-left:4px solid var(--color-primary);
    border-radius:8px;padding:14px 18px}
  .ss-l{display:flex;flex-direction:column;min-width:180px}
  .ss-et{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-muted)}
  .ss-kw{font-size:15px;font-weight:600;margin-top:2px}
  .ss-kw2{font-size:24px;font-weight:700;color:var(--color-text);font-variant-numeric:tabular-nums}
  .ss-r{display:flex;gap:20px;flex-wrap:wrap}
  .ss-r span{font-size:11.5px;color:var(--color-text-muted);display:flex;flex-direction:column}
  .ss-r b{font-size:15px;color:var(--color-text);font-variant-numeric:tabular-nums}

  .skup-blad{background:var(--color-danger-soft);border:1px solid var(--color-danger);
    border-radius:8px;padding:16px 18px;font-size:13.5px;color:var(--color-text)}
  .skup-blad b{display:block;margin-bottom:6px;font-size:15px}
  .skup-info{background:var(--color-info-soft);border:1px solid var(--color-info);border-radius:8px;
    padding:11px 15px;font-size:12.5px;margin-bottom:14px}
  .skup-pusto,.skup-pusto2{color:var(--color-text-muted);font-size:13px;padding:14px 4px}

  /* Formularze wagowe: duże pola liczbowe, bo wpisuje się je w rękawicach i w słońcu. */
  .skup-form .duze{font-size:20px;font-weight:600;padding:10px 12px;font-variant-numeric:tabular-nums}
  .skup-podsum{display:flex;gap:18px;flex-wrap:wrap;background:var(--color-primary-soft);
    border-radius:8px;padding:10px 14px;margin:4px 0 12px}
  .skup-podsum span{font-size:11.5px;color:var(--color-text-muted);display:flex;flex-direction:column}
  .skup-podsum b{font-size:16px;color:var(--color-primary-hover);font-variant-numeric:tabular-nums}

  .toast-akcja{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;z-index:9998;
    background:var(--color-dark);color:var(--color-text-invert);padding:10px 12px 10px 18px;
    border-radius:8px;font-size:13px;box-shadow:var(--shadow-lift);display:flex;align-items:center;
    gap:14px;max-width:92vw}
  .toast-akcja button{background:var(--color-accent);color:#1F2A2E;border:none;border-radius:6px;
    padding:7px 13px;font-family:var(--sans);font-size:12.5px;font-weight:600;cursor:pointer}

  @media(max-width:760px){
    .skup-kafle{grid-template-columns:repeat(2,minmax(0,1fr))}
    .ss-l{min-width:0;width:100%}
    .skup-form .duze{font-size:22px}
    .toast-akcja{left:12px;right:12px;transform:none;max-width:none;justify-content:space-between}
  }

  /* ═══ Ikony menu ════════════════════════════════════════════════════════════
     Rysunek liniowy w kolorze modułu. Wygaszone, dopóki pozycja nie jest aktywna —
     dziesięć nasyconych kolorów naraz męczy oko i nic nie wyróżnia. */
  .sb-svg{width:22px;height:22px;display:block}
  .sb-item .ic{color:var(--mk,#A7B3B7);opacity:.72;transition:opacity .12s}
  .sb-item:hover .ic{opacity:1}
  .sb-item.active .ic{opacity:1}
  /* Pasek stanu aktywnego bierze kolor modułu — ten sam, co jego ikona. */
  .sb-item.active::before{background:var(--mk,var(--color-accent))}
  .sb-item.active .sb-count{background:rgba(197,138,58,.18);color:var(--color-accent)}

  .set-l{display:flex;align-items:center;gap:12px;min-width:0}
  .set-ik{flex-shrink:0;display:block}
  .set-ik .sb-svg{width:22px;height:22px}

  /* Siedziba gospodarstwa na mapie — grafit ze złotą obwódką. Świadomie inny kształt
     i kolor niż znacznik maszyny (biały krążek), żeby nie mylić stałego punktu z ruchomym. */
  .hq-marker{background:none;border:none}
  .hq-pin{width:38px;height:38px;border-radius:10px;background:var(--color-dark);
    border:2px solid var(--color-accent);display:flex;align-items:center;justify-content:center;
    font-size:18px;box-shadow:0 3px 10px rgba(0,0,0,.4);cursor:pointer}
  .set-hq{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:6px}
  .hq-ok{font-size:12.5px;color:var(--color-success);font-weight:600;display:flex;
    align-items:baseline;gap:8px}
  .hq-ok .mono{font-family:var(--mono);font-weight:400;color:var(--color-text-muted);font-size:11.5px}

  .kas-lista{background:var(--color-danger-soft);border:1px solid var(--color-danger);
    border-radius:8px;padding:12px 15px}
  .kas-tyt{font-size:10.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
    color:var(--color-danger);margin-bottom:8px}
  .kas-w{display:flex;align-items:baseline;gap:9px;padding:3px 0;font-size:13px}
  .kas-w b{font-size:16px;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
  .kas-uwaga{font-size:12.5px;color:var(--color-text-muted);margin-top:12px;line-height:1.5}

  /* ═══ Ikony upraw ═══════════════════════════════════════════════════════════
     Jeden rozmiar bazowy, jeden układ „ikona + podpis". */
  .crop-ic{display:block;flex-shrink:0}
  .crop-lbl{display:flex;align-items:center;gap:8px;min-width:0}
  .crop-lbl>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .crop-swatch{width:11px;height:11px;border-radius:3px;flex-shrink:0;display:inline-block}

  /* ═══ Komponenty wspólne (kroki 5–6 redesignu) ══════════════════════════════ */
  /* Nagłówek strony — jeden układ dla wszystkich modułów. */
  .page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;
    flex-wrap:wrap;margin-bottom:18px}
  .ph-l{display:flex;align-items:center;gap:13px;min-width:0}
  .ph-ic{width:40px;height:40px;border-radius:var(--radius-md);background:var(--primary-soft);
    color:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .ph-ic svg{width:21px;height:21px}
  .page-head h1{font-size:29px;font-weight:700;margin:0;letter-spacing:-.02em;line-height:1.15}
  .ph-sub{font-size:13.5px;color:var(--color-text-muted);margin-top:2px}
  .ph-akcje{display:flex;gap:8px;flex-wrap:wrap}

  /* Karty statystyk — niskie i zwarte, nie kafle dashboardu. */
  .stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:18px}
  .stat-b{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    padding:18px 20px;display:flex;align-items:center;gap:16px;box-shadow:var(--shadow-sm);min-height:106px}
  .stat-b .si{width:48px;height:48px;border-radius:var(--radius-md);display:flex;align-items:center;
    justify-content:center;flex-shrink:0}
  .stat-b .si svg{width:24px;height:24px}
  .stat-b>span:last-child{display:flex;flex-direction:column;min-width:0}
  .stat-t{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--color-text-muted);line-height:1.3}
  .stat-v{font-size:30px;font-weight:700;color:var(--color-text);line-height:1.1;
    font-variant-numeric:tabular-nums;margin-top:4px;letter-spacing:-.02em}

  /* Toolbar filtrów — jeden pasek nad tabelą. */
  .tbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
  .tbar .szuk{position:relative;flex:1;min-width:210px;max-width:340px}
  .tbar .szuk input{width:100%;height:38px;padding:0 12px 0 34px;border:1px solid var(--border);
    border-radius:var(--radius-sm);background:var(--surface);font-family:var(--sans);font-size:13.5px}
  .tbar .szuk svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;color:var(--color-text-muted);pointer-events:none}
  .tbar select{height:38px;padding:0 30px 0 11px;border:1px solid var(--border);
    border-radius:var(--radius-sm);background:var(--surface);font-family:var(--sans);font-size:13.5px;
    color:var(--color-text);cursor:pointer}
  .tbar input:focus,.tbar select:focus{outline:none;border-color:var(--primary);
    box-shadow:0 0 0 3px var(--primary-soft)}
  .tbar-r{margin-left:auto;display:flex;gap:6px}

  /* ═══ Tabele ════════════════════════════════════════════════════════════════
     Bez ramek wokół każdej komórki — same poziome separatory. Nagłówek jasny,
     wiersze wysokie na tyle, żeby zmieścić ikonę i dwie linie tekstu. */
  .tab-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    overflow:auto;box-shadow:var(--shadow-sm)}
  table.tab{width:100%;border-collapse:collapse;font-size:13.5px}
  table.tab thead th{background:var(--surface-secondary);text-align:left;padding:11px 14px;
    font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--color-text-muted);border-bottom:1px solid var(--border);white-space:nowrap;
    position:sticky;top:0;z-index:2}
  table.tab tbody td{padding:12px 14px;border-bottom:1px solid var(--border-light);vertical-align:middle}
  table.tab tbody tr:last-child td{border-bottom:none}
  table.tab tbody tr:hover{background:var(--surface-secondary)}
  table.tab tbody tr.klik{cursor:pointer}
  table.tab .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
  table.tab tfoot td{padding:11px 14px;background:var(--surface-secondary);font-weight:600;
    border-top:1px solid var(--border)}
  .t-glowna{font-weight:600;color:var(--color-text)}
  .t-pod{display:block;font-size:12px;color:var(--color-text-muted);margin-top:2px}

  /* Miniatura obrysu pola — rysowana z geometrii, bez generowania obrazków. */
  .pole-mini{width:64px;height:42px;border-radius:var(--radius-sm);background:var(--primary-soft);
    border:1px solid var(--border);flex-shrink:0;overflow:hidden}
  .pole-mini svg{display:block;width:100%;height:100%}

  /* Legenda upraw pod tabelą. */
  .legenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;padding:12px 15px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md)}
  .legenda .lg-t{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
    color:var(--color-text-muted);width:100%}
  .lg-p{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--color-text)}

  /* Pusty stan — mały, nie na pół ekranu. */
  .pusto{background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius-md);
    padding:34px 24px;text-align:center}
  .pusto .pi{width:44px;height:44px;margin:0 auto 12px;border-radius:var(--radius-md);
    background:var(--primary-soft);color:var(--primary);display:flex;align-items:center;justify-content:center}
  .pusto .pi svg{width:22px;height:22px}
  .pusto b{display:block;font-size:15px;margin-bottom:5px}
  .pusto span{font-size:13px;color:var(--color-text-muted)}
  .pusto .btn{margin-top:14px}

  @media(max-width:760px){
    .page-head h1{font-size:23px}
    .stat-row{grid-template-columns:repeat(2,minmax(0,1fr))}
    .stat-b{min-height:88px;padding:13px 14px;gap:12px}
    .stat-b .si{width:40px;height:40px}
    .stat-v{font-size:24px}
    .tbar .szuk{max-width:none}
    .tbar-r{margin-left:0;width:100%}
  }

  .pole-cell{display:flex;align-items:center;gap:12px;min-width:0}
  .pole-cell>span{display:flex;flex-direction:column;min-width:0}
  .pole-mini.pusta{background:repeating-linear-gradient(45deg,#EEF1EE 0 6px,#F6F7F5 6px 12px)}
  @media(max-width:900px){ .pole-mini{display:none} }

  /* ═══ TOPBAR — jasny ════════════════════════════════════════════════════════
     ⚠️ Ciemny jest WYŁĄCZNIE sidebar. Dwa ciemne pasy stykające się pod kątem prostym
     zamykały obszar roboczy w ramce; jasny topbar oddaje treści całą górę ekranu. */
  .navbar{height:52px;background:var(--surface);color:var(--color-text);
    border-bottom:1px solid var(--border);padding:0 16px;gap:12px;box-shadow:none}
  .nav-logo{gap:8px;font-size:16.5px;font-weight:700;color:var(--color-text);letter-spacing:-.01em}
  .nl-ic{color:var(--primary);display:flex}
  .nl-ic svg{width:22px;height:22px}
  .nav-logo .mark,.nav-logo .tag{display:none}

  .nav-szukaj{position:relative;flex:1;max-width:430px;margin-left:8px}
  .nav-szukaj>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
    width:16px;height:16px;color:var(--color-text-muted);pointer-events:none}
  .nav-szukaj input{width:100%;height:34px;padding:0 58px 0 34px;border:1px solid var(--border);
    border-radius:var(--radius-sm);background:var(--app-bg);font-family:var(--sans);
    font-size:13px;color:var(--color-text)}
  .nav-szukaj input::placeholder{color:var(--color-text-muted)}
  .nav-szukaj input:focus{outline:none;border-color:var(--primary);background:var(--surface);
    box-shadow:0 0 0 3px var(--primary-soft)}
  .nav-szukaj kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);
    font-family:var(--sans);font-size:10.5px;font-weight:600;color:var(--color-text-muted);
    background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 6px;
    pointer-events:none}
  .nav-wyniki{display:none;position:absolute;left:0;right:0;top:40px;z-index:2000;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);
    box-shadow:var(--shadow-md);max-height:66vh;overflow:auto;padding:5px}
  .nav-wyniki.on{display:block}
  .nw-p{display:flex;align-items:center;gap:11px;width:100%;background:none;border:none;
    padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;text-align:left;font-family:var(--sans)}
  .nw-p:hover{background:var(--app-bg)}
  .nw-ik{color:var(--color-text-muted);display:flex;flex-shrink:0}
  .nw-ik svg{width:18px;height:18px}
  .nw-p>span:last-child{display:flex;flex-direction:column;min-width:0}
  .nw-p b{font-size:13.5px;font-weight:600;color:var(--color-text)}
  .nw-p b+span{font-size:12px;color:var(--color-text-muted)}
  .nw-brak{padding:14px 12px;font-size:13px;color:var(--color-text-muted)}

  .navbar .nav-season{background:var(--surface);border:1px solid var(--border);color:var(--color-text);
    border-radius:var(--radius-sm);height:34px}
  .navbar .nav-season select{color:var(--color-text);font-weight:600;font-size:13px}
  .navbar .nav-icon{color:var(--color-text-muted);position:relative}
  .navbar .nav-icon:hover{color:var(--color-text);background:var(--app-bg)}
  .nav-kropka{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;
    background:var(--color-danger);border:1.5px solid var(--surface)}
  .navbar .nav-user{display:none}

  /* ═══ Stopka sidebara ══════════════════════════════════════════════════════ */
  .sb-wer{font-size:10.5px;color:#6C7B80;display:flex;justify-content:space-between;gap:8px;padding:0 4px}
  .sb-user{display:flex;align-items:center;gap:9px;padding:8px 4px;border-top:1px solid rgba(255,255,255,.08);
    border-bottom:1px solid rgba(255,255,255,.08)}
  .sb-av{width:29px;height:29px;border-radius:50%;background:var(--primary);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;flex-shrink:0}
  .sb-ut{display:flex;flex-direction:column;min-width:0;flex:1;line-height:1.3}
  .sb-ut b{font-size:12px;font-weight:600;color:#E4EAE7;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sb-ut>span{font-size:10.5px;color:#7C8A8E}
  .sb-wyj{background:none;border:none;color:#7C8A8E;cursor:pointer;padding:4px;flex-shrink:0}
  .sb-wyj:hover{color:var(--accent)}

  /* ═══ Kafle statystyk — trzecia linia z kontekstem ══════════════════════════
     Sama liczba mówi mniej niż liczba z odniesieniem: „42,5 ha" plus „średnio 14,2 ha". */
  .stat-s{font-size:11.5px;color:var(--color-text-muted);margin-top:3px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* ═══ Line-art gospodarstwa ════════════════════════════════════════════════
     Subtelny znak firmowy na dole ekranów bez gęstych danych. ⚠️ Bardzo niska
     widoczność i pointer-events:none — nie może przeszkadzać w pracy ani łapać kliknięć. */
  .farm-art{margin-top:26px;padding-top:10px;border-top:1px solid var(--border-light);
    display:flex;align-items:flex-end;justify-content:space-between;gap:16px;pointer-events:none}
  .farm-art svg{width:100%;max-width:640px;height:64px;opacity:.13;color:var(--color-text)}
  .farm-art .fa-t{font-size:12px;color:var(--color-text-muted);opacity:.85;white-space:nowrap;
    display:flex;align-items:center;gap:7px;padding-bottom:4px}
  .farm-art .fa-t svg{width:15px;height:15px;opacity:1;color:var(--primary)}
  @media(max-width:900px){ .farm-art{display:none} }

  .kol-zazn{width:38px;cursor:pointer;text-align:center}
  .ptak{display:inline-block;width:16px;height:16px;border:1.5px solid var(--border);
    border-radius:4px;background:var(--surface);vertical-align:middle;position:relative}
  .ptak.on{background:var(--primary);border-color:var(--primary)}
  .ptak.on::after{content:'';position:absolute;left:4.5px;top:1.5px;width:4px;height:8px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(43deg)}
  table.tab tbody tr.zazn{background:var(--primary-soft)}
  .brak{color:var(--color-text-muted);font-style:italic;font-size:12.5px}
  .t-pod.odm{margin-left:28px}
  .kropki{width:30px;height:28px;border:1px solid var(--border);background:var(--surface);
    border-radius:var(--radius-sm);cursor:pointer;font-size:15px;line-height:1;
    color:var(--color-text-muted);font-family:var(--sans)}
  .kropki:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
  .kropki:disabled{opacity:.4;cursor:not-allowed}
  .pola-menu{position:absolute;right:14px;z-index:70;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);
    padding:5px;min-width:190px;text-align:left}
  .pola-menu button{display:block;width:100%;text-align:left;background:none;border:none;
    padding:8px 10px;border-radius:var(--radius-sm);font-family:var(--sans);font-size:13px;
    color:var(--color-text);cursor:pointer}
  .pola-menu button:hover{background:var(--app-bg);color:var(--primary)}
  table.tab td{position:relative}

  .tab-stopka{display:flex;align-items:center;justify-content:space-between;gap:16px;
    flex-wrap:wrap;margin-top:10px;padding:10px 14px;background:var(--surface);
    border:1px solid var(--border);border-radius:var(--radius-md)}
  .ts-leg{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
  .lg-t2{font-size:12px;font-weight:600;color:var(--color-text-muted)}
  .ts-str{display:flex;align-items:center;gap:9px;font-size:12.5px;white-space:nowrap}
  .ts-str select{height:30px;border:1px solid var(--border);border-radius:var(--radius-sm);
    background:var(--surface);font-family:var(--sans);font-size:12.5px;padding:0 6px}
  @media(max-width:900px){ .tab-stopka{flex-direction:column;align-items:flex-start} }

  /* ═══ Topbar na telefonie ═══════════════════════════════════════════════════
     ⚠️ Wyszukiwarka, wybór sezonu, dzwonek i wylogowanie nie mieszczą się obok siebie
     na 390 px — razem wypychały stronę w bok. Na wąskim ekranie pole wyszukiwania
     zwija się do samej lupy, a rozwija po kliknięciu. */
  @media(max-width:760px){
    .navbar{padding:0 10px;gap:7px}
    .nav-logo .nl-t{display:none}
    .nav-szukaj{flex:0 0 auto;max-width:none;margin-left:0}
    .nav-szukaj input{width:36px;padding:0 0 0 30px;cursor:pointer;
      transition:width .18s;background:transparent;border-color:transparent}
    .nav-szukaj input:focus{width:min(62vw,240px);background:var(--surface);border-color:var(--primary);padding-right:10px}
    .nav-szukaj kbd{display:none}
    .nav-wyniki{position:fixed;left:8px;right:8px;top:56px}
    .navbar .nav-season{height:32px;padding:0 4px}
    .navbar .nav-season select{max-width:88px;font-size:12px}
    .navbar .nav-season svg{display:none}
    .stat-row{gap:9px}
    .tab-wrap{border-radius:var(--radius-sm)}
  }
  /* Tabele na wąskim ekranie: przewijanie w POZIOMIE wewnątrz ramki, nie całej strony. */
  @media(max-width:900px){
    .tab-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
    table.tab{min-width:640px}
  }

  /* Finanse: tabela ma własną klasę sprzed redesignu i nie łapała reguły .tab-wrap.
     Na telefonie przewija się teraz w swojej ramce, a nie całą stroną. */
  @media(max-width:900px){
    .fin-table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}
    .fin-table>thead,.fin-table>tbody{display:table;width:100%;min-width:520px}
  }

  .pole-mini.pusta{display:flex;align-items:center;justify-content:center;cursor:pointer;
    border-style:dashed;background:var(--app-bg)}
  .pole-mini.pusta span{font-size:10.5px;font-weight:600;color:var(--color-text-muted)}
  .pole-mini.pusta:hover{border-color:var(--primary);background:var(--primary-soft)}
  .pole-mini.pusta:hover span{color:var(--primary)}

  /* ═══ Panel warstw mapy ════════════════════════════════════════════════════ */
  .mapa-warstwy{background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:7px;font-family:var(--sans);
    min-width:150px}
  .mw-grupa{display:flex;gap:0;border:1px solid var(--border);border-radius:var(--radius-sm);
    overflow:hidden;margin-bottom:6px}
  .mw-b{flex:1;padding:6px 8px;background:var(--surface);border:none;cursor:pointer;
    font-family:var(--sans);font-size:12px;color:var(--color-text-muted)}
  .mw-b+.mw-b{border-left:1px solid var(--border)}
  .mw-b.akt{background:var(--primary);color:#fff;font-weight:600}
  .mw-chk{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--color-text);
    cursor:pointer;padding:3px 2px}
  .mw-chk input{width:15px;height:15px;accent-color:var(--primary);cursor:pointer}
  .mw-info{font-size:10.5px;color:var(--color-text-muted);padding:3px 2px 0;line-height:1.3}
  .mw-info.ukryte{display:none}
  @media(max-width:760px){ .mapa-warstwy{min-width:126px;padding:5px} .mw-b{font-size:11px;padding:5px 6px} }

  /* ═══ Czytelność granic działek ════════════════════════════════════════════
     GUGiK rysuje miedze cienką, jasnoniebieską kreską — na zdjęciu satelitarnym ginie.
     Serwisu nie da się poprosić o inny styl, więc wzmacniamy kafle w przeglądarce:
     mocny kontrast wyciąga linię, nasycenie i przesunięcie odcienia robią z bladego
     błękitu wyraźny granat. */
  /* Cztery drop-shadow „rozlewają" linię o piksel w każdą stronę — kreska 1 px staje się
     widoczną, 3-pikselową miedzą. Kontrast i nasycenie zamieniają blady błękit w granat. */
  .warstwa-dzialki{
    filter:contrast(3) saturate(3) brightness(.6) hue-rotate(-10deg)
      drop-shadow(1px 0 0 #1B3A5C) drop-shadow(-1px 0 0 #1B3A5C)
      drop-shadow(0 1px 0 #1B3A5C) drop-shadow(0 -1px 0 #1B3A5C);
  }
  /* Mocniejszy kontur: drugi pierścień cieni (łącznie ok. 5 px) — na ciemnym zbożu
     albo na zaoranej ziemi dopiero to widać. */
  .mocne-dzialki .warstwa-dzialki{
    filter:contrast(3.4) saturate(3.4) brightness(.45) hue-rotate(-10deg)
      drop-shadow(1px 0 0 #10293F) drop-shadow(-1px 0 0 #10293F)
      drop-shadow(0 1px 0 #10293F) drop-shadow(0 -1px 0 #10293F)
      drop-shadow(2px 0 0 #10293F) drop-shadow(-2px 0 0 #10293F)
      drop-shadow(0 2px 0 #10293F) drop-shadow(0 -2px 0 #10293F);
  }
  /* Podkład przygaszamy TYLKO przy włączonych działkach — sam w sobie ma być jasny. */
  /* ⚠️ Przygaszamy WYŁĄCZNIE podkład. Wcześniej wykluczenie wskazywało klasę
     .warstwa-dzialki-wrap, która nigdy nie istniała — więc reguła łapała też warstwę
     działek i nadpisywała jej filtr rozlania. Granice były przez to blade mimo poprawnego
     CSS-a gdzie indziej. Nazwa klasy w :not() musi być TA SAMA, co w className warstwy. */
  .mapa-z-dzialkami .leaflet-tile-pane .leaflet-layer:not(.warstwa-dzialki){
    filter:brightness(.8) saturate(.7)
  }
  .mw-pod{padding-left:4px;opacity:.9}
  .mw-pod.ukryte{display:none}

  /* Miniatura pola: zdjęcie w tle, obrys SVG na wierzchu. */
  .pole-mini{position:relative;width:64px;height:42px;border-radius:var(--radius-sm);
    background:var(--primary-soft);border:1px solid var(--border);flex-shrink:0;overflow:hidden}
  .pole-mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .pole-mini img.nieudane{display:none}   /* brak sieci — zostaje sam obrys na tle */
  .pole-mini svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  @media(min-width:1600px){ .pole-mini{width:76px;height:50px} }
</style>
</head>

<script>
/* =========================================================
   Zagon — logika
   ========================================================= */
const KEY = 'zagon.v1';

/* --- Supabase (konta + synchronizacja) --- */
const SUPABASE_URL='https://bmjvfscyosyhmtpskphm.supabase.co';
const SUPABASE_ANON='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJtanZmc2N5b3N5aG10cHNrcGhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ0Njk2NzAsImV4cCI6MjEwMDA0NTY3MH0.AmwhPYBWEQO7YoIeeTybyNLGmzQAgHvwcj1Sd51b6Zk';
const sb = (window.supabase && window.supabase.createClient)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}})

const CROP_COLORS = {
  'Pszenica ozima':'#D4A83A','Pszenica jara':'#E0BE55',
  'Rzepak ozimy':'#C9CE3A','Rzepak':'#C9CE3A',
  'Kukurydza':'#C08331','Kukurydza na ziarno':'#C08331','Kukurydza na kiszonkę':'#A9762C',
  'Jęczmień ozimy':'#C9B36A','Jęczmień jary':'#D8C888','Jęczmień':'#C9B36A',
  'Żyto':'#B79A5A','Owies':'#BFA24E','Pszenżyto':'#CBB25E',
  'Ziemniaki':'#8A5A3C','Buraki cukrowe':'#7E3B52','Buraki':'#7E3B52',
  'Groch':'#6E8C3F','Bobik':'#5F7D38','Łubin':'#7C9147','Soja':'#7A9B45',
  'Gorczyca':'#D9C24A','Facelia':'#8A79C4','Poplon':'#9BA86F',
  'Ugór':'#9A927F','Łąka':'#7FA05A','Trawy':'#7FA05A'
};
const DEFAULT_CROP_COLOR = '#7A8A6A';
/* Kolor uprawy: najpierw wybór użytkownika, potem REJESTR_UPRAW, na końcu stara mapa
   (dla upraw spoza rejestru) i wartość domyślna. Rejestr jest źródłem prawdy — CROP_COLORS
   zostaje wyłącznie dla nazw, których jeszcze do niego nie przeniesiono. */
function cropColor(c){
  if(!c) return '#d8d6cb';
  if(state.cropColors && state.cropColors[c]) return state.cropColors[c];
  if(typeof REJESTR_UPRAW!=='undefined' && REJESTR_UPRAW[c]) return REJESTR_UPRAW[c].kolor;
  return CROP_COLORS[c] || DEFAULT_CROP_COLOR;
}

/* ═══ IKONY UPRAW ══════════════════════════════════════════════════════════════
   Własny, spójny zestaw SVG. ⚠️ NIE emoji (🌽 🌾 🥔) — wyglądają inaczej na Windows,
   macOS i Androidzie, więc ta sama kukurydza rysowałaby się różnie u każdego

/* ═══ REJESTR UPRAW ════════════════════════════════════════════════════════════
   JEDNO miejsce, z którego biorą: tabela pól, mapa, płodozmian, Grafik, Skup i legenda.
   Dopisanie uprawy tutaj wystarczy — nie ma drugiej listy kolorów ani drugiej ikony.

   ⚠️ `ikona` to KLUCZ do IKONY_UPRAW, nie osobny rysunek. Pszenica ozima i jara dzielą
   jeden kłos i różnią się wyłącznie odcieniem — inaczej trzeba by rysować i utrzymywać
   dwa razy więcej grafiki bez żadnego zysku dla czytelności. */
const REJESTR_UPRAW = {
  'Pszenica ozima':      {ikona:'wheat',     kolor:'#D4A83A'},
  'Pszenica jara':       {ikona:'wheat',     kolor:'#E0BE55'},
  'Pszenżyto':           {ikona:'wheat',     kolor:'#CBB25E'},
  'Jęczmień ozimy':      {ikona:'barley',    kolor:'#C9B36A'},
  'Jęczmień jary':       {ikona:'barley',    kolor:'#D8C888'},
  'Żyto':                {ikona:'rye',       kolor:'#B79A5A'},
  'Owies':               {ikona:'oats',      kolor:'#BFA24E'},
  'Kukurydza na ziarno': {ikona:'corn',      kolor:'#C08331'},
  'Kukurydza na kiszonkę':{ikona:'corn',     kolor:'#A9762C'},
  'Rzepak ozimy':        {ikona:'rapeseed',  kolor:'#C9CE3A'},
  'Gorczyca':            {ikona:'rapeseed',  kolor:'#D9C24A'},
  'Ziemniaki':           {ikona:'potato',    kolor:'#8A5A3C'},
  'Buraki cukrowe':      {ikona:'sugarBeet', kolor:'#7E3B52'},
  'Soja':                {ikona:'soybean',   kolor:'#7A9B45'},
  'Groch':               {ikona:'peas',      kolor:'#6E8C3F'},
  'Bobik':               {ikona:'peas',      kolor:'#5F7D38'},
  'Łubin':               {ikona:'peas',      kolor:'#7C9147'},
  'Facelia':             {ikona:'alfalfa',   kolor:'#8A79C4'},
  'Łąka':                {ikona:'grass',     kolor:'#7FA05A'},
  'Trawy':               {ikona:'grass',     kolor:'#7FA05A'},
  'Poplon':              {ikona:'mixture',   kolor:'#9BA86F'},
  'Ugór':                {ikona:'sprout',    kolor:'#9A927F'},
};

/* Odcienie rysunku wyprowadzamy z jednego koloru uprawy: ziarno bierze jego barwę,
   liść zawsze pozostaje zielony, łodyga ciemniejsza. Dzięki temu nowa uprawa wymaga
   podania JEDNEGO koloru, a nie kompletu trzech. */
function odcienieUprawy(kolor){
  return {grain:kolor, leaf:'#4E8C4A', stem:'#3D6B3A'};
}
function kluczUprawy(nazwa){
  if(!nazwa) return 'sprout';
  const w=REJESTR_UPRAW[nazwa];
  if(w) return w.ikona;
  // Uprawa spoza rejestru (użytkownik wpisał własną) — dopasowujemy po nazwie,
  // a jak nic nie pasuje, dostaje neutralny kiełek zamiast pustego miejsca.
  const n=nazwa.toLowerCase();
  if(n.includes('pszen')) return 'wheat';
  if(n.includes('jęcz')||n.includes('jecz')) return 'barley';
  if(n.includes('kukur')) return 'corn';
  if(n.includes('rzepak')) return 'rapeseed';
  if(n.includes('ziemn')) return 'potato';
  if(n.includes('burak')) return 'sugarBeet';
  if(n.includes('owies')) return 'oats';
  if(n.includes('żyto')||n.includes('zyto')) return 'rye';
  if(n.includes('soja')) return 'soybean';
  if(n.includes('słonecz')||n.includes('slonecz')) return 'sunflower';
  if(n.includes('groch')||n.includes('bobik')||n.includes('łubin')) return 'peas';
  if(n.includes('lucern')) return 'alfalfa';
  if(n.includes('łąk')||n.includes('traw')) return 'grass';
  return 'sprout';
}

/* Jedyny sposób rysowania ikony uprawy w całej aplikacji. Ta sama kukurydza wygląda
   tak samo w tabeli pól, w płodozmianie, w Grafiku, na mapie i w module Skup. */
function ikonaUprawy(nazwa, rozmiar){
  const r=rozmiar||20;
  const k=odcienieUprawy(cropColor(nazwa));
  const rys=(IKONY_UPRAW[kluczUprawy(nazwa)]||IKONY_UPRAW.sprout)(k);
  return `<svg class="crop-ic" width="${r}" height="${r}" viewBox="0 0 24 24" fill="none"
    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true" title="${esc(nazwa||'')}">${rys}</svg>`;
}
/* Ikona + podpis — najczęstsze użycie, żeby nie powtarzać układu w każdym widoku. */
function uprawaZIkona(nazwa, rozmiar){
  if(!nazwa) return '<span class="muted">—</span>';
  return `<span class="crop-lbl">${ikonaUprawy(nazwa,rozmiar)}<span>${esc(nazwa)}</span></span>`;
}

   `farms` z migracji — po przejściu na Supabase przenosi się jeden do jednego. */
function emptyState(){ return {farm:{nazwa:'Moje gospodarstwo'}, ui:{}, cropColors:{}, fields:[], machines:[], finance:[], cattle:[], workers:[], schedule:[], settings:defaultSettings()}; }
const maSiedzibe = () => state.farm && state.farm.lat!=null && state.farm.lng!=null;
function ensureShape(){
  state=state||{}; state.farm=state.farm||{nazwa:'Moje gospodarstwo'}; state.ui=state.ui||{}; state.cropColors=state.cropColors||{};
  state.fields=state.fields||[]; state.machines=state.machines||[]; state.finance=state.finance||[]; state.cattle=state.cattle||[];
  state.workers=state.workers||[]; state.schedule=state.schedule||[];
  /* Grafik dyspozytorski (04.09.2026). „Do zrobienia" to lista prac jeszcze nikomu nieprzypisanych —
     przeciąga się je na kratkę PRACOWNIK + DZIEŃ. Przy pierwszym uruchomieniu wsypujemy typowe
     prace polowe, żeby panel nie był pusty; można je swobodnie zmienić.
     ⚠️ Flota i Pola NIE mają własnych list — czytają `state.machines` i `state.fields`, czyli te
     same dane co moduły Flota i Pola. Druga kopia rozjechałaby się po pierwszej edycji. */
  /* ⚠️ Świadomie PUSTA lista. Kiedyś wsypywaliśmy tu sześć typowych prac, żeby panel
     Grafiku nie był pusty. Odkąd „Do zrobienia" to zgłoszenia ze zgłaszającym, datą
     i statusem, takie wpisy udawały prawdziwe zgłoszenia bez autora — i psuły licznik
     nowych zgłoszeń w menu. Nowe gospodarstwo zaczyna z czystą listą. */
  if(!Array.isArray(state.tasks)) state.tasks=[];
  /* Zgłoszenia dorabiamy istniejącym wpisom — dawniej „do zrobienia" to była sama nazwa,
     bez statusu i bez wiedzy, kto to zgłosił. Stare pozycje zostają jako NEW bez autora. */
  state.tasks.forEach(t=>{
    if(!t.status) t.status='NEW';
    if(!t.kategoria) t.kategoria='inne';
    if(t.priorytet===undefined) t.priorytet='normalny';
  });
  state.powiadomienia=state.powiadomienia||[];
  /* Pracownicy: każdy jest domyślnie AKTYWNY i zwykłym pracownikiem. Konto (logowanie)
     jest osobną, opcjonalną rzeczą — patrz komentarz przy TYPY_KONT. */
  state.workers.forEach(w=>{
    if(w.aktywny===undefined) w.aktywny=true;
    if(!w.typKonta) w.typKonta='EMPLOYEE';
    w.uprawnienia=Object.assign({}, UPRAWNIENIA_DOMYSLNE, w.uprawnienia||{});
    w.powiadomieniaKanaly=Object.assign({email:false, whatsapp:false}, w.powiadomieniaKanaly||{});
  });
  // Status maszyny dokładamy istniejącym wpisom — bez tego stare floty nie miałyby czego pokazać.
  state.machines.forEach(m=>{ if(!m.status) m.status='dostępna'; });
  /* Wszystkie trzy sekcje otwarte domyślnie — panel ma pokazywać zasoby od razu.
     Zwijanie jest do dyspozycji, ale nie jest stanem wyjściowym. */
  state.ui.flota=Object.assign({szukaj:'', typ:'', status:'', sort:'nazwa', widok:'lista'}, state.ui.flota||{});
  state.ui.grafik=Object.assign({otwarte:['zadania','flota','pola'], szukaj:'', miejsce:''}, state.ui.grafik||{});
  /* Pulpit: „Dzisiaj" i „Maszyny w pracy" otwarte od razu — to one odpowiadają na pytanie
     „co się teraz dzieje". Aktywność (długa lista historii) startuje zwinięta. */
  state.ui.pulpit=Object.assign({otwarte:['dzis','maszyny','todo'], miejsce:''}, state.ui.pulpit||{});
  /* Rodzaje prac warsztatowych — lista PODPOWIADA, nie więzi: pole zadania przyjmuje też
     wpis z ręki. Trzymamy ją w stanie, nie w kodzie, żeby dało się ją zmienić bez wydania
     nowej wersji apki (Ustawienia → Prace warsztatowe). */
  if(!Array.isArray(state.rodzajeWarsztatowe) || !state.rodzajeWarsztatowe.length){
    state.rodzajeWarsztatowe=['Naprawa','Przegląd','Serwis','Wymiana oleju','Wymiana filtrów',
      'Diagnostyka','Spawanie','Elektryka','Hydraulika','Mycie','Przygotowanie do sezonu',
      'Montaż','Demontaż','Opony','Inne'];
  }
  if(!Array.isArray(state.ui.pulpit.otwarte)) state.ui.pulpit.otwarte=['dzis','maszyny','todo'];
  if(!Array.isArray(state.ui.grafik.otwarte)) state.ui.grafik.otwarte=['zadania','flota','pola'];
  state.settings=state.settings||defaultSettings();
  state.settings.species=state.settings.species||'bydlo';
  state.settings.modules=Object.assign({flota:true, finanse:true, hodowla:true, grafik:true,
    todo:true, pracownicy:true, skup:true}, state.settings.modules||{});
}
/* Wczytanie stanu gospodarstwa danego użytkownika (z chmury; offline → cache) */
async function loadStateForUser(user){
  currentUserId=user.id; currentEmail=user.email;
  let loaded=null;
  try{
    const { data, error } = await sb.from('user_state').select('data').eq('user_id',user.id).maybeSingle();
    if(error) throw error;
    if(data && data.data && Object.keys(data.data).length) loaded=data.data;
  }catch(e){
    const c=localStorage.getItem('mfarmx.cache.'+user.id); if(c){ try{ loaded=JSON.parse(c); }catch(_){} }
  }
  /* Konto PRACOWNIKA nie ma własnego gospodarstwa — należy do cudzego.
     Sprawdzamy to dopiero, gdy własnego wiersza nie ma, żeby nie dokładać zapytania
     przy każdym logowaniu właściciela. */
  if(!loaded){
    try{
      const { data:link } = await sb.from('dostep_pracownika')
        .select('wlasciciel_id, imie, worker_id').eq('pracownik_id',user.id).maybeSingle();
      if(link){
        const { data:gosp } = await sb.from('user_state').select('data').eq('user_id',link.wlasciciel_id).maybeSingle();
        if(gosp && gosp.data){
          state=gosp.data; ensureShape();
          trybPracownika={ workerId:link.worker_id, imie:link.imie||user.email,
            wlascicielId:link.wlasciciel_id };   // potrzebne do wysłania zgłoszenia
          setTimeout(odswiezMojeZgloszenia,0);
          render(); return;      // ⚠️ BEZ zapisu i bez cache — pracownik ma tylko czytać
        }
      }
    }catch(e){ /* brak tabeli/uprawnień → zachowujemy się jak dotąd */ }
  }
  if(loaded){ state=loaded; ensureShape(); }
  else { state=emptyState(); ensureShape(); await saveCloud(); }   // nowy rolnik → puste gospodarstwo + utworzenie wiersza
  try{ localStorage.setItem('mfarmx.cache.'+user.id, JSON.stringify(state)); }catch(e){}
}
/* Zapis: natychmiast do cache, do chmury z debounce */
function save(){
  // Tryb lokalny: zapis wyłącznie do własnego klucza, ZERO ruchu do chmury.
  if(DEV){
    try{ localStorage.setItem(DEV_KEY, JSON.stringify(state)); }catch(e){}
    const n=document.getElementById('savedNote'); if(n) n.textContent='zapisano lokalnie';
    return;
  }
  if(currentUserId){ try{ localStorage.setItem('mfarmx.cache.'+currentUserId, JSON.stringify(state)); }catch(e){} }
  const n=document.getElementById('savedNote'); if(n) n.textContent='zapisywanie…';
  scheduleCloudSave();
}
let _saveT=null;
function scheduleCloudSave(){ clearTimeout(_saveT); _saveT=setTimeout(saveCloud, 700); }
async function saveCloud(){
  if(!sb || !currentUserId) return;
  const n=document.getElementById('savedNote');
  try{
    const { error } = await sb.from('user_state').upsert({ user_id:currentUserId, data:state, updated_at:new Date().toISOString() });
    if(error) throw error;
    if(n) n.textContent='zsynchronizowano '+new Date().toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'});
  }catch(e){ if(n) n.textContent='offline — zapiszę po połączeniu'; }
}

function go(name, fieldId){ view.module='pola'; view.name=name; if(fieldId!==undefined) view.fieldId=fieldId; render(); window.scrollTo(0,0); }
/* Wyłączenie modułu, w którym się właśnie stoi, zostawiłoby pusty ekran bez wyjścia.
   Ten sam warunek chroni przed wejściem ze starego adresu po zmianie ustawień. */
function modulDostepny(m){
  if(['pulpit','pola','ustawienia','uzytkownicy'].includes(m)) return true;
  if(m==='bydlo') return modOn('hodowla');
  return MODULE_LIST.some(x=>x.key===m) ? modOn(m) : true;
}
function goModule(m){
  if(!modulDostepny(m)) m='pulpit';
  view.module=m;
  if(m==='pola' && !['pola','sezon'].includes(view.name)) view.name='sezon';
  if(m==='flota') view.machineId=null;
  if(m==='bydlo') view.cattleId=null;
  if(m==='skup'){ view.skupKlient=null; view.skupSzukaj=''; }
  render(); window.scrollTo(0,0);
}
function setFarmName(v){ state.farm.nazwa=v.trim()||'Gospodarstwo'; save(); }
function totalHa(){ return state.fields.reduce((s,f)=>s+(parseFloat(f.powierzchnia_ha)||0),0); }
function seasonOf(field,rok){ return field.sezony.find(s=>s.rok===rok); }
function latestSeason(field){ return field.sezony.slice().sort((a,b)=>b.rok-a.rok)[0]; }
function fieldsWithGeo(){ return state.fields.filter(f=>f.geo&&f.geo.polygon&&f.geo.polygon.length>=3); }
function allYears(){ const s=new Set(); state.fields.forEach(f=>f.sezony.forEach(z=>s.add(z.rok))); s.add(view.year); return [...s].sort((a,b)=>b-a); }

/* ─── TRYB LOKALNY (DEV) ──────────────────────────────────────────────────────
   Na localhoście apka pracuje BEZ chmury: bez logowania, stan w localStorage.
   Po co: (1) Supabase w chmurze bywa uśpiony albo zepsuty i wtedy nie da się nawet
   wejść do apki, żeby cokolwiek sprawdzić; (2) przy dokładaniu funkcji nie chcemy
   ruszać prawdziwych danych brata.
   ⚠️ Warunek to WYŁĄCZNIE nazwa hosta — na `mfarmx.vercel.app` nic się nie zmienia.
   ⚠️ Klucz `mfarmx.dev` jest osobny od produkcyjnego `mfarmx.cache.<uid>` — praca
   lokalna nie może nadpisać niczego, co przyszło z chmury. */
/* `?prod=1` wyłącza tryb lokalny na localhoście — pozwala obejrzeć prawdziwy ekran logowania
   i przetestować chmurę bez wdrażania. Bez tego nie da się lokalnie zobaczyć tego, co widzi
   użytkownik na produkcji, bo DEV wchodzi od razu do apki. */
const DEV = ['localhost','127.0.0.1','[::1]'].includes(location.hostname)
         && !new URLSearchParams(location.search).has('prod');
const DEV_KEY = 'mfarmx.dev';

function bootDev(){
  let loaded=null;
  try{ const c=localStorage.getItem(DEV_KEY); if(c) loaded=JSON.parse(c); }catch(e){}
  if(loaded){ state=loaded; }
  /* Puste gospodarstwo, tak jak przy pierwszym logowaniu. Wcześniej wchodziły tu dane
     przykładowe (trzy pola, stado, maszyny) — wygodne do oglądania, mylące przy pracy,
     bo nie było widać, co jest własne, a co z demonstracji.
     ⚠️ seed() dalej istnieje i ZWRACA stan; wywołaj state=seed() z konsoli, gdy
     potrzebujesz danych pokazowych. */
  else { state = emptyState(); }
  ensureShape();
  currentUserId='dev-local';
  currentEmail='tryb lokalny';
  try{ localStorage.setItem(DEV_KEY, JSON.stringify(state)); }catch(e){}
  render();
  const p=document.createElement('div');
  p.id='devBadge';
  p.textContent='TRYB LOKALNY — dane tylko w tej przeglądarce, chmura odłączona';
  p.style.cssText='position:fixed;left:0;right:0;bottom:0;z-index:9999;background:#F0B13A;'
    +'color:#3D3D3D;font:600 12px/1.4 Roboto,system-ui,sans-serif;text-align:center;'
    +'padding:6px 10px;letter-spacing:.02em';
  document.body.appendChild(p);
}

async function boot(){
  if(DEV){ bootDev(); return; }
  if(!sb){
    document.getElementById('app').innerHTML=authScreen(`<h2>Brak połączenia</h2>
      <p class="auth-sub">Nie udało się załadować serwera (sprawdź internet i odśwież stronę).</p>`);
    return;
  }
  sb.auth.onAuthStateChange((event)=>{ if(event==='SIGNED_OUT'){ currentUserId=null; currentEmail=null; renderAuth('login'); } });
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ renderAuth('login'); return; }
  await loadStateForUser(session.user);
  render();
}

async function doLogin(){
  const email=val('au_email').trim(), pass=val('au_pass');
  const err=document.getElementById('auth_err'); err.textContent='';
  if(!email||!pass){ err.textContent='Podaj e-mail i hasło.'; return; }
  err.textContent='Logowanie…';
  const { data, error } = await sb.auth.signInWithPassword({ email, password:pass });
  if(error){ err.textContent = /confirm/i.test(error.message) ? 'Najpierw potwierdź e-mail (sprawdź skrzynkę).' : 'Nieprawidłowy e-mail lub hasło.'; return; }
  await loadStateForUser(data.user); render();
}
async function doSignup(){
  // Podwójna blokada: ekran jest niedostępny, ale funkcja siedzi w globalnym zasięgu,
  // więc bez tego dałoby się ją wywołać z konsoli i obejść zamkniętą rejestrację.
  if(REJESTRACJA_ZAMKNIETA){ renderAuth('login'); return; }
  const email=val('au_email').trim(), p=val('au_pass'), p2=val('au_pass2');
  const err=document.getElementById('auth_err'), ok=document.getElementById('auth_ok'); err.textContent=''; ok.textContent='';
  if(!email){ err.textContent='Podaj e-mail.'; return; }
  if((p||'').length<6){ err.textContent='Hasło musi mieć min. 6 znaków.'; return; }
  if(p!==p2){ err.textContent='Hasła nie są takie same.'; return; }
  err.textContent='Zakładanie konta…';
  const { data, error } = await sb.auth.signUp({ email, password:p });
  if(error){ err.textContent=error.message; return; }
  err.textContent='';
  if(data.session){ await loadStateForUser(data.user); render(); }
  else { ok.textContent='Konto założone! Sprawdź e-mail, kliknij link potwierdzający i zaloguj się.'; }
}
async function doReset(){
  const email=val('au_email').trim();
  const err=document.getElementById('auth_err'), ok=document.getElementById('auth_ok'); err.textContent=''; ok.textContent='';
  if(!email){ err.textContent='Podaj e-mail.'; return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
  if(error){ err.textContent=error.message; return; }
  ok.textContent='Jeśli konto istnieje, wysłaliśmy link na e-mail.';
}
async function logout(){
  if(!confirm('Wylogować się z M-FarmX?')) return;
  try{ await sb.auth.signOut(); }catch(e){}
  currentUserId=null; currentEmail=null; renderAuth('login');
}

function render(){
  // Pracownik dostaje własny, prosty ekran — bez sidebara, modułów i panelu administracyjnego.
  if(trybPracownika){ renderWidokPracownika(); return; }
  // sprzątanie map przy zmianie widoku
  if(view.module!=='pulpit' && LMAP){ try{LMAP.remove();}catch(e){} LMAP=null; }
  if(!(view.module==='pola'&&view.name==='nowePole') && CMAP){ try{CMAP.remove();}catch(e){} CMAP=null; }

  // guard: wyłączony moduł → wróć na pulpit
  const guard={flota:'flota', finanse:'finanse', bydlo:'hodowla', grafik:'grafik'};
  if(guard[view.module] && !modOn(guard[view.module])) view.module='pulpit';

  let content='';
  if(view.module==='pulpit') content=renderPulpitModule();
  else if(view.module==='pola') content=renderPolaModule();
  else if(view.module==='flota') content=renderFlotaModule();
  else if(view.module==='finanse') content=renderFinanseModule();
  else if(view.module==='bydlo') content=renderBydloModule();
  else if(view.module==='grafik') content=renderGrafikModule();
  else if(view.module==='ustawienia') content=renderUstawieniaModule();
  else if(view.module==='uzytkownicy') content=renderUzytkownicyModule();
  else if(view.module==='pracownicy') content=renderPracownicyModule();
  else if(view.module==='todo') content=renderTodoModule();
  else if(view.module==='skup') content=renderSkupModule();

  document.getElementById('app').innerHTML=`${renderNavbar()}<div class="layout${view.sidebarCollapsed?' collapsed':''}">${renderSidebar()}<main class="content${pelnaSzerokosc()?' pelna':''}">${content}</main></div>`;

  // Lista kont wczytuje się przy pierwszym wejściu w moduł; potem odświeżamy ją po każdej zmianie.
  if(view.module==='uzytkownicy' && _uzytkownicy===null) setTimeout(odswiezUzytkownikow,0);
  if(view.module==='skup' && !skup && !skupBlad) setTimeout(async()=>{ await skupWczytaj(); render(); },0);
  if(view.module==='pulpit') setTimeout(initMap,30);
  else if(view.module==='pola'){
    if(view.name==='detail') setTimeout(initMiniMap,0);
    else if(view.name==='nowePole') setTimeout(initCreateMap,30);
  }
}

let _uzytkownicy = null;      // null = jeszcze nie wczytano

async function wolajAdmin(akcja, dane){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session) throw new Error('Sesja wygasła — zaloguj się ponownie.');
  const r = await fetch(SUPABASE_URL+'/functions/v1/admin-uzytkownicy', {
    method:'POST',
    headers:{ 'Authorization':'Bearer '+session.access_token, 'Content-Type':'application/json' },
    body: JSON.stringify({ akcja, ...dane }),
  });
  const j = await r.json().catch(()=>({error:'Serwer nie odpowiedział.'}));
  if(!r.ok) throw new Error(j.error || ('Błąd '+r.status));
  return j;
}

/* Hasło startowe proponujemy sami — łatwiejsze do przeczytania przez telefon niż losowy ciąg
   znaków, a i tak jednorazowe. Bez znaków mylących (0/O, 1/l/I). */
function losoweHaslo(){
  const z='abcdefghjkmnpqrstuvwxyz', W='ABCDEFGHJKMNPQRSTUVWXYZ', c='23456789';
  const los=s=>s[Math.floor(Math.random()*s.length)];
  let h=los(W); for(let i=0;i<5;i++) h+=los(z); h+=los(c)+los(c)+los(c);
  return h;
}

/* ═══ WYSZUKIWANIE GLOBALNE ════════════════════════════════════════════════════
   Jedno pole na pola, uprawy, maszyny, pracowników, zadania i numery rejestracyjne.
   ⚠️ Podpowiedzi rysujemy BEZ przerysowania całej aplikacji — render() przy każdym
   naciśnięciu klawisza gubiłby fokus w polu tekstowym. */
function podpowiedziGlobalne(){
  const box=document.getElementById('navWyniki'); if(!box) return;
  const q=(view.szukajGlobalnie||'').trim().toLowerCase();
  if(q.length<2){ box.classList.remove('on'); box.innerHTML=''; return; }
  const w=[], ma=(t)=>String(t||'').toLowerCase().includes(q);

  state.fields.filter(f=>ma(f.nazwa)||ma(f.lokalizacja)).slice(0,5).forEach(f=>{
    const u=(latestSeason(f)||{}).uprawa;
    w.push({ik:'pola', t:f.nazwa, p:[fmt(f.powierzchnia_ha)+' ha',u].filter(Boolean).join(' · '),
      akcja:`go('detail','${f.id}')`});
  });
  state.machines.filter(m=>ma(m.nazwa)||ma(m.nr_rej)||ma(m.typ)).slice(0,5).forEach(m=>{
    w.push({ik:'flota', t:m.nazwa, p:[m.typ,m.nr_rej].filter(Boolean).join(' · '),
      akcja:`idzDoMaszyny('${m.id}')`});
  });
  pracownicyAktywni().filter(x=>ma(x.imie)||ma(x.rola)).slice(0,4).forEach(x=>{
    w.push({ik:'pracownicy', t:x.imie, p:x.rola||'pracownik', akcja:`pokazKartePracownika('${x.id}')`});
  });
  state.schedule.filter(z=>ma(z.zadanie)||ma(z.opis)).slice(0,4).forEach(z=>{
    const M=miejscePracy(z);
    w.push({ik:'grafik', t:z.zadanie||M.krotko, p:[dataKrotko(z.date),z.opis].filter(Boolean).join(' · '),
      akcja:`idzDoZadania('${z.id}')`});
  });
  // Numer rejestracyjny samochodu ze Skupu — najczęstsze pytanie przy wadze.
  if(skup) skup.loads.filter(l=>ma(l.registration_number)||ma(l.document_no)).slice(0,4).forEach(l=>{
    w.push({ik:'skup', t:l.registration_number||'załadunek',
      p:[ton(l.tons),nazwaKlienta(l.customer_id)].filter(Boolean).join(' · '),
      akcja:`view.skupTab='zaladunki';view.skupSzukaj='${(l.registration_number||'').replace(/'/g,'')}';goModule('skup')`});
  });

  box.classList.add('on');
  box.innerHTML = w.length
    ? w.slice(0,12).map(x=>`<button class="nw-p" onclick="zamknijSzukanie();${x.akcja}">
        <span class="nw-ik">${ikonaMenu(x.ik,'currentColor')}</span>
        <span><b>${esc(x.t)}</b><span>${esc(x.p||'')}</span></span></button>`).join('')
    : `<div class="nw-brak">Nic nie pasuje do „${esc(view.szukajGlobalnie)}".</div>`;
}
function zamknijSzukanie(){
  view.szukajGlobalnie='';
  const b=document.getElementById('navWyniki'); if(b){ b.classList.remove('on'); b.innerHTML=''; }
  const i=document.getElementById('globalSzukaj'); if(i) i.value='';
}
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='k'){
    e.preventDefault();
    const i=document.getElementById('globalSzukaj'); if(i){ i.focus(); i.select(); }
  }
});

function aggregateActivity(){
  const A=[]; const today=new Date().toISOString().slice(0,10);
  state.fields.forEach(f=>(f.sezony||[]).forEach(s=>{
    (s.zabiegi||[]).forEach(z=>A.push({date:z.data,ic:'spray',color:ZABIEG_KINDS[z.rodzaj]||'#5E7F54',title:z.srodek,sub:`${f.nazwa} · ${ZABIEG_LABEL[z.rodzaj]||'zabieg'}`}));
    if(s.data_zbioru) A.push({date:s.data_zbioru,ic:'wheat',color:'#F0B13A',title:`Zbiór — ${s.uprawa||''}`,sub:`${f.nazwa}${s.plon_t_ha?` · ${fmt(s.plon_t_ha)} t/ha`:''}`});
  }));
  state.machines.forEach(m=>(m.przeglady||[]).forEach(p=>A.push({date:p.data,ic:'tractor',color:MACHINE_COLORS[m.typ]||'#5B8A93',title:PRZEGLAD_TYPES[p.rodzaj]||p.rodzaj,sub:m.nazwa})));
  state.cattle.forEach(c=>{
    (c.inseminacje||[]).forEach(x=>A.push({date:x.data,ic:'cow',color:'#5B8A93',title:'Inseminacja',sub:`${c.kolczyk||c.imie||''}`}));
    (c.wycielenia||[]).forEach(x=>A.push({date:x.data,ic:'cow',color:'#F0B13A',title:'Wycielenie',sub:`${c.kolczyk||c.imie||''}`}));
  });
  state.finance.forEach(t=>{ const cat=FIN_CATEGORIES[t.kategoria]||FIN_CATEGORIES.inne;
    A.push({date:t.data,ic:'coin',color:cat.color,title:`${t.typ==='przychod'?'+':'−'}${fmt(t.kwota)} zł`,sub:cat.label}); });
  A.forEach(a=>{ a.date=a.date||''; a.status = !a.date ? 'plan' : (a.date>today?'plan':'done'); });
  A.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return A;
}
function feedPending(){ return aggregateActivity().filter(a=>a.status==='plan').length; }

/* ═══ ZGŁOSZENIA Z TELEFONU PRACOWNIKA ═════════════════════════════════════════
   ⚠️ TU PRZEBIEGA GRANICA ARCHITEKTURY. Całe gospodarstwo to jeden dokument `user_state`
   należący do właściciela; pracownik ma do niego prawo WYŁĄCZNIE do odczytu, bo zapis
   oznaczałby nadpisanie wszystkiego — pól, maszyn, finansów. Dlatego zgłoszenie NIE idzie
   do `state.tasks` z przeglądarki pracownika, tylko do osobnej tabeli `zgloszenia`
   z własnym RLS: pracownik dopisuje swoje wiersze, właściciel czyta wszystkie ze swojego
   gospodarstwa. To pierwszy byt wyjęty z jsonb-a do prawdziwej tabeli.
   Schemat: schema_zgloszenia.sql */
async function wyslijZgloszenie(){
  const nazwa=val('t_nazwa').trim();
  const err=document.getElementById('t_err');
  if(!nazwa){ err.textContent='Napisz, co trzeba zrobić.'; return; }
  if(!trybPracownika || !trybPracownika.wlascicielId){
    err.textContent='To konto nie jest powiązane z gospodarstwem.'; return; }
  err.textContent='Wysyłam…';
  try{
    const { error } = await sb.from('zgloszenia').insert({
      wlasciciel_id: trybPracownika.wlascicielId,
      worker_id:     trybPracownika.workerId || null,
      zglosil:       (workerById(trybPracownika.workerId)||{}).imie || currentEmail || '',
      nazwa,
      kategoria: val('t_kat'), priorytet: val('t_prio'),
      maszyna_id: val('t_masz')||null, pole_id: val('t_pole')||null,
      uwagi: val('t_uwagi').trim(),
    });
    if(error) throw error;
    closeModal(); render();
    alert('Zgłoszenie wysłane. Gospodarz zobaczy je na liście „Do zrobienia".');
  }catch(e){
    err.textContent='Nie udało się wysłać: '+(e.message||e);
  }
}

/* Po stronie gospodarza: dociągnięcie zgłoszeń z tabeli do listy „Do zrobienia".
   Pobrane wiersze oznaczamy jako przeniesione, żeby nie wracały przy każdym odświeżeniu. */
async function pobierzZgloszenia(cicho){
  if(!sb || !currentUserId) return 0;
  try{
    const { data, error } = await sb.from('zgloszenia')
      .select('*').eq('wlasciciel_id',currentUserId).eq('przeniesione',false);
    if(error) throw error;
    if(!data || !data.length){ if(!cicho) alert('Brak nowych zgłoszeń.'); return 0; }
    data.forEach(r=>{
      if((state.tasks||[]).some(t=>t.zrodloId===r.id)) return;   // już mamy
      state.tasks.push({id:uid(), zrodloId:r.id, nazwa:r.nazwa, kategoria:r.kategoria||'inne',
        priorytet:r.priorytet||'normalny', maszynaId:r.maszyna_id||'', poleId:r.pole_id||'',
        uwagi:r.uwagi||'', status:'NEW', zadanieId:null,
        zglosilWorkerId:r.worker_id||null, zgloszono:r.utworzono});
      createNotification(null,'zgloszenie','Nowe zgłoszenie',(r.zglosil||'Pracownik')+': „'+r.nazwa+'"',{});
    });
    await sb.from('zgloszenia').update({przeniesione:true})
      .in('id', data.map(r=>r.id));
    save(); render();
    return data.length;
  }catch(e){
    if(!cicho) alert('Nie udało się pobrać zgłoszeń: '+(e.message||e)
      +'\n\nSprawdź, czy tabela „zgloszenia" została utworzona (schema_zgloszenia.sql).');
    return 0;
  }
}

        <span class="pr-txt"><b>${esc(w.imie)}</b>
          <span class="pr-sub">${konto?esc(konto):'bez konta'}</span></span></span></td>
      <td>${esc(w.rola||'—')}</td>
      <td>${dzisiaj?dzisiaj+(dzisiaj===1?' zadanie':' zadania'):'—'}</td>
      <td><span class="pr-ranga r-${w.typKonta==='FARM_ADMIN'?'adm':(zarzadzaGrafikiem(w)?'graf':'prac')}">${rangaTxt}</span></td>

    <thead><tr><th>Pracownik</th><th>Stanowisko</th><th>Dzisiaj</th><th>Uprawnienia</th><th>Status</th></tr></thead>

function pokazKartePracownika(id){ view.module='pracownicy'; view.workerId=id; render(); window.scrollTo(0,0); }

/* ─── Karta pracownika ─────────────────────────────────────────────────────── */

  return `
    <button class="btn ghost small" onclick="view.workerId=null;render()" style="margin-bottom:14px">← Pracownicy</button>
    <div class="gr-head pulpit-head">
      <div><h1>${esc(w.imie)}</h1><div class="sub">${esc(w.rola||'pracownik')} · ${w.aktywny===false?'konto nieaktywne':'aktywny'}</div></div>

        <button class="btn small" onclick="openWorkerForm('${w.id}')">Edytuj dane</button>
        <button class="btn small" onclick="przelaczAktywnosc('${w.id}')">${w.aktywny===false?'Przywróć':'Dezaktywuj'}</button>

    <div class="pr-karta-uklad">
      <div class="pr-kol">

          ${wiersz('Telefon', esc(w.telefon||''))}
          ${wiersz('E-mail', esc(konto.email||''))}
          ${wiersz('Typ konta', (TYPY_KONT[w.typKonta]||TYPY_KONT.EMPLOYEE).label)}
          ${wiersz('Logowanie', konto.email
            ? (konto.userId?'konto założone':'zaproszenie nie zostało jeszcze wysłane')

          ${wiersz('Powiadomienia', [konto.email&&w.powiadomieniaKanaly.email?'e-mail':'',

            return `<div class="op-zad" onclick="idzDoZadania('${z.id}')">
              <span class="op-godz">${esc(z.od||'—')}</span>
