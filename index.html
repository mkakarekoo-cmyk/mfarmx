function ustawUprawnienie(id,klucz,wl){
  const w=workerById(id); if(!w) return;
  w.uprawnienia=w.uprawnienia||{};
  w.uprawnienia[klucz]=!!wl;
  save(); render();
}
function przelaczAktywnosc(id){
  const w=workerById(id); if(!w) return;
  const wylacz = w.aktywny!==false;
  if(wylacz && !confirm(w.imie+' zniknie z Grafiku, ale jego dotychczasowe zadania i godziny zostaną. Kontynuować?')) return;
  w.aktywny=!wylacz;
  save(); render();
}

/* ═══ MODUŁ DO ZROBIENIA (zgłoszenia) ══════════════════════════════════════════
   Pracownik zgłasza POTRZEBĘ, administrator zamienia ją w zadanie. Zgłoszenie po
   zaplanowaniu zostaje — niesie ślad: kto zauważył, kto zaplanował, kto wykonał.
   ⚠️ To ta sama lista `state.tasks`, którą widać jako „Do zrobienia" w panelu Grafiku
   i Pulpitu. Nie zakładaj drugiej — pozycja zgłoszona z telefonu ma się pojawić tam,
   gdzie kierownik i tak patrzy. */
function ikonaKategorii(k){ return (MIEJSCA_PRACY[k]||MIEJSCA_PRACY.inne).ikona; }

function kartaZgloszeniaMini(t){
  const st=statusZgloszenia(t), S=STATUSY_ZGLOSZEN[st];
  const z=t.zadanieId?zadanieById(t.zadanieId):null;
  const w=z?workerById(z.workerId):null;
  return `<div class="zg-mini" ${z?`onclick="idzDoZadania('${z.id}')"`:''}>
    <span class="zg-st" style="color:${S.kolor}">${S.ikona}</span>
    <span class="op-t"><b>${ikonaKategorii(t.kategoria)} ${esc(t.nazwa)}</b>
      <span class="op-sub">${esc(S.label)}${z?' · '+esc(dataKrotko(z.date))+(z.od?' '+esc(z.od):''):''}${w?' · '+esc(w.imie):''}</span>
    </span></div>`;
}
function dataKrotko(iso){
  if(!iso) return '';
  const d=new Date(iso+'T00:00:00');
  return d.toLocaleDateString('pl-PL',{weekday:'short',day:'numeric',month:'short'});
}

function renderTodoModule(){
  const lista=(state.tasks||[]).map(t=>({t, st:statusZgloszenia(t)}));
  const nowe=lista.filter(x=>x.st==='NEW');
  const reszta=lista.filter(x=>x.st!=='NEW');

  const head=naglowekStrony('todo','Do zrobienia','Zgłoszenia od pracowników i własne notatki — stąd planuje się pracę',
    `<button class="btn small" onclick="pobierzZgloszenia()" title="Sprawdź, czy pracownicy przysłali coś z telefonów">↻ Pobierz z telefonów</button>
     <button class="btn primary" onclick="openZgloszenieForm()">+ Dodaj zgłoszenie</button>`);

  if(!lista.length){
    return head+`<div class="empty-state"><div class="big">Lista jest pusta</div>
      <div style="margin-bottom:16px">Tu trafiają rzeczy zauważone w polu i w warsztacie — „wymienić lampę", „poprawić wjazd".</div>
      <button class="btn primary" onclick="openZgloszenieForm()">+ Dodaj pierwsze zgłoszenie</button></div>`;
  }

  const wiersz=({t,st})=>{
    const S=STATUSY_ZGLOSZEN[st];
    const m=t.maszynaId?maszynaById(t.maszynaId):null;
    const p=t.poleId?poleById(t.poleId):null;
    const kto=t.zglosilWorkerId?workerById(t.zglosilWorkerId):null;
    const z=t.zadanieId?zadanieById(t.zadanieId):null;
    const zw=z?workerById(z.workerId):null;
    const szczegoly=[m?'🔧 '+esc(m.nazwa):'', p?'📍 '+esc(p.nazwa):'',
      t.uwagi?esc(t.uwagi):''].filter(Boolean).join(' · ');
    // Ślad zgłoszenia: kto zauważył → kto zaplanował → kto robi. Nie kasujemy go nigdy.
    const slad=[
      kto?'zgłosił: '+esc(kto.imie):(t.zgloszono?'zgłoszenie własne':''),
      t.zgloszono?esc(kiedyKrotko(t.zgloszono)):'',
      t.zaplanowalKto?'zaplanował: '+esc(t.zaplanowalKto):'',
      z&&zw?'wykonuje: '+esc(zw.imie)+' '+esc(dataKrotko(z.date)):'',
    ].filter(Boolean).join(' · ');
    return `<div class="zg-w st-${st}">
      <div class="zg-glowna">
        <span class="zg-st duzy" style="color:${S.kolor}" title="${esc(S.label)}">${S.ikona}</span>
        <div class="zg-tresc">
          <div class="zg-tyt">${ikonaKategorii(t.kategoria)} ${esc(t.nazwa)}
            ${t.priorytet==='pilny'?'<span class="zk-pilne">PILNE</span>':''}</div>
          ${szczegoly?`<div class="zg-szcz">${szczegoly}</div>`:''}
          ${slad?`<div class="zg-slad">${slad}</div>`:''}
        </div>
        <span class="zg-etyk" style="color:${S.kolor};border-color:${S.kolor}">${esc(S.label)}</span>
      </div>
      <div class="zg-akcje">
        ${st==='NEW'?`<button class="btn small primary" onclick="zaplanujZgloszenie('${t.id}')">Zaplanuj</button>`:''}
        ${z?`<button class="btn small" onclick="idzDoZadania('${z.id}')">Pokaż zadanie</button>`:''}
        <button class="btn small" onclick="openZgloszenieForm('${t.id}')">Edytuj</button>
        ${st==='NEW'?`<button class="btn small" onclick="odrzucZgloszenie('${t.id}')">Odrzuć</button>`
          :(st==='REJECTED'?`<button class="btn small" onclick="przywrocZgloszenie('${t.id}')">Przywróć</button>`:'')}
        <button class="btn small danger" onclick="usunZgloszenie('${t.id}')">Usuń</button>
      </div></div>`;
  };

  return head
    + `<div class="gr-podsum"><span class="gr-ps-tyt">Zgłoszenia</span>
        ${Object.entries(STATUSY_ZGLOSZEN).map(([k,v])=>{
          const n=lista.filter(x=>x.st===k).length;
          return n?`<span><b>${n}</b> ${esc(v.label.toLowerCase())}</span>`:'';
        }).join('')}</div>`
    + (nowe.length?`<div class="sb-title">Nowe zgłoszenia</div>`+nowe.map(wiersz).join(''):'')
    + (reszta.length?`<div class="sb-title" style="margin-top:18px">Pozostałe</div>`+reszta.map(wiersz).join(''):'');
}
function kiedyKrotko(iso){
  if(!iso) return '';
  const d=new Date(iso), dzis=new Date();
  const g=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return d.toDateString()===dzis.toDateString()
    ? 'dzisiaj '+g
    : d.toLocaleDateString('pl-PL',{day:'numeric',month:'short'})+' '+g;
}

/* Formularz zgłoszenia — świadomie ubogi. Pracownik ma zgłosić POTRZEBĘ, a nie planować:
   nie pytamy go o osobę, termin ani godziny. To robota administratora przy „Zaplanuj". */
function openZgloszenieForm(id){
  const t=id?(state.tasks||[]).find(x=>x.id===id):null;
  const d=Object.assign({nazwa:'',kategoria:'warsztat',maszynaId:'',poleId:'',priorytet:'normalny',uwagi:''}, t||{});
  const opcje=(lista,wyb,pusty)=>`<option value="">${pusty}</option>`+
    lista.map(o=>`<option value="${o.v}" ${o.v===wyb?'selected':''}>${esc(o.t)}</option>`).join('');
  const masz=state.machines.map(m=>({v:m.id,t:m.nazwa+(m.typ?' · '+m.typ:'')}));
  const pola=state.fields.map(f=>({v:f.id,t:f.nazwa}));
  openModal(`
    <div class="modal-head"><h3>${t?'Zgłoszenie':'Nowe zgłoszenie'}</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body">
      <div class="field"><label>Co trzeba zrobić?</label>
        <input id="t_nazwa" value="${esc(d.nazwa)}" placeholder="np. Wymienić lampę roboczą w Axionie" autofocus></div>
      <div class="field row2">
        <div><label>Kategoria</label><select id="t_kat">${Object.entries(MIEJSCA_PRACY)
          .map(([k,v])=>`<option value="${k}" ${k===d.kategoria?'selected':''}>${v.ikona} ${v.krotko}</option>`).join('')}</select></div>
        <div><label>Priorytet</label><select id="t_prio">${Object.entries(PRIORYTETY)
          .map(([k,v])=>`<option value="${k}" ${k===d.priorytet?'selected':''}>${v}</option>`).join('')}</select></div>
      </div>
      <div class="field"><label>Maszyna (opcjonalnie)</label><select id="t_masz">${opcje(masz,d.maszynaId,'— nie dotyczy —')}</select></div>
      <div class="field"><label>Pole (opcjonalnie)</label><select id="t_pole">${opcje(pola,d.poleId,'— nie dotyczy —')}</select></div>
      <div class="field"><label>Uwagi</label><input id="t_uwagi" value="${esc(d.uwagi||'')}" placeholder="opcjonalnie"></div>
      <div id="t_err" class="auth-err"></div>
    </div>
    <div class="modal-foot"><div class="spacer"></div>
      <button class="btn" onclick="closeModal()">Anuluj</button>
      <button class="btn primary" onclick="${trybPracownika?'wyslijZgloszenie()':`zapiszZgloszenie('${t?t.id:''}')`}">${trybPracownika?'Wyślij':'Zapisz'}</button></div>`);
}

function zapiszZgloszenie(id){
  const nazwa=val('t_nazwa').trim();
  const err=document.getElementById('t_err');
  if(!nazwa){ err.textContent='Napisz, co trzeba zrobić.'; return; }
  const dane={nazwa, kategoria:val('t_kat'), priorytet:val('t_prio'),
    maszynaId:val('t_masz'), poleId:val('t_pole'), uwagi:val('t_uwagi').trim()};
  if(id){
    Object.assign((state.tasks||[]).find(x=>x.id===id), dane);
  } else {
    const kto=ktoTeraz();
    state.tasks.push(Object.assign({id:uid(), status:'NEW', zadanieId:null,
      zglosilWorkerId:kto.workerId, zgloszono:new Date().toISOString()}, dane));
    // Administrator ma się dowiedzieć o zgłoszeniu z aplikacji, bez maila o każdej lampie.
    if(kto.workerId) createNotification(null,'zgloszenie','Nowe zgłoszenie',kto.kto+': „'+nazwa+'"',{});
  }
  save(); closeModal(); render();
}

/* Zaplanowanie: ten sam formularz zadania co wszędzie, tylko z wypełnionymi danymi.
   Powiązanie dopina się DOPIERO po zapisaniu zadania — gdyby użytkownik się rozmyślił,
   zgłoszenie musi zostać w kolejce jako NEW. */
let _zgloszenieDoPowiazania=null;
function zaplanujZgloszenie(id){
  const t=(state.tasks||[]).find(x=>x.id===id); if(!t) return;
  if(!pracownicyAktywni().length){ alert('Najpierw dodaj pracownika — nie ma komu przypisać pracy.'); return; }
  const m=t.maszynaId?maszynaById(t.maszynaId):null;
  const preset={miejsce:t.kategoria||'inne', zadanie:t.nazwa, opis:t.uwagi||'', priorytet:t.priorytet||'normalny'};
  if(m) { if(jestCiagnik(m)) preset.ciagnikId=m.id; else preset.maszynaId=m.id; }
  if(t.poleId && (t.kategoria==='pole'||t.kategoria==='transport')) preset.poleId=t.poleId;
  _zgloszenieDoPowiazania=t.id;
  openZadanieForm(pracownicyAktywni()[0].id, fmtISO(new Date()), null, preset);
}
function odrzucZgloszenie(id){
  const t=(state.tasks||[]).find(x=>x.id===id); if(!t) return;
  t.status='REJECTED'; t.rozpatrzylKto=ktoTeraz().kto; t.rozpatrzono=new Date().toISOString();
  if(t.zglosilWorkerId) createNotification(t.zglosilWorkerId,'zgloszenie','Zgłoszenie odrzucone','„'+t.nazwa+'"',{});
  save(); render();
}
function przywrocZgloszenie(id){
  const t=(state.tasks||[]).find(x=>x.id===id); if(!t) return;
  t.status='NEW'; delete t.rozpatrzylKto; delete t.rozpatrzono;
  save(); render();
}
function usunZgloszenie(id){
  const t=(state.tasks||[]).find(x=>x.id===id); if(!t) return;
  if(!confirm('Usunąć zgłoszenie „'+t.nazwa+'"? Ślad po nim zniknie na dobre — odrzucenie zachowuje historię.')) return;
  state.tasks=state.tasks.filter(x=>x.id!==id);
  save(); render();
}


/* ═══ SKUP / OBRÓT ZBOŻEM — warstwa danych ═════════════════════════════════════
   Zastępuje dwa zeszyty: „skup i koszenie" oraz „sprzedaż i załadunki".

   ⚠️ TEN MODUŁ NIE DOTYKA `state`, czyli głównego dokumentu gospodarstwa. Docelowo
   mieszka w tabelach (migracja/05_skup.sql) z farm_id i RLS.

   Kształt danych tutaj jest LUSTREM tabel — te same nazwy pól, ten sam podział na część
   operacyjną i finansową, ten sam ledger ruchów. Dzięki temu przejście na Supabase to
   podmiana czterech funkcji dostępu, a nie przepisywanie widoków.

   Tryb lokalny pracuje na własnym kluczu `myagro.skup.demo` — osobnym od danych
   gospodarstwa i jawnie oznaczonym jako demo. Na produkcji brak tabel = wyraźny
   komunikat, nigdy cichy zapis w przeglądarce. */

const SKUP_KLUCZ = 'myagro.skup.demo';
const PRODUKTY_DOMYSLNE = ['Kukurydza','Pszenica','Rzepak','Jęczmień','Żyto','Owies','Pszenżyto','Soja','Inne'];
const TYPY_USLUG = {KOSZENIE:'Koszenie', TRANSPORT:'Transport', SUSZENIE:'Suszenie',
                    CZYSZCZENIE:'Czyszczenie', INNE:'Inne'};
const STATUSY_SPRZEDAZY = {NOWA:'Nowa', W_REALIZACJI:'W realizacji',
                           ZREALIZOWANA:'Zrealizowana', ANULOWANA:'Anulowana'};

let skup = null;        // magazyn danych modułu
let skupBlad = null;    // komunikat, gdy backend niedostępny — NIE ukrywamy go

const skupLokalnie = () => DEV;

function skupPusty(){
  return {seasons:[], products:[], customers:[], vehicles:[], deliveries:[], deliveryFinance:{},
          sales:[], saleFinance:{}, loads:[], loadFinance:{}, services:[], serviceFinance:{},
          payments:[], movements:[], audit:[]};
}

async function skupWczytaj(){
  if(skupLokalnie()){
    try{ const c=localStorage.getItem(SKUP_KLUCZ); skup = c?JSON.parse(c):skupPusty(); }
    catch(e){ skup = skupPusty(); }
    skupBlad=null;
    skupZapewnijSezon(); skupZapewnijProdukty();
    return;
  }
  try{
    const q = t => sb.from(t).select('*');
    const [se,pr,kl,po,dp,sp,za,us,ru] = await Promise.all(
      ['grain_seasons','grain_products','customers','customer_vehicles','grain_deliveries',
       'grain_sales','grain_loads','customer_services','grain_movements'].map(q));
    const blad=[se,pr,kl,po,dp,sp,za,us,ru].map(r=>r.error).find(Boolean);
    if(blad) throw blad;
    skup = Object.assign(skupPusty(), {
      seasons:se.data||[], products:pr.data||[], customers:kl.data||[], vehicles:po.data||[],
      deliveries:dp.data||[], sales:sp.data||[], loads:za.data||[], services:us.data||[],
      movements:ru.data||[]});
    /* Dane finansowe pobieramy OSOBNO i pozwalamy im się nie udać. Pracownik bez
       uprawnienia finansowego dostanie z tych tabel pustkę — i to jest zamierzone,
       a nie awaria. Moduł ma wtedy działać dalej, tylko bez kwot. */
    try{
      const [df,sf,lf,uf,pl] = await Promise.all(['grain_delivery_finance','grain_sale_finance',
        'grain_load_finance','customer_service_finance','grain_payments'].map(q));
      (df.data||[]).forEach(r=>skup.deliveryFinance[r.delivery_id]=r);
      (sf.data||[]).forEach(r=>skup.saleFinance[r.sale_id]=r);
      (lf.data||[]).forEach(r=>skup.loadFinance[r.load_id]=r);
      (uf.data||[]).forEach(r=>skup.serviceFinance[r.service_id]=r);
      skup.payments = pl.data||[];
    }catch(e){ /* brak dostępu do finansów — moduł działa w trybie operacyjnym */ }
    skupBlad=null;
  }catch(e){
    skup=null;
    skupBlad = /does not exist|schema cache/i.test(e.message||'')
      ? 'Tabele modułu Skup nie istnieją jeszcze w bazie. Uruchom migracja/05_skup.sql w Supabase → SQL Editor.'
      : 'Nie udało się wczytać danych skupu: '+(e.message||e);
  }
}

function skupZapisz(){
  if(skupLokalnie()){ try{ localStorage.setItem(SKUP_KLUCZ, JSON.stringify(skup)); }catch(e){} }
}
function skupZapewnijSezon(){
  if(!skup.seasons.some(s=>s.year===view.year))
    skup.seasons.push({id:uid(), year:view.year, is_open:true});
}
function skupZapewnijProdukty(){
  if(!skup.products.length)
    skup.products = PRODUKTY_DOMYSLNE.map((n,i)=>({id:uid(), name:n, sort:i, is_active:true}));
}
const sezonBiezacy = () => skup.seasons.find(s=>s.year===view.year) || skup.seasons[0];
const sezonId = () => (sezonBiezacy()||{}).id;

/* Czy wolno widzieć pieniądze. W trybie lokalnym zawsze tak (jesteś administratorem);
   na produkcji rozstrzyga RLS — brak wierszy w tabelach finansowych = brak kwot. */
function widzeFinanse(){
  if(skupLokalnie()) return true;
  if(trybPracownika && trybPracownika.workerId){
    const w=workerById(trybPracownika.workerId);
    return maUprawnienie(w,'skupFinanse');
  }
  return true;
}

/* ─── Zapis dokumentów ──────────────────────────────────────────────────────── */
/* ⚠️ Dokument i RUCH MAGAZYNOWY powstają razem. W bazie robi to trigger w tej samej
   transakcji; tutaj odtwarzamy tę samą zasadę, żeby podgląd nie kłamał o stanie. */
function ruchDodaj(typ, ilosc, zrodloTyp, zrodloId, produktId, notatka){
  skup.movements.push({id:uid(), season_id:sezonId(), product_id:produktId,
    movement_type:typ, quantity:ilosc, source_origin:'PURCHASED',
    source_type:zrodloTyp, source_id:zrodloId, note:notatka||null,
    created_by:currentEmail||'—', created_at:new Date().toISOString()});
}

function dodajPrzyjecie(d, finanse){
  const rek=Object.assign({id:uid(), season_id:sezonId(), status:'aktywne',
    created_by:currentEmail||'—', created_at:new Date().toISOString()}, d);
  skup.deliveries.push(rek);
  ruchDodaj('DELIVERY', liczba(rek.tons), 'DELIVERY', rek.id, rek.product_id);
  if(finanse && (finanse.price_per_ton || finanse.mowing_price_per_ha))
    skup.deliveryFinance[rek.id]=Object.assign({delivery_id:rek.id}, finanse);
  // Koszenie zapisujemy jako USŁUGĘ — dzięki temu transport czy suszenie dołożą się
  // później bez zmiany struktury przyjęcia.
  if(rek.mowed_by_us && liczba(rek.mowing_ha)>0){
    const u={id:uid(), season_id:sezonId(), customer_id:rek.customer_id, delivery_id:rek.id,
      service_type:'KOSZENIE', quantity:liczba(rek.mowing_ha), unit:'ha',
      performed_at:(rek.delivered_at||'').slice(0,10), status:'aktywna',
      created_by:currentEmail||'—', created_at:new Date().toISOString()};
    skup.services.push(u);
    if(finanse && finanse.mowing_price_per_ha)
      skup.serviceFinance[u.id]={service_id:u.id, price_per_unit:finanse.mowing_price_per_ha};
  }
  skupZapisz(); return rek;
}

function dodajZaladunek(l, finanse){
  const rek=Object.assign({id:uid(), season_id:sezonId(), status:'aktywny',
    created_by:currentEmail||'—', created_at:new Date().toISOString()}, l);
  skup.loads.push(rek);
  ruchDodaj('SALE_LOAD', -liczba(rek.tons), 'LOAD', rek.id, rek.product_id);
  if(finanse && finanse.price_per_ton)
    skup.loadFinance[rek.id]={load_id:rek.id, price_per_ton:finanse.price_per_ton};
  // Zapamiętanie samochodu — następnym razem podpowie się po trzech znakach.
  if(rek.registration_number){
    const rej=rek.registration_number.trim().toUpperCase();
    const byl=skup.vehicles.find(v=>(v.registration_number||'').toUpperCase()===rej);
    if(byl) Object.assign(byl,{trailer_registration:rek.trailer_registration||byl.trailer_registration,
              driver_name:rek.driver_name||byl.driver_name, last_seen:rek.loaded_at});
    else skup.vehicles.push({id:uid(), customer_id:rek.customer_id, registration_number:rej,
              trailer_registration:rek.trailer_registration||null, driver_name:rek.driver_name||null,
              last_seen:rek.loaded_at, created_at:new Date().toISOString()});
  }
  if(rek.sale_id){
    const s=skup.sales.find(x=>x.id===rek.sale_id);
    if(s && s.status==='NOWA'){ s.status='W_REALIZACJI'; }
    if(s){ const p=postepSprzedazy(s); if(p.remaining<=0.0005) s.status='ZREALIZOWANA'; }
  }
  skupZapisz(); return rek;
}

/* Anulowanie NIE kasuje dokumentu — dopisuje ruch odwracający. Historia ma pokazywać,
   że coś przyjechało i zostało cofnięte, a nie że nigdy nie istniało. */
function anulujDokument(rodzaj, id){
  const lista = rodzaj==='przyjecie' ? skup.deliveries : skup.loads;
  const r=lista.find(x=>x.id===id); if(!r) return;
  const aktywny = r.status==='aktywne' || r.status==='aktywny';
  if(!aktywny) return;
  r.status = rodzaj==='przyjecie' ? 'anulowane' : 'anulowany';
  r.cancelled_at=new Date().toISOString(); r.cancelled_by=currentEmail||'—';
  ruchDodaj('REVERSAL', rodzaj==='przyjecie' ? -liczba(r.tons) : liczba(r.tons),
            rodzaj==='przyjecie'?'DELIVERY':'LOAD', r.id, r.product_id, 'anulowanie dokumentu');
  if(rodzaj==='przyjecie') skup.services.filter(u=>u.delivery_id===id).forEach(u=>u.status='anulowana');
  skupZapisz();
}

/* ─── Liczenie ──────────────────────────────────────────────────────────────── */

/* ⚠️ ŚREDNIA WILGOTNOŚĆ JEST WAŻONA TONAMI. Arytmetyczna z 10 t o 30% i 30 t o 35%
   dałaby 32,5% zamiast 33,75% — i na tej liczbie ktoś ustaliłby potrącenie. */
function wilgotnoscWazona(lista){
  const z=lista.filter(x=>x.moisture!=null && liczba(x.tons)>0);
  const tony=z.reduce((s,x)=>s+liczba(x.tons),0);
  if(!tony) return null;
  return z.reduce((s,x)=>s+liczba(x.tons)*liczba(x.moisture),0)/tony;
}

/* 🔑 STAN MAGAZYNU = SUMA RUCHÓW. Nie ma pola `current_stock` i nie wolno go dodać. */
function stanMagazynu(produktId){
  return skup.movements
    .filter(m=>m.season_id===sezonId() && (!produktId || m.product_id===produktId))
    .reduce((s,m)=>s+liczba(m.quantity),0);
}

function postepSprzedazy(s){
  const zal=skup.loads.filter(l=>l.sale_id===s.id && l.status==='aktywny');
  const zaladowano=zal.reduce((a,l)=>a+liczba(l.tons),0);
  const umowne=liczba(s.contract_tons);
  return {loaded:zaladowano, trucks:zal.length,
          remaining:umowne?Math.max(umowne-zaladowano,0):null,
          pct:umowne?Math.min(100, zaladowano/umowne*100):null};
}

const cenaPrzyjecia = d => liczba((skup.deliveryFinance[d.id]||{}).price_per_ton);
const cenaZaladunku = l => liczba((skup.loadFinance[l.id]||{}).price_per_ton
                            || (skup.saleFinance[l.sale_id]||{}).price_per_ton);
const cenaUslugi    = u => liczba((skup.serviceFinance[u.id]||{}).price_per_unit);

/* 🔑 SALDO JEST WYLICZANE, nigdy zapisane. Nie ma „zalega: tak/nie" — taki znacznik
   trzeba by odświeżać przy każdej dostawie, usłudze i wpłacie, a rolnik patrzy na
   niego wypłacając pieniądze.
   ZNAK, opisany raz:
     > 0 → MY winni klientowi   < 0 → KLIENT winien nam   = 0 → rozliczony             */
function saldoKlienta(klientId){
  const sid=sezonId();
  const d=skup.deliveries.filter(x=>x.customer_id===klientId && x.season_id===sid && x.status==='aktywne');
  const u=skup.services.filter(x=>x.customer_id===klientId && x.season_id===sid && x.status==='aktywna');
  const l=skup.loads.filter(x=>x.customer_id===klientId && x.season_id===sid && x.status==='aktywny');
  const p=skup.payments.filter(x=>x.customer_id===klientId && x.season_id===sid && x.status!=='anulowana');
  const zboze   = d.reduce((s,x)=>s+liczba(x.tons)*cenaPrzyjecia(x),0);
  const uslugi  = u.reduce((s,x)=>s+liczba(x.quantity)*cenaUslugi(x),0);
  const sprzedaz= l.reduce((s,x)=>s+liczba(x.tons)*cenaZaladunku(x),0);
  const doKl    = p.filter(x=>x.direction==='TO_CUSTOMER').reduce((s,x)=>s+liczba(x.amount),0);
  const odKl    = p.filter(x=>x.direction==='FROM_CUSTOMER').reduce((s,x)=>s+liczba(x.amount),0);
  return {tony:d.reduce((s,x)=>s+liczba(x.tons),0),
          ha:u.filter(x=>x.service_type==='KOSZENIE').reduce((s,x)=>s+liczba(x.quantity),0),
          wilgotnosc:wilgotnoscWazona(d), zboze, uslugi, sprzedaz, doKl, odKl,
          tonySprzedane:l.reduce((s,x)=>s+liczba(x.tons),0),
          saldo: zboze - uslugi - sprzedaz - doKl + odKl,
          ostatnia:d.map(x=>x.delivered_at).filter(Boolean).sort().pop()};
}

function opisSalda(v){
  const g=Math.round(liczba(v)*100)/100;
  if(Math.abs(g)<0.005) return {tekst:'Rozliczony', kwota:'0 zł', kolor:'var(--color-success)'};
  if(g>0)  return {tekst:'Do wypłaty', kwota:zl(g), kolor:'var(--color-warning)'};
  return   {tekst:'Klient zalega', kwota:zl(-g), kolor:'var(--color-danger)'};
}

const zl  = v => (Math.round(liczba(v)*100)/100).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' zł';
const ton = v => liczba(v).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' t';
const ha_ = v => liczba(v).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' ha';
const proc= v => v==null?'—':(Math.round(v*10)/10).toLocaleString('pl-PL',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const produktNazwa = id => (skup.products.find(p=>p.id===id)||{}).name || '—';
/* Produkt w module Skup rysuje się TĄ SAMĄ ikoną, co uprawa na polu — kukurydza
   przyjęta na wagę i kukurydza rosnąca na polu to ta sama roślina. */
const produktZIkona = id => { const n=produktNazwa(id);
  return n==='—' ? '<span class="muted">—</span>' : uprawaZIkona(n,22); };
const klientById   = id => skup.customers.find(c=>c.id===id);
const nazwaKlienta = id => (klientById(id)||{}).name || '—';

/* ═══ SKUP — widoki ════════════════════════════════════════════════════════════
   Moduł operacyjny: używany przy wadze, w trakcie ładowania samochodu. Gęste tabele,
   duże liczby, minimum klikania. Ten sam design system co reszta aplikacji. */

const SKUP_ZAKLADKI = [['pulpit','Pulpit'],['przyjecia','Przyjęcia'],['klienci','Klienci'],
  ['sprzedaz','Sprzedaż'],['zaladunki','Załadunki'],['magazyn','Magazyn'],['rozliczenia','Rozliczenia']];

function renderSkupModule(){
  if(skupBlad) return `<div class="gr-head pulpit-head"><div><h1>Skup / obrót zbożem</h1></div></div>
    <div class="skup-blad"><b>Moduł nie ma gdzie zapisywać danych</b>
      <div>${esc(skupBlad)}</div>
      <div class="hint" style="margin-top:10px">Celowo nie zapisuję nic lokalnie — wpisane tony
        i tak by przepadły, a moduł wyglądałby na działający.</div></div>`;
  if(!skup) return `<div class="skup-blad">Wczytywanie…</div>`;
  if(view.skupKlient) return renderKartaKlienta();

  const z=view.skupTab||'pulpit';
  const head=naglowekStrony('skup','Skup / zboże','Przyjęcia, koszenie, sprzedaż i załadunki — sezon '+view.year,
    `<button class="btn primary" onclick="openPrzyjecie()">+ Przyjęcie</button>
     <button class="btn primary" onclick="openZaladunek()">+ Załadunek</button>`)+`
    <div class="skup-nav">${SKUP_ZAKLADKI.map(([k,l])=>
      `<button class="sn-tab${z===k?' akt':''}" onclick="skupTab('${k}')">${l}</button>`).join('')}</div>`;

  const widoki={pulpit:skupPulpit, przyjecia:skupPrzyjecia, klienci:skupKlienci,
    sprzedaz:skupSprzedaz, zaladunki:skupZaladunki, magazyn:skupMagazyn, rozliczenia:skupRozliczenia};
  return head + (widoki[z]||skupPulpit)();
}
function skupTab(k){ view.skupTab=k; view.skupKlient=null; render(); }

const wSezonie = l => l.filter(x=>x.season_id===sezonId());
const aktywne  = l => l.filter(x=>x.status==='aktywne'||x.status==='aktywny'||x.status==='aktywna');

/* ─── PULPIT ────────────────────────────────────────────────────────────────── */
function skupPulpit(){
  const d=aktywne(wSezonie(skup.deliveries)), l=aktywne(wSezonie(skup.loads));
  const u=aktywne(wSezonie(skup.services));
  const dzis=fmtISO(new Date());
  const dD=d.filter(x=>(x.delivered_at||'').slice(0,10)===dzis);
  const dL=l.filter(x=>(x.loaded_at||'').slice(0,10)===dzis);
  const nieroz=skup.customers.filter(c=>Math.abs(saldoKlienta(c.id).saldo)>=0.005).length;

  const kafel=(w,e,akc)=>`<div class="skup-kafel"${akc?` onclick="${akc}"`:''}>
    <div class="sk-w">${w}</div><div class="sk-e">${e}</div></div>`;

  const ostatnie=[...dD.map(x=>({t:x.delivered_at,typ:'P',x})), ...dL.map(x=>({t:x.loaded_at,typ:'Z',x}))]
    .sort((a,b)=>(b.t||'').localeCompare(a.t||'')).slice(0,10)
    .map(({t,typ,x})=>`<tr>
      <td class="mono">${esc((t||'').slice(11,16))}</td>
      <td><span class="sk-typ ${typ==='P'?'p':'z'}">${typ==='P'?'Przyjęcie':'Załadunek'}</span></td>
      <td>${esc(nazwaKlienta(x.customer_id))}</td>
      <td>${produktZIkona(x.product_id)}</td>
      <td class="lc"><b>${ton(x.tons)}</b></td>
      <td class="lc">${proc(x.moisture)}</td>
      <td class="rej">${esc(x.registration_number||'')}</td></tr>`).join('');

  return `<div class="skup-kafle">
      ${kafel(ton(d.reduce((s,x)=>s+liczba(x.tons),0)),'przyjęto',"skupTab('przyjecia')")}
      ${kafel(ton(l.reduce((s,x)=>s+liczba(x.tons),0)),'wydano',"skupTab('zaladunki')")}
      ${kafel(ton(stanMagazynu()),'stan',"skupTab('magazyn')")}
      ${kafel(ha_(u.filter(x=>x.service_type==='KOSZENIE').reduce((s,x)=>s+liczba(x.quantity),0)),'skoszono')}
      ${kafel(proc(wilgotnoscWazona(d)),'śr. wilgotność ważona')}
      ${kafel(skup.customers.length,'klientów',"skupTab('klienci')")}
      ${kafel(nieroz,'nierozliczonych',"skupTab('rozliczenia')")}
    </div>
    <div class="gr-podsum"><span class="gr-ps-tyt">Dzisiaj</span>
      <span><b>${dD.length}</b> przyjęć</span>
      <span><b>${ton(dD.reduce((s,x)=>s+liczba(x.tons),0))}</b> przyjęto</span>
      <span><b>${dL.length}</b> załadunków</span>
      <span><b>${ton(dL.reduce((s,x)=>s+liczba(x.tons),0))}</b> wydano</span>
      <span><b>${proc(wilgotnoscWazona(dD))}</b> śr. wilgotność</span>
      <span><b>${ton(dD.reduce((s,x)=>s+liczba(x.tons),0)-dL.reduce((s,x)=>s+liczba(x.tons),0))}</b> bilans dnia</span>
    </div>
    <div class="sb-title" style="margin-top:16px">Ostatnie operacje</div>
    ${ostatnie?`<div class="fl-tab-wrap"><table class="fl-tab skup-tab"><thead><tr>
      <th>Godz.</th><th>Typ</th><th>Klient / odbiorca</th><th>Produkt</th>
      <th class="lc">Tony</th><th class="lc">Wilg.</th><th>Rejestracja</th></tr></thead>
      <tbody>${ostatnie}</tbody></table></div>`
      :`<div class="skup-pusto2">Dziś jeszcze nic nie wjechało ani nie wyjechało.</div>`}`;
}

/* ─── PRZYJĘCIA ─────────────────────────────────────────────────────────────── */

      <th class="lc">Koszenie</th>${widzeFinanse()?'<th class="lc">Cena/t</th><th class="lc">Wartość</th>':''}
      <th>Wpisał</th><th></th></tr></thead><tbody>
    ${d.filter(pasujeSzuk).map(x=>{
      const anul=x.status==='anulowane';
      return `<tr class="${anul?'wiersz-anulowany':''}">
      <td class="mono">${esc(dataGodz(x.delivered_at))}</td>
      <td><b>${esc(nazwaKlienta(x.customer_id))}</b></td>
      <td>${produktZIkona(x.product_id)}</td>

        <td class="lc"><b>${zl(liczba(x.tons)*cenaPrzyjecia(x))}</b></td>`:''}
      <td class="pr-sub">${esc(x.created_by||'')}</td>

    </tbody><tfoot><tr><td colspan="3">Razem ${akt.length} aktywnych</td>
      <td class="lc"><b>${ton(akt.reduce((s,x)=>s+liczba(x.tons),0))}</b></td>
      <td class="lc"><b>${proc(wilgotnoscWazona(akt))}</b></td>

/* ─── KLIENCI ───────────────────────────────────────────────────────────────── */
function skupKlienci(){
  if(!skup.customers.length) return pustaSekcja('Brak klientów','+ Klient','openKlientForm()');
  const f=view.skupFiltr||'';
  const chip=(k,l)=>`<button class="gr-chip${f===k?' akt':''}" onclick="view.skupFiltr='${k}';render()">${l}</button>`;
  const wiersze=skup.customers.filter(pasujeKlient).map(c=>{
      const s=saldoKlienta(c.id), o=opisSalda(s.saldo);
      const kat = Math.abs(s.saldo)<0.005?'rozliczony':(s.saldo>0?'wyplata':'zalega');
      if(f && f!==kat) return '';
      return `<tr onclick="pokazKlienta('${c.id}')">
        <td><b>${esc(c.name)}</b>${c.company_name?`<div class="pr-sub">${esc(c.company_name)}</div>`:''}</td>
        <td class="lc">${s.tony?ton(s.tony):'—'}</td>
        <td class="lc">${s.ha?ha_(s.ha):'—'}</td>
        <td class="lc">${proc(s.wilgotnosc)}</td>
        ${widzeFinanse()?`<td class="lc">${zl(s.zboze)}</td>`:''}
        <td><span class="saldo" style="color:${o.kolor}">● ${esc(o.tekst)}${o.tekst!=='Rozliczony'?' '+o.kwota:''}</span></td>
        <td class="lc">${s.ostatnia?esc(dataGodz(s.ostatnia).slice(0,5)):'—'}</td></tr>`;
    }).join('');
  return szukajka()
    + `<div class="gr-chipy" style="margin-bottom:10px">${chip('','Wszyscy')}${chip('rozliczony','Rozliczeni')}${chip('wyplata','Do wypłaty')}${chip('zalega','Zalegają')}
       <button class="btn small" style="margin-left:auto" onclick="openKlientForm()">+ Klient</button></div>`
    + `<div class="fl-tab-wrap"><table class="fl-tab skup-tab"><thead><tr>
      <th>Klient</th><th class="lc">Tony</th><th class="lc">Koszenie</th><th class="lc">Śr. wilg.</th>
      ${widzeFinanse()?'<th class="lc">Wartość</th>':''}<th>Saldo</th><th class="lc">Ostatnie</th></tr></thead>
      <tbody>${wiersze||`<tr><td colspan="7" class="skup-pusto">Nic nie pasuje.</td></tr>`}</tbody></table></div>`;
}

/* ─── MAGAZYN ───────────────────────────────────────────────────────────────── */
function skupMagazyn(){
  const ruchy=skup.movements.filter(m=>m.season_id===sezonId());
  const wgProd={};
  ruchy.forEach(m=>{ wgProd[m.product_id]=(wgProd[m.product_id]||0)+liczba(m.quantity); });
  const TYP={DELIVERY:'Przyjęcie',SALE_LOAD:'Załadunek',ADJUSTMENT_PLUS:'Korekta +',
    ADJUSTMENT_MINUS:'Korekta −',REVERSAL:'Odwrócenie',DRYING:'Suszenie',
    CLEANING:'Czyszczenie',LOSS:'Ubytek',TRANSFER:'Przesunięcie'};
  return `<div class="skup-info">Stan magazynu <b>nie jest zapisany</b> — wylicza się jako suma
      wszystkich ruchów. Anulowanie dokumentu dopisuje ruch odwracający, dzięki czemu stan
      zawsze zgadza się z historią.</div>
    <div class="fl-tab-wrap"><table class="fl-tab skup-tab"><thead><tr>
      <th>Produkt</th><th class="lc">Stan</th></tr></thead><tbody>
      ${Object.entries(wgProd).filter(([,v])=>Math.abs(v)>0.0005).map(([p,v])=>
        `<tr><td><b>${esc(produktNazwa(p))}</b></td><td class="lc"><b>${ton(v)}</b></td></tr>`).join('')
        || `<tr><td colspan="2" class="skup-pusto">Brak ruchów w sezonie ${view.year}.</td></tr>`}
      </tbody><tfoot><tr><td>Razem</td><td class="lc"><b>${ton(stanMagazynu())}</b></td></tr></tfoot></table></div>
    <div class="sb-title" style="margin-top:18px">Ruchy magazynowe</div>
    <div class="fl-tab-wrap"><table class="fl-tab skup-tab"><thead><tr>
      <th>Data</th><th>Typ</th><th>Produkt</th><th class="lc">Ilość</th><th>Źródło</th><th>Wpisał</th></tr></thead><tbody>
      ${ruchy.slice().sort((a,b)=>(b.created_at||'').localeCompare(a.created_at||'')).slice(0,60).map(m=>
        `<tr><td class="mono">${esc(dataGodz(m.created_at))}</td>
          <td>${esc(TYP[m.movement_type]||m.movement_type)}</td>
          <td>${esc(produktNazwa(m.product_id))}</td>
          <td class="lc"><b style="color:${liczba(m.quantity)>0?'var(--color-success)':'var(--color-danger)'}">${liczba(m.quantity)>0?'+':''}${ton(m.quantity)}</b></td>
          <td class="pr-sub">${esc(m.note||m.source_type||'')}</td>
          <td class="pr-sub">${esc(m.created_by||'')}</td></tr>`).join('')}
      </tbody></table></div>`;
}

/* ─── ROZLICZENIA ───────────────────────────────────────────────────────────── */
function skupRozliczenia(){
  if(!widzeFinanse()) return `<div class="skup-blad"><b>Brak dostępu do danych finansowych</b>
    <div>To konto nie ma uprawnienia do cen i rozliczeń. Ceny nie są ukryte w przeglądarce —
      nie zostały pobrane z bazy.</div></div>`;
  const kl=skup.customers.map(c=>({c, s:saldoKlienta(c.id)}))
    .filter(x=>Math.abs(x.s.saldo)>=0.005)
    .sort((a,b)=>b.s.saldo-a.s.saldo);
  const doWyplaty=kl.filter(x=>x.s.saldo>0).reduce((s,x)=>s+x.s.saldo,0);
  const zalega=kl.filter(x=>x.s.saldo<0).reduce((s,x)=>s-x.s.saldo,0);
  return `<div class="gr-podsum"><span class="gr-ps-tyt">Rozliczenia</span>
      <span><b>${zl(doWyplaty)}</b> do wypłaty klientom</span>
      <span><b>${zl(zalega)}</b> należne nam</span>
      <span><b>${kl.length}</b> nierozliczonych</span></div>
    ${kl.length?`<div class="fl-tab-wrap"><table class="fl-tab skup-tab"><thead><tr>
      <th>Klient</th><th class="lc">Zboże</th><th class="lc">Usługi</th><th class="lc">Wypłacono</th>
      <th class="lc">Otrzymano</th><th>Saldo</th><th></th></tr></thead><tbody>
      ${kl.map(({c,s})=>{ const o=opisSalda(s.saldo); return `<tr onclick="pokazKlienta('${c.id}')">
        <td><b>${esc(c.name)}</b></td>
        <td class="lc">${zl(s.zboze)}</td><td class="lc">${zl(s.uslugi)}</td>
        <td class="lc">${zl(s.doKl)}</td><td class="lc">${zl(s.odKl)}</td>
        <td><span class="saldo" style="color:${o.kolor}">● ${esc(o.tekst)} ${o.kwota}</span></td>
        <td><button class="btn small" onclick="event.stopPropagation();openPlatnosc('${c.id}')">+ Płatność</button></td>
      </tr>`;}).join('')}</tbody></table></div>`
      :`<div class="skup-pusto2">Wszyscy rozliczeni.</div>`}`;
}

/* ─── Karta klienta ─────────────────────────────────────────────────────────── */

    <div class="sb-title" style="margin-top:18px">Usługi</div>

      <th>Data</th><th>Usługa</th><th class="lc">Ilość</th>${widzeFinanse()?'<th class="lc">Cena</th><th class="lc">Wartość</th>':''}</tr></thead><tbody>
      ${u.map(x=>`<tr><td class="mono">${esc(x.performed_at||'')}</td>
        <td>${esc(TYPY_USLUG[x.service_type]||x.service_type)}</td>
        <td class="lc"><b>${liczba(x.quantity).toLocaleString('pl-PL')} ${esc(x.unit)}</b></td>
        ${widzeFinanse()?`<td class="lc">${cenaUslugi(x)?zl(cenaUslugi(x)):'—'}</td>
          <td class="lc"><b>${zl(liczba(x.quantity)*cenaUslugi(x))}</b></td>`:''}</tr>`).join('')}
      </tbody></table></div>`:`<div class="skup-pusto2">Brak usług.</div>`}
    ${widzeFinanse()?`<div class="sb-title" style="margin-top:18px">Płatności</div>
    ${p.length?`<div class="fl-tab-wrap"><table class="fl-tab skup-tab"><thead><tr>
      <th>Data</th><th>Kierunek</th><th class="lc">Kwota</th><th>Forma</th><th>Dokument</th></tr></thead><tbody>
      ${p.map(x=>`<tr><td class="mono">${esc(x.paid_at||'')}</td>
        <td>${x.direction==='TO_CUSTOMER'?'wypłacono klientowi':'otrzymano od klienta'}</td>
        <td class="lc"><b>${zl(x.amount)}</b></td><td>${esc(x.method||'')}</td>
        <td>${esc(x.document_no||'')}</td></tr>`).join('')}
      </tbody></table></div>`:`<div class="skup-pusto2">Brak płatności.</div>`}`:''}`;
}

/* ─── Pomocnicze ────────────────────────────────────────────────────────────── */
function pustaSekcja(tytul, przycisk, akcja){
  return `<div class="empty-state"><div class="big">${esc(tytul)}</div>
    <div style="margin-bottom:16px">Zacznij od pierwszego wpisu — resztę policzy system.</div>
    <button class="btn primary" onclick="${akcja}">${esc(przycisk)}</button></div>`;
}
function szukajka(ph){
  return `<div class="skup-szukaj"><input placeholder="🔍 ${esc(ph||'Klient, firma, NIP, rejestracja, WZ…')}"
    value="${esc(view.skupSzukaj||'')}" oninput="view.skupSzukaj=this.value;render()"></div>`;
}
const szukTekst = () => (view.skupSzukaj||'').trim().toLowerCase();
const zawiera = (v,q) => String(v||'').toLowerCase().includes(q);
function pasujeSzuk(x){ const q=szukTekst(); if(!q) return true;
  return zawiera(nazwaKlienta(x.customer_id),q)||zawiera(produktNazwa(x.product_id),q)
      || zawiera(x.registration_number,q)||zawiera(x.notes,q); }
function pasujeZaladunek(x){ const q=szukTekst(); if(!q) return true;
  return zawiera(x.registration_number,q)||zawiera(x.trailer_registration,q)||zawiera(x.document_no,q)
      || zawiera(x.driver_name,q)||zawiera(nazwaKlienta(x.customer_id),q)||zawiera(produktNazwa(x.product_id),q); }
function pasujeKlient(c){ const q=szukTekst(); if(!q) return true;
  return zawiera(c.name,q)||zawiera(c.company_name,q)||zawiera(c.nip,q)||zawiera(c.city,q)
      || skup.loads.some(l=>l.customer_id===c.id && zawiera(l.registration_number,q)); }
function dataGodz(iso){ if(!iso) return ''; const d=new Date(iso);
  return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')
    +' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function anuluj(rodzaj,id){
  const co = rodzaj==='przyjecie'?'przyjęcie':'załadunek';
  if(!confirm('Anulować '+co+'?\n\nDokument zostanie w historii, a stan magazynu skoryguje się ruchem odwracającym. Nic nie zniknie z bazy.')) return;
  anulujDokument(rodzaj,id); render();
}

/* ═══ SKUP — formularze ════════════════════════════════════════════════════════
   ⚠️ To są formularze WAGOWE, wypełniane przy stojącym samochodzie. Kolejność pól idzie
   za kolejnością czynności, pola liczbowe mają klawiaturę numeryczną, a po zapisaniu
   od razu można wpisać następny wpis — bez wracania przez cztery ekrany. */

const teraz = () => new Date().toISOString().slice(0,16);
const opcjeLista=(l,wyb,pusty)=>`<option value="">${pusty}</option>`+
  l.map(o=>`<option value="${o.v}" ${o.v===wyb?'selected':''}>${esc(o.t)}</option>`).join('');
const listaKlientow = () => skup.customers.map(c=>({v:c.id,t:c.name+(c.company_name?' · '+c.company_name:'')}));
const listaProduktow = () => skup.products.filter(p=>p.is_active!==false).map(p=>({v:p.id,t:p.name}));

/* Ostrzegamy, nie blokujemy. 92 t na jednym samochodzie to prawie na pewno pomyłka,
   ale bywają zestawy nietypowe — decyzja należy do człowieka przy wadze. */
function tonyPodejrzane(t){ return liczba(t) > 45; }

/* ─── PRZYJĘCIE ─────────────────────────────────────────────────────────────── */
function openPrzyjecie(klientId){
  if(!skup.customers.length && !klientId){
    if(confirm('Nie ma jeszcze żadnego klienta. Dodać teraz?')) openKlientForm();
    return;
  }
  const prod=listaProduktow();
  openModal(`
    <div class="modal-head"><h3>Przyjęcie zboża</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body skup-form">
      <div class="field row2">
        <div><label>Data i godzina</label><input id="p_data" type="datetime-local" value="${teraz()}"></div>
        <div><label>Produkt</label><select id="p_prod">${opcjeLista(prod, prod[0]&&prod[0].v, '— wybierz —')}</select></div>
      </div>
      <div class="field"><label>Klient</label>
        <select id="p_klient">${opcjeLista(listaKlientow(), klientId||'', '— wybierz —')}</select>
        <button class="btn small" style="margin-top:6px" onclick="closeModal();openKlientForm(null,'przyjecie')">+ Nowy klient</button></div>
      <div class="field row2">
        <div><label>Tony</label><input id="p_tony" class="duze" inputmode="decimal" placeholder="24,80" autofocus
          oninput="przeliczPrzyjecie()"></div>
        <div><label>Wilgotność %</label><input id="p_wilg" class="duze" inputmode="decimal" placeholder="31,4"></div>
      </div>
      <div class="field"><label>Czy kosiliśmy klientowi?</label>
        <div class="przelacz2">
          <button class="pz akt" id="p_kos_nie" onclick="ustawKoszenie(false)">Nie</button>
          <button class="pz" id="p_kos_tak" onclick="ustawKoszenie(true)">Tak</button>
        </div></div>
      <div id="p_koszenie" style="display:none">
        <div class="field row2">
          <div><label>Powierzchnia (ha)</label><input id="p_ha" class="duze" inputmode="decimal" placeholder="12,40" oninput="przeliczPrzyjecie()"></div>
          <div><label>Cena koszenia zł/ha</label><input id="p_cena_ha" inputmode="decimal" placeholder="450" oninput="przeliczPrzyjecie()"></div>
        </div></div>
      <div class="field"><label>Cena zboża zł/t</label>
        <input id="p_cena" inputmode="decimal" placeholder="420" oninput="przeliczPrzyjecie()">
        <div class="hint">Możesz zostawić puste — wartość dopiszesz przy rozliczeniu.</div></div>
      <div class="skup-podsum" id="p_podsum"></div>
      <div class="field"><label>Uwagi</label><input id="p_uwagi" placeholder="opcjonalnie"></div>
      <div id="p_err" class="auth-err"></div>
    </div>
    <div class="modal-foot"><div class="spacer"></div>
      <button class="btn" onclick="closeModal()">Anuluj</button>
      <button class="btn primary" onclick="zapiszPrzyjecie()">Zapisz przyjęcie</button></div>`);
  przeliczPrzyjecie();
}
function ustawKoszenie(tak){
  document.getElementById('p_kos_tak').classList.toggle('akt',tak);
  document.getElementById('p_kos_nie').classList.toggle('akt',!tak);
  // Bez koszenia pola hektarów nie mają czego opisywać — chowamy je zamiast pytać na pusto.
  document.getElementById('p_koszenie').style.display = tak?'block':'none';
  przeliczPrzyjecie();
}
function przeliczPrzyjecie(){
  const t=liczba(val('p_tony')), c=liczba(val('p_cena'));
  const kos=document.getElementById('p_kos_tak').classList.contains('akt');
  const ha=kos?liczba(val('p_ha')):0, ch=kos?liczba(val('p_cena_ha')):0;
  const el=document.getElementById('p_podsum'); if(!el) return;
  const cz=[];
  if(t&&c)   cz.push(`<span><b>${zl(t*c)}</b>wartość zboża</span>`);
  if(ha&&ch) cz.push(`<span><b>${zl(ha*ch)}</b>koszenie</span>`);
  if(t&&c&&ha&&ch) cz.push(`<span><b>${zl(t*c-ha*ch)}</b>do wypłaty klientowi</span>`);
  el.innerHTML = cz.length?cz.join(''):'<span class="hint">Wpisz tony i cenę, żeby zobaczyć wartość.</span>';
}
function zapiszPrzyjecie(){
  const err=document.getElementById('p_err');
  const klient=val('p_klient'), prod=val('p_prod'), tony=liczba(val('p_tony'));
  if(!klient){ err.textContent='Wybierz klienta.'; return; }
  if(!prod){ err.textContent='Wybierz produkt.'; return; }
  if(!(tony>0)){ err.textContent='Podaj ilość ton większą od zera.'; return; }
  const wilg=val('p_wilg')?liczba(val('p_wilg')):null;
  if(wilg!=null && (wilg<0||wilg>100)){ err.textContent='Wilgotność musi mieścić się w 0–100%.'; return; }
  if(tonyPodejrzane(tony) && !confirm('Czy na pewno '+ton(tony)+' na jednym przyjęciu?')) return;
  const kos=document.getElementById('p_kos_tak').classList.contains('akt');
  const ha=kos?liczba(val('p_ha')):0;
  if(kos && !(ha>0)){ err.textContent='Zaznaczyłeś koszenie — podaj powierzchnię w ha.'; return; }

  dodajPrzyjecie({
    customer_id:klient, product_id:prod, delivered_at:new Date(val('p_data')).toISOString(),
    tons:tony, moisture:wilg, mowed_by_us:kos, mowing_ha:kos?ha:null, notes:val('p_uwagi').trim(),
  },{ price_per_ton:val('p_cena')?liczba(val('p_cena')):null,
      mowing_price_per_ha:kos&&val('p_cena_ha')?liczba(val('p_cena_ha')):null });
  closeModal(); render();
  poZapisie('Przyjęcie zapisane · '+ton(tony), '+ Następne przyjęcie', 'openPrzyjecie()');
}

/* ─── ZAŁADUNEK ─────────────────────────────────────────────────────────────── */
function openZaladunek(sprzedazId, powtorz){
  const prod=listaProduktow();
  const s=sprzedazId?skup.sales.find(x=>x.id===sprzedazId):null;
  // „Powtórz poprzedni" kopiuje odbiorcę, produkt i kontrakt, ale ŚWIADOMIE nie kopiuje
  // ton, wilgotności ani rejestracji — to są dane tego konkretnego samochodu i przepisane
  // z poprzedniego byłyby fałszywe.
  const o = powtorz || (s?{customer_id:s.customer_id, product_id:s.product_id, sale_id:s.id}:{});
  const sprzedaze=wSezonie(skup.sales).filter(x=>x.status!=='ANULOWANA')
    .map(x=>{ const p=postepSprzedazy(x);
      return {v:x.id, t:nazwaKlienta(x.customer_id)+' · '+produktNazwa(x.product_id)
        +(x.contract_tons?` · zostało ${ton(p.remaining)}`:' · bez kontraktu')}; });
  const ostatni=wSezonie(skup.loads).filter(l=>l.status==='aktywny')
    .sort((a,b)=>(b.loaded_at||'').localeCompare(a.loaded_at||''))[0];

  openModal(`
    <div class="modal-head"><h3>Załadunek</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="modal-body skup-form">
      ${ostatni&&!powtorz?`<button class="btn small" style="width:100%;justify-content:center;margin-bottom:12px"
        onclick="powtorzZaladunek('${ostatni.id}')">↻ Powtórz poprzedni (${esc(nazwaKlienta(ostatni.customer_id))})</button>`:''}
      <div class="field row2">
        <div><label>Data i godzina</label><input id="z_data" type="datetime-local" value="${teraz()}"></div>
        <div><label>Produkt</label><select id="z_prod">${opcjeLista(prod,o.product_id||(prod[0]&&prod[0].v),'— wybierz —')}</select></div>
      </div>
      ${sprzedaze.length?`<div class="field"><label>Sprzedaż / kontrakt</label>
        <select id="z_sprzedaz" onchange="sprzedazWybrana()">${opcjeLista(sprzedaze,o.sale_id||'','— bez kontraktu —')}</select></div>`
        :`<input type="hidden" id="z_sprzedaz" value="">`}
      <div class="field"><label>Odbiorca</label>
        <select id="z_klient">${opcjeLista(listaKlientow(),o.customer_id||'','— wybierz —')}</select></div>
      <div class="field row2">
        <div><label>Tony</label><input id="z_tony" class="duze" inputmode="decimal" placeholder="25,60" autofocus></div>
        <div><label>Wilgotność %</label><input id="z_wilg" class="duze" inputmode="decimal" placeholder="28,4"></div>
      </div>
      <div class="field row2">
        <div><label>Nr rejestracyjny</label>
          <input id="z_rej" list="lista_rej" placeholder="BIA 12345" oninput="rejWybrana()" style="text-transform:uppercase">
          <datalist id="lista_rej">${skup.vehicles.map(v=>`<option value="${esc(v.registration_number)}">`).join('')}</datalist></div>
        <div><label>Nr naczepy</label><input id="z_nacz" placeholder="opcjonalnie" style="text-transform:uppercase"></div>
      </div>
      <div class="field row2">
        <div><label>Kierowca</label><input id="z_kier" placeholder="opcjonalnie"></div>
        <div><label>Nr WZ / dokumentu</label><input id="z_wz" placeholder="opcjonalnie"></div>
      </div>
      <div class="field"><label>Cena zł/t</label><input id="z_cena" inputmode="decimal"
        value="${o.price_per_ton||''}" placeholder="z kontraktu, jeśli pusto"></div>
      <div class="field"><label>Uwagi</label><input id="z_uwagi" placeholder="opcjonalnie"></div>
      <div id="z_err2" class="auth-err"></div>
    </div>
    <div class="modal-foot"><div class="spacer"></div>
      <button class="btn" onclick="closeModal()">Anuluj</button>
      <button class="btn primary" onclick="zapiszZaladunek()">Zapisz załadunek</button></div>`);
}
function powtorzZaladunek(id){
  const l=skup.loads.find(x=>x.id===id); if(!l) return;
  closeModal();
  openZaladunek(null, {customer_id:l.customer_id, product_id:l.product_id, sale_id:l.sale_id,
    price_per_ton:(skup.loadFinance[l.id]||{}).price_per_ton});
}
function sprzedazWybrana(){
  const s=skup.sales.find(x=>x.id===val('z_sprzedaz')); if(!s) return;
  const k=document.getElementById('z_klient'), p=document.getElementById('z_prod');
  if(k) k.value=s.customer_id;
  if(p) p.value=s.product_id;
  const c=(skup.saleFinance[s.id]||{}).price_per_ton;
  const ce=document.getElementById('z_cena'); if(ce && c && !ce.value) ce.value=c;
}
/* Znany samochód podpowiada naczepę i kierowcę — ale tylko wypełnia puste pola,
   nigdy nie nadpisuje tego, co człowiek zdążył wpisać. */
function rejWybrana(){
  const rej=(val('z_rej')||'').trim().toUpperCase();
  const v=skup.vehicles.find(x=>(x.registration_number||'').toUpperCase()===rej); if(!v) return;
  const n=document.getElementById('z_nacz'), k=document.getElementById('z_kier');
  if(n && !n.value && v.trailer_registration) n.value=v.trailer_registration;
  if(k && !k.value && v.driver_name) k.value=v.driver_name;
}
function zapiszZaladunek(){
  const err=document.getElementById('z_err2');
  const tony=liczba(val('z_tony')), rej=(val('z_rej')||'').trim().toUpperCase();
  const klient=val('z_klient'), prod=val('z_prod');
  if(!prod){ err.textContent='Wybierz produkt.'; return; }
  if(!(tony>0)){ err.textContent='Podaj ilość ton większą od zera.'; return; }
  if(!rej){ err.textContent='Podaj numer rejestracyjny.'; return; }
  if(!klient){ err.textContent='Wybierz odbiorcę.'; return; }
  const wilg=val('z_wilg')?liczba(val('z_wilg')):null;
  if(wilg!=null && (wilg<0||wilg>100)){ err.textContent='Wilgotność musi mieścić się w 0–100%.'; return; }
  if(tonyPodejrzane(tony) && !confirm('Czy na pewno '+ton(tony)+' na jednym samochodzie?')) return;
  const stan=stanMagazynu(prod);
  if(tony>stan && !confirm('Na stanie jest '+ton(stan)+', a ładujesz '+ton(tony)
      +'.\n\nStan zejdzie poniżej zera. Zapisać mimo to?')) return;

  dodajZaladunek({customer_id:klient, product_id:prod, sale_id:val('z_sprzedaz')||null,
    loaded_at:new Date(val('z_data')).toISOString(), tons:tony, moisture:wilg,
    registration_number:rej, trailer_registration:(val('z_nacz')||'').trim().toUpperCase()||null,
    driver_name:val('z_kier').trim()||null, document_no:val('z_wz').trim()||null,
    notes:val('z_uwagi').trim()},
    {price_per_ton:val('z_cena')?liczba(val('z_cena')):null});
  closeModal(); render();
  poZapisie('Załadunek zapisany · '+ton(tony)+' · '+rej, '+ Następny załadunek', 'openZaladunek()');
}

      <div class="field"><label>Uwagi</label><input id="k_uwagi" value="${c?esc(c.notes||''):''}"></div>
      <div id="k_err" class="auth-err"></div>
    </div>
    <div class="modal-foot"><div class="spacer"></div>
      <button class="btn" onclick="closeModal()">Anuluj</button>

function zapiszKlienta(id, potem){
  const nazwa=val('k_nazwa').trim();
  if(!nazwa){ document.getElementById('k_err').textContent='Podaj nazwę klienta.'; return; }
  const dane={name:nazwa, company_name:val('k_firma').trim()||null, nip:val('k_nip').trim()||null,
    phone:val('k_tel').trim()||null, email:val('k_mail').trim()||null,
    address:val('k_adres').trim()||null, city:val('k_miasto').trim()||null,
    notes:val('k_uwagi').trim()||null};
  let nowy=null;
  if(id) Object.assign(klientById(id), dane, {updated_by:currentEmail||'—', updated_at:new Date().toISOString()});
  else { nowy=Object.assign({id:uid(), is_active:true, created_by:currentEmail||'—',
           created_at:new Date().toISOString()}, dane); skup.customers.push(nowy); }
  skupZapisz(); closeModal(); render();
  if(potem==='przyjecie') openPrzyjecie(nowy?nowy.id:id);
}

function openSprzedaz(){
  const prod=listaProduktow();
  openModal(`

/* Po zapisie: potwierdzenie i od razu droga do następnego wpisu. W sezonie wpisów jest
   kilkadziesiąt dziennie — powrót przez menu byłby karą. */
function poZapisie(tekst, etykieta, akcja){
  document.getElementById('mfx-toast')?.remove();
  const t=document.createElement('div'); t.id='mfx-toast';
  t.innerHTML=`<span>✓ ${esc(tekst)}</span>
    <button onclick="document.getElementById('mfx-toast').remove();${akcja}">${esc(etykieta)}</button>`;
  t.className='toast-akcja';
  document.body.appendChild(t);
  setTimeout(()=>{ const e=document.getElementById('mfx-toast'); if(e) e.remove(); }, 9000);
}

/* Pozycje kanału aktywności osobno, bo używa ich i szeroki kanał, i wąska sekcja
   „AKTYWNOŚĆ" w panelu operacyjnym Pulpitu. Jedna lista, dwa opakowania. */
function feedItemsHtml(limit){
  const A=aggregateActivity().slice(0,limit||16);
  const SB={done:['st-done','Wykonane'],plan:['st-plan','Zaplanowane']};
  if(!A.length) return `<div class="z-empty" style="padding:16px">Brak aktywności. Dodaj zabiegi, przeglądy lub zdarzenia.</div>`;
  return A.map(a=>{
    const [cls,lab]=SB[a.status]||SB.done;
    return `<div class="feed-item">
      <div class="feed-ic" style="background:${a.color}">${icon(a.ic,17)}</div>
      <div class="feed-main"><div class="feed-title">${esc(a.title||'')}</div>
        <div class="feed-sub">${esc(a.sub||'')}</div>
        <div class="feed-date">${a.date?new Date(a.date).toLocaleDateString('pl-PL'):'—'}</div></div>
      <span class="st-badge ${cls}">${lab}</span></div>`;
  }).join('');
}
/* ═══ PULPIT — centrum operacyjne ══════════════════════════════════════════════
   Ma odpowiadać na pięć pytań w kilka sekund: KTO pracuje · CO robi · GDZIE · CZYM ·
   CO JESZCZE zostało. Mapa niesie „gdzie", panel po prawej resztę.
   ⚠️ Wszystko czyta `state.schedule` — ten sam grafik, co Flota, mapa i karty pól.
   Nie zakładaj tu drugiej listy zadań: jedno zadanie, jedno miejsce zapisu. */

/* Zadania na dziś. Wykonane zostają w wykazie — dzień ma być widoczny w całości,
   także to, co już zamknięte; wypadają tylko anulowane. */
function zadaniaDzis(){
  const d=fmtISO(new Date());
  return state.schedule.filter(z=>z.date===d && z.status!=='anulowane')
    .sort((a,b)=>(a.od||'').localeCompare(b.od||''));
}
function maszynyWPracy(){ return state.machines.filter(m=>statusMaszyny(m)==='pracuje'); }
function maszynyWWarsztacie(){ return state.machines.filter(m=>statusMaszyny(m)==='warsztat'); }
/* Rozbicie dnia na miejsca pracy — używane i w pasku statystyk, i w nagłówku „DZISIAJ". */
function dzisWgMiejsc(){
  const zd=zadaniaDzis();
  return Object.keys(MIEJSCA_PRACY).map(k=>[k, zd.filter(z=>miejsceKlucz(z)===k).length]).filter(([,n])=>n);
}

function renderPanelOperacyjny(){
  const o=(state.ui.pulpit&&state.ui.pulpit.otwarte)||[];
  const otw=k=>o.includes(k)?' otwarta':'';
  const fm=state.ui.pulpit.miejsce||'';
  const zdWszystkie=zadaniaDzis();
  const zd = fm ? zdWszystkie.filter(z=>miejsceKlucz(z)===fm) : zdWszystkie;
  const wPracy=maszynyWPracy(), wWarsztacie=maszynyWWarsztacie();

  const wiersz=z=>{
    const w=workerById(z.workerId), p=z.poleId?poleById(z.poleId):null;
    const c=z.ciagnikId?maszynaById(z.ciagnikId):null;
    const r=rodzajPracy(z);
    const M=miejscePracy(z);
    const cel = p ? esc(p.nazwa) : (z.klient?esc(z.klient):(jestPolowe(z)?null:M.krotko));
    const opis=[cel, w?esc(w.imie):null, c?esc(c.nazwa):null, z.opis?esc(z.opis):null].filter(Boolean).join(' · ');
    return `<div class="op-zad${zadanieTrwa(z)?' trwa':''}${z.status==='wykonane'?' zrobione':''}"
        onclick="idzDoZadania('${z.id}')" title="Otwórz zadanie">
      <span class="op-godz">${esc(z.od||'—')}</span>
      <span class="op-pasek" style="background:${r.kolor}"></span>
      <span class="op-t"><b>${z.status==='wykonane'?'✓ ':''}<span class="op-ikm">${M.ikona}</span>${esc(z.zadanie||r.label)}</b>
        <span class="op-sub">${opis||'—'}</span></span></div>`;
  };

  /* Maszyny zajęte — stan WYLICZANY z zadań (statusMaszyny), nigdzie nie zapisany.
     Rozdzielamy pole od warsztatu, bo to dwie różne wiadomości dla gospodarza: jedna maszyna
     zarabia, druga stoi u mechanika. Każdy człon jest odnośnikiem. */
  const wierszMaszyny=m=>{
    const z=aktywneZadanieMaszyny(m.id);
    const w=z?workerById(z.workerId):null, p=z&&z.poleId?poleById(z.poleId):null;
    return `<div class="op-masz">
      <span class="op-ik">${z&&jestWarsztat(z)?'🔧':(jestCiagnik(m)?'🚜':'🔧')}</span>
      <span class="op-t"><b><a class="fl-link" onclick="idzDoMaszyny('${m.id}')">${esc(m.nazwa)}</a></b>
        <span class="op-sub">${z?esc(z.zadanie||rodzajPracy(z).label):''}${z&&z.opis?' · '+esc(z.opis):''}${p?` · <a class="fl-link" onclick="pokazNaMapiePole('${p.id}')">${esc(p.nazwa)}</a>`:''}${w?` · <a class="fl-link" onclick="pokazPracownika('${w.id}')">${esc(w.imie)}</a>`:''}</span>
      </span></div>`;
  };
  const listaMaszyn=
      (wPracy.length?`<div class="op-grupa">W polu</div>`+wPracy.map(wierszMaszyny).join(''):'')
    + (wWarsztacie.length?`<div class="op-grupa">W warsztacie</div>`+wWarsztacie.map(wierszMaszyny).join(''):'');

  // „Do zrobienia" to TA SAMA lista co w Grafiku (`state.tasks`) — przeciągalna tam samo.
  const listaTodo=state.tasks.map(t=>
    `<div class="op-todo" draggable="true" ondragstart="dragZadanie(event,'${t.id}')">
      <span class="zas-uchwyt">⠿</span><span>${esc(t.nazwa)}</span></div>`).join('');

  const sekcja=(k,tytul,licznik,tresc,przycisk)=>`
    <div class="op-sekcja${otw(k)}">
      <button class="op-glowa" onclick="przelaczSekcjePulpit('${k}')">
        <span class="zas-strzalka">▸</span><span>${tytul}</span>
        ${licznik!=null?`<span class="zas-licznik">${licznik}</span>`:''}</button>
      <div class="op-tresc">${przycisk||''}${tresc}</div></div>`;

  /* Nagłówek dnia liczy się z CAŁEGO dnia, nie z tego, co zostało po filtrze — inaczej
     wybranie „Warsztat" pokazywałoby „3 zadania" i sugerowało, że tyle jest w ogóle. */
  const podsum=`<div class="op-dzis-sum">
    ${dzisWgMiejsc().map(([k,n])=>`<span><b>${n}</b>${esc(MIEJSCA_PRACY[k].krotko.toLowerCase())}</span>`).join('')
      || '<span>brak zadań</span>'}
    </div>
    <div class="op-chipy">
      <button class="gr-chip${fm?'':' akt'}" onclick="ustawPulpit('miejsce','')">Wszystkie</button>
      ${['pole','warsztat','transport'].map(k=>
        `<button class="gr-chip${fm===k?' akt':''}" onclick="ustawPulpit('miejsce','${k}')">${MIEJSCA_PRACY[k].ikona} ${MIEJSCA_PRACY[k].krotko}</button>`).join('')}
    </div>`;

  return `<aside class="panel-op">
    ${sekcja('dzis','DZISIAJ',zd.length, podsum+(zd.length?zd.map(wiersz).join('')
      :`<div class="op-pusto">Brak zadań na dziś. Zaplanuj pracę przyciskiem „+ Zadanie".</div>`))}
    ${sekcja('maszyny','MASZYNY ZAJĘTE',wPracy.length+wWarsztacie.length,
      listaMaszyn||`<div class="op-pusto">Żadna maszyna nie pracuje ani nie stoi w warsztacie.</div>`)}
    ${sekcja('todo','DO ZROBIENIA',state.tasks.length,
      listaTodo||`<div class="op-pusto">Lista pusta.</div>`,
      `<button class="btn small" style="width:100%;justify-content:center;margin-bottom:8px" onclick="dodajSzablon()">+ Dodaj zadanie</button>`)}
    ${sekcja('aktywnosc','AKTYWNOŚĆ',null,`<div class="op-akt">${feedItemsHtml(20)}</div>`)}
  </aside>`;
}
function ustawPulpit(k,v){ state.ui.pulpit[k]=v; save(); render(); }
/* „Warsztat" nie jest osobnym modułem — to te same zadania i te same maszyny, tylko
   zawężone. Trzeci widok tych samych danych musiałby być utrzymywany razem z dwoma
   pozostałymi i pierwszy rozjechałby się po zmianie. */
function pokazWarsztat(){ state.ui.flota.status='warsztat'; save(); goModule('flota'); }

function przelaczSekcjePulpit(k){
  const u=state.ui.pulpit=state.ui.pulpit||{otwarte:[]};
  const o=u.otwarte||[];
  u.otwarte = o.includes(k) ? o.filter(x=>x!==k) : [...o,k];
  save(); render();
}

/* Szybkie planowanie z Pulpitu — TEN SAM formularz co w Grafiku, tylko z wypełnionym
   polem (gdy przyszliśmy z mapy). Zapisane zadanie jest natychmiast w Grafiku, we Flocie,
   na mapie i na karcie pola, bo wszystkie czytają `state.schedule`. */
